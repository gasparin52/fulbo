  'voto-rapido': async (f, { id }) => {
    const stats = Object.fromEntries(STATS.map(s => [s.k, parseInt(f.get(s.k))]));
    const ok = await guardarVoto(id, stats);
    if (ok) ui.colaPos++;
    return ok;
  },
  'mvp-votar': async f => {
    const voto = f.get('voto');
    if (!voto) return toast('Elegí a alguien');
    const m = D.mvp;
    const ok = await act(() => F.setDoc(F.doc(colVotosMvp(D.gid, m.id), miUid()), { voto, ts: Date.now() }), `🏆 Votaste a ${nombreCandidato(m, voto)}`);
    if (ok) {
      ui.recalificar = (m.candidatos || []).filter(id => id !== miUid() && jugador(id));
      ui.modal = ui.recalificar.length ? 'recalificar' : null;
      render();
    }
    return ok;
  },
  reemplazar: async f => {
    const sale = ui.reemplazar, nombre = (f.get('nuevo') || '').trim();
    let entra = f.get('entra');
    if (!entra && !nombre) return toast('Elegí a alguien o escribí un nombre');
    if (nombre) entra = 'inv_' + genId(10);
    const ok = await actualizarGrupo(s => {
      const i = s.anotados.indexOf(sale);
      if (i < 0 || s.anotados.includes(entra)) return;
      if (nombre) s.invitados[entra] = { nombre, posicion: 'comodin' };
      const titulares = dividir(s).titulares;
      const alDia = s.equipos && s.equipos.base === baseKey(titulares);
      s.anotados[i] = entra;
      delete s.solicitudes[sale];
      // Entra en el mismo equipo; si los equipos estaban al día, siguen al día.
      if (s.equipos) {
        for (const k of ['A', 'B', 'SA', 'SB']) if (s.equipos[k]) s.equipos[k] = s.equipos[k].map(x => (x === sale ? entra : x));
        if (s.equipos.pos?.[sale]) s.equipos.pos[entra] = s.equipos.pos[sale];
        if (s.equipos.pos) delete s.equipos.pos[sale];
        if (alDia) s.equipos.base = baseKey(titulares.map(p => ({ id: p.id === sale ? entra : p.id })));
      }
    }, `⇄ ${jugador(sale)?.usuario || 'Jugador'} reemplazado`);
    if (ok) { ui.modal = null; render(); }
    return ok;
  },
  faltas: async f => {
    const m = D.mvp, uid = miUid();
    const marcados = new Set(f.getAll('falta'));
    const mios = D.reportes.filter(r => r.fecha === m.id && r.por === uid);
    const ok = await act(async () => {
      const b = F.writeBatch(db);
      m.candidatos.filter(id => marcados.has(id) && !mios.some(r => r.target === id))
        .forEach(id => b.set(F.doc(colReportes(D.gid), `${m.id}_${id}_${uid}`), { fecha: m.id, target: id, por: uid, ts: Date.now() }));
      mios.filter(r => !marcados.has(r.target)).forEach(r => b.delete(F.doc(colReportes(D.gid), r.id)));
      await b.commit();
    }, marcados.size ? '🟥 Enviado. Lo revisa un admin' : 'Listo');
    if (ok) { ui.modal = null; render(); }
    return ok;
  },
  'mvp-candidatos': async f => {
    const m = D.mvp;
    const candidatos = f.getAll('cand');
    const nuevo = (f.get('nuevo') || '').trim();
    if (nuevo) candidatos.push('inv_' + genId(10));
    if (!candidatos.length) return toast('Tiene que haber al menos un candidato');
    const nombres = Object.fromEntries(candidatos.map(id => [id, id === candidatos.at(-1) && nuevo ? nuevo : nombreCandidato(m, id)]));
    const ok = await act(() => F.updateDoc(refMvp(D.gid, m.id), { candidatos, nombres }), '💾 Candidatos actualizados');
    if (ok) { ui.modal = null; render(); }
    return ok;
  },
  partido: async f => {
    const cupo = Math.max(2, Math.min(30, parseInt(f.get('cupo')) || 10));
    // La ciudad se busca solo si cambió (el campo muestra el nombre que se guardó).
    const texto = (f.get('ciudad') || '').trim();
    let ciudad = D.grupo.ciudad || null;
    if (texto !== (ciudad?.nombre || '')) {
      if (!texto) ciudad = null;
      else {
        try { ciudad = await buscarCiudad(texto); }
        catch (e) { toast('❌ ' + (e.mensaje || 'No se pudo buscar la ciudad')); return false; }
      }
    }
    const ok = await actualizarGrupo(s => {
      const antes = s.partido;
      s.partido = { ...s.partido, titulo: f.get('titulo').trim(), fecha: f.get('fecha') || '', cuando: (c => horaDelPartido({ cuando: c }) || c)(normalizarHora(f.get('cuando').trim())), lugar: f.get('lugar').trim(), cupo, duracion: duracionDe({ duracion: parseInt(f.get('duracion')) }) };
      s.ciudad = ciudad;
      // "Esta y todas las siguientes": se cambia la fecha fija que generó esta fecha.
      if (f.get('alcance') === 'todas' && agendaActiva(s)) {
        const p = s.partido;
        const i = Math.max(0, s.agenda.slots.findIndex(x => antes.fecha && x.dia === diaDe(antes.fecha) && x.hora === antes.cuando));
        const x = s.agenda.slots[i];
        s.agenda.slots[i] = { dia: p.fecha ? diaDe(p.fecha) : x.dia, hora: horaValida(p.cuando) ? p.cuando : x.hora, lugar: p.lugar };
      }
    }, ciudad && ciudad.nombre !== D.grupo.ciudad?.nombre ? `💾 Partido guardado · clima de ${ciudad.nombre}` : '💾 Partido guardado');
    // El campo de ciudad muestra el nombre que encontró (puede diferir de lo escrito).
    if (ok) { const i = $('#p-ciudad'); if (i) i.value = ciudad?.nombre || ''; }
    return ok;
  },
  'fecha-partido': async f => {
    const fecha = f.get('fecha') || '', lugar = (f.get('lugar') || '').trim();
    const crudo = (f.get('cuando') || '').trim();
    const cuando = (c => horaDelPartido({ cuando: c }) || c)(normalizarHora(crudo));
    const repetir = !!f.get('repetir'), todas = f.get('alcance') === 'todas';
    if ((repetir || todas) && !fecha) return toast('Elegí la fecha del partido');
    if ((repetir || todas) && !horaValida(cuando)) return toast('Poné la hora como 20:00');
    const ok = await actualizarGrupo(s => {
      const antes = s.partido;
      s.partido = { ...s.partido, fecha, cuando, lugar };
      if (repetir && !agendaActiva(s)) s.agenda = { slots: [{ dia: diaDe(fecha), hora: cuando, lugar }], saltear: [] };
      // "Esta y todas las siguientes": se cambia la fecha fija que generó esta fecha.
      if (todas && agendaActiva(s)) {
        const i = Math.max(0, s.agenda.slots.findIndex(x => antes.fecha && x.dia === diaDe(antes.fecha) && x.hora === antes.cuando));
        s.agenda.slots[i] = { dia: diaDe(fecha), hora: cuando, lugar };
      }
    }, repetir ? '🔁 Guardado: se juega todas las semanas' : '💾 Fecha guardada');
    if (ok) { ui.modal = null; render(); }
    return ok;
  },
  invitado: f => {
    const id = 'inv_' + genId(10);
    const nivel = Number(f.get('nivel'));
    return actualizarGrupo(s => {
      s.invitados[id] = { nombre: f.get('nombre').trim(), posicion: f.get('posicion') };
      s.anotados.push(id);
    }, 'Invitado anotado').then(ok => ok && nivel !== NIVEL_DEFAULT ? guardarNivel(id, nivel).then(() => ok) : ok);
  },
};

document.addEventListener('click', e => {
  cerrarDesplegables(e.target.closest('[data-desplegable]'));
  const b = e.target.closest('[data-action]');
  if (!b) return;
  if ('fondo' in b.dataset && e.target !== b) return;  // clic dentro del modal: no lo cierra
  if (b.dataset.action === 'ampliar') {
    e.preventDefault();
    ui.fotoGrande = { src: b.src, alt: b.alt, redonda: 'redonda' in b.dataset };
    ui.modal = 'foto';
    return render();
  }
  acciones[b.dataset.action]?.(b.dataset);
});
// Arrastrar y soltar en la cancha: soltar a un jugador sobre un lugar es lo mismo que
// elegirlo y tocar ese lugar (mismas reglas: si está ocupado se intercambian, etc.).
// Soltarlo afuera de la cancha lo deja sin lugar. Con el dedo, la foto va un poco más
// arriba para que el dedo no la tape, y cuenta donde está la foto, no el dedo.
let arrastre = null, sinClic = false;
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-arrastra]');
  if (!el || e.button > 0) return;
  if (e.pointerType === 'mouse') e.preventDefault();  // que no arrastre la imagen sola
  arrastre = { id: el.dataset.arrastra, el, x: e.clientX, y: e.clientY, alto: e.pointerType === 'mouse' ? 0 : 60, fantasma: null, sobre: null };
});
const lugarEn = (x, y) => document.elementFromPoint(x, y)?.closest('[data-action="tocar-lugar"]');
const enCancha = (x, y) => !!document.elementFromPoint(x, y)?.closest('[data-cancha]');
document.addEventListener('pointermove', e => {
  const a = arrastre;
  if (!a) return;
  if (!a.fantasma) {
    if (Math.hypot(e.clientX - a.x, e.clientY - a.y) < 8) return;
    a.fantasma = document.createElement('div');
    a.fantasma.style.cssText = 'position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) scale(1.2);border-radius:9999px;box-shadow:0 0 0 4px #fff,0 12px 30px rgba(0,0,0,.6);transition:box-shadow .15s';
    a.fantasma.innerHTML = avatar(jugador(a.id), 48);
    document.body.appendChild(a.fantasma);
    a.el.style.opacity = '.3';
  }
  const x = e.clientX, y = e.clientY - a.alto;
  a.fantasma.style.left = x + 'px';
  a.fantasma.style.top = y + 'px';
  const sobre = lugarEn(x, y);
  if (sobre !== a.sobre) {
    a.sobre?.classList.remove('scale-125');
    sobre?.classList.add('scale-125');
    a.sobre = sobre;
  }
  // Afuera de la cancha: borde rojo (si lo suelta ahí, queda sin lugar).
  a.fantasma.style.boxShadow = `0 0 0 4px ${enCancha(x, y) ? '#fff' : '#f87171'},0 12px 30px rgba(0,0,0,.6)`;
});
function terminarArrastre(e, soltar) {
  const a = arrastre;
  arrastre = null;
  if (!a?.fantasma) return;
  a.fantasma.remove();
  a.el.style.opacity = '';
  a.sobre?.classList.remove('scale-125');
  sinClic = true;  // el clic que viene después de soltar no cuenta
  setTimeout(() => { sinClic = false; }, 60);
  if (!soltar) return;
  const x = e.clientX, y = e.clientY - a.alto;
  const lugar = lugarEn(x, y);
  if (lugar) {
    if (puedeEditarEquipos()) ui.elegidoCancha = a.id;
    return acciones['tocar-lugar'](lugar.dataset);
  }
  if (!enCancha(x, y) && D.grupo.equipos?.pos?.[a.id]) sacarDeLugar(a.id);
}
document.addEventListener('pointerup', e => terminarArrastre(e, true));
// Que mantener el dedo sobre la foto no arranque el arrastre ni el menú del navegador.
for (const t of ['dragstart', 'contextmenu']) document.addEventListener(t, e => { if (e.target.closest?.('[data-arrastra]')) e.preventDefault(); });
document.addEventListener('pointercancel', e => terminarArrastre(e, false));
document.addEventListener('click', e => { if (sinClic) { e.stopPropagation(); e.preventDefault(); } }, true);
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el) cambios[el.dataset.change]?.(el, el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id) t.dataset.dirty = '1';
  if (t.dataset.out) document.getElementById(t.dataset.out).textContent = t.value;
  if (t.dataset.gol) sumarGoles();
  if (t.id === 'l-usuario') actualizarAvisoUsuario();
  if (t.id === 'pf-cuadro-buscar') { ui.cuadroFiltro = t.value; filtrarCuadros(); }
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const btn = form.querySelector('button:not([type=button])');
  if (btn) btn.disabled = true;
  try {
    if (await formularios[form.dataset.form]?.(new FormData(form), form.dataset)) {
      form.querySelectorAll('[data-dirty]').forEach(i => delete i.dataset.dirty);
      if (['crear-grupo', 'unirse', 'invitado', 'cambiar-clave'].includes(form.dataset.form)) {
        form.reset();
        form.querySelectorAll('[data-out]').forEach(i => (document.getElementById(i.dataset.out).textContent = i.value));
      }
      form._html = null;
      render();
    }
  } finally {
    if (btn && btn.isConnected) btn.disabled = false;
  }
});

leerInvitacion();
render();
// La votación abre y cierra por horario: revisar cada medio minuto.
setInterval(() => { actualizarSubsMvp(); cargarHistorialMvp(); render(); }, 30000);
</script>
