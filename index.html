function indicadorClima() {
  const c = estadoClima();
  if (!c) return '';
  if (c.lejos) return '<p class="mt-4 text-xs text-slate-500 rounded-xl border border-dashed border-slate-700 px-3 py-2">🌤️ El pronóstico aparece cuando faltan 16 días o menos</p>';
  const [icono, cielo] = cieloDe(c.codigo, c.dia);
  // El fondo cambia según el tiempo: lluvia, sol, noche despejada o nublado.
  const mojado = c.lluvia >= 50 || (c.codigo >= 51 && c.codigo <= 67) || c.codigo >= 80;
  const tema = mojado ? 'from-sky-600/30 via-blue-800/20 to-slate-900/40 border-sky-500/30'
    : c.codigo <= 2 && c.dia ? 'from-amber-400/25 via-orange-500/10 to-slate-900/40 border-amber-400/30'
    : c.codigo <= 2 ? 'from-indigo-600/30 via-violet-800/15 to-slate-900/40 border-indigo-400/30'
    : 'from-slate-500/25 via-slate-700/20 to-slate-900/40 border-slate-500/30';
  const consejo = c.lluvia >= 70 ? '☔ Muy probable que llueva' : c.lluvia >= 40 ? '🌂 Puede llover' : c.viento >= 35 ? '🌬️ Mucho viento' : c.temp >= 30 ? '🥵 Llevá agua' : c.temp <= 8 ? '🧤 Abrigate' : '';
  const abierto = !!ui.climaAbierto;
  // Cerrado: una fila con lo justo. Tocándola se despliega el detalle.
  const dato = (titulo, valor, alerta, color, pct) => `
    <div class="flex-1 rounded-lg bg-slate-950/40 px-3 py-1.5">
      <div class="text-[10px] uppercase tracking-wide text-slate-400">${titulo}</div>
      <div class="font-bold ${alerta ? color : 'text-slate-100'}">${valor}</div>
      ${pct != null ? `<div class="mt-1 h-1 rounded-full bg-slate-700/70 overflow-hidden"><div class="h-full rounded-full bg-sky-400" style="width:${pct}%"></div></div>` : ''}
    </div>`;
  return `
    <div class="mt-3 rounded-xl border bg-gradient-to-br ${tema} text-sm">
      <button data-action="toggle-clima" aria-expanded="${abierto}" class="w-full flex items-center gap-2.5 px-3 py-2 text-left">
        <span class="text-xl leading-none">${icono}</span>
        <span class="font-bold text-slate-100">${Math.round(c.temp)}°</span>
        <span class="text-slate-300 truncate">${cielo}</span>
        <span class="ml-auto flex items-center gap-2.5 shrink-0 text-xs">
          <span class="${c.lluvia >= 50 ? 'text-sky-300 font-semibold' : 'text-slate-400'}">💧 ${c.lluvia}%</span>
          <span class="${c.viento >= 30 ? 'text-amber-300 font-semibold' : 'text-slate-400'}">💨 ${Math.round(c.viento)}</span>
          <span class="text-slate-400 transition-transform ${abierto ? 'rotate-180' : ''}">▾</span>
        </span>
      </button>
      ${abierto ? `
        <div class="px-3 pb-3">
          ${consejo ? `<p class="text-xs font-semibold text-slate-200 mb-2">${consejo}</p>` : ''}
          <div class="flex gap-2">
            ${dato('💧 Lluvia', `${c.lluvia}%`, c.lluvia >= 50, 'text-sky-300', c.lluvia)}
            ${dato('💨 Viento', `${Math.round(c.viento)} <span class="text-xs font-medium">km/h</span>`, c.viento >= 30, 'text-amber-300')}
          </div>
          <p class="mt-2 text-[11px] text-slate-400">Pronóstico para el ${esc(fechaLinda(D.grupo.partido.fecha))} a las ${esc(c.hora)} en ${esc(D.grupo.ciudad.nombre)} · se actualiza cada media hora</p>
        </div>` : ''}
    </div>`;
}

// "Hoy" / "Mañana" al lado de la fecha del partido.
function cuantoFalta(fecha) {
  if (!fecha) return '';
  const dias = Math.round((Date.parse(fecha + 'T12:00:00Z') - Date.parse(hoyArg() + 'T12:00:00Z')) / DIA);
  return dias === 0 ? 'Hoy' : dias === 1 ? 'Mañana' : dias > 1 && dias < 7 ? `En ${dias} días` : '';
}

// Debajo de la fecha, corto: "Todos los viernes" (la hora ya está al lado). Saltear una
// fecha (feriado, etc.) se hace desde el cartel de la fecha.
function lineaAgenda() {
  const g = D.grupo;
  if (!agendaActiva(g)) return '';
  const dias = [...new Set(g.agenda.slots.map(x => DIAS_PLURAL[x.dia]))];
  return `<p class="mt-1.5 text-xs text-slate-500">${ic('repeat', 'text-emerald-400')} Todos los ${esc(dias.join(' y '))}</p>`;
}

function formAgenda() {
  const g = D.grupo, p = g.partido;
  // agendaBorrador: las filas como quedaron después de sacar una con la X (hasta guardar).
  const slots = ui.agendaBorrador || (g.agenda?.slots?.length ? g.agenda.slots : [{ dia: p.fecha ? diaDe(p.fecha) : 5, hora: horaValida(p.cuando) ? p.cuando : '20:00', lugar: p.lugar }]);
  const filas = Math.min(3, Math.max(slots.length, ui.agendaFilas || 1));
  const fila = i => {
    const x = slots[i] || { dia: '', hora: '', lugar: '' };
    const sacar = filas > 1;
    return `
      <div class="grid ${sacar ? 'grid-cols-[1fr_5.5rem_2.75rem] sm:grid-cols-[9rem_5.5rem_1fr_2.75rem]' : 'grid-cols-[1fr_5.5rem] sm:grid-cols-[9rem_5.5rem_1fr]'} gap-2">
        ${desplegable({ id: `ag-dia-${i}`, name: 'dia', valor: x.dia, vacio: 'Día', opciones: DIAS.map((n, k) => ({ v: k, t: n[0].toUpperCase() + n.slice(1) })) })}
        <input id="ag-hora-${i}" name="hora" value="${esc(x.hora)}" placeholder="20:00" maxlength="5" class="${INPUT}">
        ${sacar ? `<button type="button" data-action="agenda-sacar" data-i="${i}" aria-label="Sacar este día" title="Sacar este día" class="rounded-xl border border-slate-700 bg-slate-800 text-slate-400 hover:text-red-300 hover:bg-red-950 grid place-items-center sm:order-last">${ic('x')}</button>` : ''}
        <input id="ag-lugar-${i}" name="lugarFijo" value="${esc(x.lugar || '')}" placeholder="Lugar (si cambia)" maxlength="60" class="${INPUT} ${sacar ? 'col-span-3' : 'col-span-2'} sm:col-span-1">
      </div>`;
  };
  return `
    <form data-form="agenda" class="mt-6 space-y-2 rounded-xl border border-slate-800 p-3">
      <h3 class="font-semibold text-sm text-slate-300">${ic('repeat')} Fecha fija ${agendaActiva(g) ? '<span class="text-xs font-normal text-emerald-400">activa</span>' : ''}</h3>
      <p class="text-xs text-slate-500">Si juegan siempre el mismo día, cargalo acá. Cuando termina un partido, la lista se vacía sola y se abre la fecha siguiente (la votación del mejor queda guardada).</p>
      ${Array.from({ length: filas }, (_, i) => fila(i)).join('')}
      ${filas < 3 ? '<button type="button" data-action="agenda-mas" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-400">+ Otro día de la semana</button>' : ''}
      <div class="flex gap-2 pt-1">
        <button class="${BTN} flex-1 bg-slate-700 hover:bg-slate-600 text-sm">${ic('save')} ${agendaActiva(g) ? 'Guardar fecha fija' : 'Activar fecha fija'}</button>
        ${agendaActiva(g) ? `<button type="button" data-action="agenda-quitar" class="${BTN} bg-slate-800 hover:bg-red-950 text-red-300 text-sm">Desactivar</button>` : ''}
      </div>
    </form>`;
}

// Fecha, hora y lugar del partido (el admin toca la fecha en Partido). Desde acá también se
// activa la fecha fija: "Se juega todas las semanas" usa el día de esa fecha y esa hora.
function modalFecha() {
  const g = D.grupo, p = g.partido, fija = agendaActiva(g);
  const hora = horaDelPartido(p) || '';
  return modal(`
    <div class="flex items-start justify-between gap-3 mb-3">
      <h2 class="text-lg font-bold">${ic('calendar', 'text-emerald-400')} Fecha del partido</h2>
      <button data-action="cerrar-modal" aria-label="Cerrar" class="${BTN_ICONO} !w-9 !h-9">${ic('x')}</button>
    </div>
    <form data-form="fecha-partido" class="space-y-3">
      <div class="grid grid-cols-[1fr_6.5rem] gap-2">
        <label class="text-sm text-slate-400">Fecha<input id="fp-fecha" name="fecha" type="date" value="${esc(p.fecha)}" class="${INPUT} mt-1"></label>
        <label class="text-sm text-slate-400">Hora<input id="fp-hora" name="cuando" value="${esc(hora || p.cuando)}" placeholder="20:00" maxlength="5" inputmode="numeric" class="${INPUT} mt-1"></label>
      </div>
      <label class="block text-sm text-slate-400">Dónde<input id="fp-lugar" name="lugar" value="${esc(p.lugar)}" placeholder="Cancha" maxlength="60" class="${INPUT} mt-1"></label>
      ${fija ? `
        <div class="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-3 text-sm space-y-1">
          <p class="font-semibold text-emerald-300">${ic('repeat')} Fecha fija: ${esc(textoAgenda(g.agenda))}</p>
          <p class="text-xs text-slate-400">Si cambiás algo…</p>
          <label class="flex items-center gap-2 py-1"><input type="radio" name="alcance" value="esta" checked class="accent-emerald-500"> Solo para esta fecha</label>
          <label class="flex items-center gap-2 py-1"><input type="radio" name="alcance" value="todas" class="accent-emerald-500"> Para esta y todas las siguientes</label>
          ${(() => {
            const lista = ocurrencias(g.agenda, p.fecha || ayerArg(), 3, true);
            return lista.length ? `
              <p class="text-xs text-slate-400 pt-2">Próximas (tocá una para no jugar esa fecha, por feriado o lo que sea):</p>
              <div class="flex flex-wrap gap-1.5">
                ${lista.map(o => `<button type="button" data-action="saltear" data-fecha="${o.fecha}" class="rounded-lg px-2.5 py-1 text-xs font-semibold ${o.salteada ? 'bg-slate-800 text-slate-500 line-through' : 'bg-slate-800 text-slate-200 hover:bg-slate-700'}">${esc(fechaLinda(o.fecha))}</button>`).join('')}
              </div>` : '';
          })()}
          <button type="button" data-action="agenda-quitar" class="text-xs text-red-300 hover:text-red-200 pt-1">Dejar de repetir</button>
        </div>`
      : `
        <label class="flex items-start gap-3 rounded-xl border border-slate-700 bg-slate-800/40 p-3 cursor-pointer">
          <input type="checkbox" name="repetir" class="mt-1 w-4 h-4 accent-emerald-500">
          <span class="text-sm"><b class="text-slate-100">${ic('repeat', 'text-emerald-400')} Se juega todas las semanas</b>
            <span class="block text-xs text-slate-400 mt-0.5">Mismo día y hora. Cuando termina un partido, se abre sola la fecha siguiente. Para jugar más de un día por semana, en Administrar → Partido → Fecha fija.</span></span>
        </label>`}
      <button class="${BTN_OK} w-full">${ic('save')} Guardar</button>
    </form>`);
}

function header(d) {
  const p = D.grupo.partido;
  const faltan = d.cupo - d.titulares.length;
  const falta = cuantoFalta(p.fecha);
  const fecha = fechaLinda(p.fecha);
  const chip = 'inline-flex items-center gap-1.5 rounded-lg bg-slate-800/70 border border-slate-700/60 px-2.5 py-1';
  const editaFecha = esAdmin();
  const mapa = p.lugar ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.lugar, D.grupo.ciudad?.nombre].filter(Boolean).join(', '))}` : '';
  return `
    <div>
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <h1 class="text-3xl font-black tracking-tight">${esc(p.titulo || 'Fulbo ⚽')}</h1>
          <p class="text-xs font-semibold text-emerald-300/80 mt-0.5">${modalidadDe(d.cupo)}</p>
          <div class="mt-2 flex flex-wrap gap-1.5 text-sm">
            ${fecha ? `<${editaFecha ? 'button data-action="editar-fecha" title="Cambiar fecha, hora o lugar"' : 'span'} class="${chip} ${editaFecha ? 'hover:border-slate-500' : ''}">${ic('calendar', 'text-slate-400')} <b class="font-semibold text-slate-100">${esc(fecha[0].toUpperCase() + fecha.slice(1))}</b>${falta ? `<span class="text-[11px] font-semibold rounded px-1.5 py-0.5 bg-emerald-500/15 text-emerald-300">${falta}</span>` : ''}${editaFecha ? ic('pencil', 'text-slate-500 !w-3.5 !h-3.5') : ''}</${editaFecha ? 'button' : 'span'}>`
              : editaFecha ? `<button data-action="editar-fecha" class="${chip} border-dashed border-emerald-500/50 text-emerald-300 hover:border-emerald-400">${ic('calendar-plus')} <b class="font-semibold">Poner fecha</b></button>` : ''}
            ${p.cuando ? `<${editaFecha ? 'button data-action="editar-fecha" title="Cambiar fecha, hora o lugar"' : 'span'} class="${chip} ${editaFecha ? 'hover:border-slate-500' : ''}">${ic('clock', 'text-slate-400')} <b class="font-semibold text-slate-100">${esc(p.cuando)}</b></${editaFecha ? 'button' : 'span'}>` : ''}
            ${p.lugar ? `<a href="${esc(mapa)}" target="_blank" rel="noopener" title="Ver en el mapa" class="${chip} min-w-0 hover:border-slate-500">${ic('map-pin', 'text-slate-400')} <b class="font-semibold text-slate-100 truncate">${esc(p.lugar)}</b></a>` : ''}
          </div>
          ${lineaAgenda()}
        </div>
        <div class="text-right shrink-0">
          <div class="text-3xl font-black ${faltan <= 0 ? 'text-emerald-400' : ''}">${d.titulares.length}<span class="text-slate-500 text-xl">/${d.cupo}</span></div>
          <div class="text-xs text-slate-400">${faltan > 0 ? `faltan ${faltan}` : '¡completo!'}</div>
        </div>
      </div>
      <div class="mt-3 h-2 rounded-full bg-slate-800 overflow-hidden">
        <div class="h-full bg-emerald-500 transition-all" style="width:${Math.min(100, (d.titulares.length / d.cupo) * 100)}%"></div>
      </div>
      ${indicadorClima()}
    </div>`;
}

function miEstado(d) {
  const uid = miUid();
  const iT = d.titulares.findIndex(p => p.id === uid);
  const iS = d.suplentes.findIndex(p => p.id === uid);
  const anotado = iT >= 0 || iS >= 0;
  const estado = iT >= 0 ? `<span class="text-emerald-400">${ic('circle-check')} Estás anotado · titular #${iT + 1}</span>`
    : iS >= 0 ? `<span class="text-amber-400">${ic('hourglass')} Estás de suplente S${iS + 1}</span>`
    : D.grupo.publico.includes(uid) ? `<span class="text-sky-300">${ic('megaphone')} Vas a la tribuna (no jugás)</span>`
    : `<span class="text-slate-400">No estás anotado para este partido</span>`;
  const lleno = d.titulares.length >= d.cupo;
  const tribuna = !D.grupo.partido.suspendido && (D.grupo.publico.includes(uid)
    ? `<button data-action="publico-no" class="${BTN_CHIP} w-full mt-2 !py-2">Ya no voy a la tribuna</button>`
    : `<button data-action="publico-si" class="${BTN_SEC} w-full mt-2 text-sm inline-flex items-center justify-center gap-1.5">${ic('megaphone')} No juego, voy a la tribuna</button>`);
  return card(`
    <p class="text-sm">${estado}</p>
    ${castigado(uid) ? `<p class="mt-2 text-xs text-red-200 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2">🟥 Tenés una tarjeta roja por faltar sin avisar: esta fecha, si se llena la lista, los que se anoten después te pasan adelante y quedás de suplente.</p>` : ''}
    ${listaBloqueada()
      ? `<p class="mt-3 text-xs text-slate-400">${fasePartido() === 'enjuego' ? '⚽ El partido está en juego' : '🏁 El partido terminó'}: la lista está cerrada.</p>`
      : anotado
      ? `<button data-action="bajar" data-id="${uid}" class="${BTN} w-full mt-3 bg-slate-800 hover:bg-red-950 text-red-300 border border-red-900/50">Me bajo 😢</button>`
      : `<button data-action="anotarme" class="${BTN_OK} w-full mt-3 text-lg">⚽ ¡Me anoto!${lleno ? ' <span class="text-sm font-medium">(entrás de suplente)</span>' : ''}</button>${tribuna || ''}`}
  `);
}

function filaJugador(p, etiqueta, clase) {
  // Cada uno se baja con "Me bajo"; sacar a otros de la lista es cosa del admin.
  const puedeBorrar = esAdmin();
  const nombre = `<span class="block font-medium truncate">${esc(p.usuario)}${estrellasDe(p.id) ? ` <span class="text-xs text-amber-300" title="Jugador del partido ${estrellasDe(p.id)} ${estrellasDe(p.id) === 1 ? 'vez' : 'veces'}">⭐${estrellasDe(p.id) > 1 ? estrellasDe(p.id) : ''}</span>` : ''}${marcaLesion(p.id)}${marcaRoja(p.id)}${marcaAsistencia(p.id)}${marcaHater(p.id)}${marcaScout(p.id)}${p.id === miUid() ? ' <span class="text-xs text-emerald-400">(vos)</span>' : ''}${p.invitado ? ' <span class="text-xs text-slate-500">(invitado)</span>' : ''}</span>`;
  return `
    <li class="flex items-center gap-3 py-2">
      <span class="w-9 shrink-0 text-center text-xs font-bold rounded-lg py-1 ${clase}">${etiqueta}</span>
      ${avatar(p, 32)}
      <a href="#/jugador/${p.id}" class="flex-1 min-w-0 hover:text-emerald-300">${nombre}
        <span class="text-xs text-slate-400">${pos(p).emoji} ${pos(p).label}</span>
      </a>
      ${esAdmin() ? `<span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-800 ${colorNota(puntaje(p.id))}" title="Puntaje para equilibrar">${puntaje(p.id).toFixed(1)}</span>` : ''}
      ${puedeBorrar ? `<button data-action="bajar" data-id="${p.id}" title="Sacar de la lista" aria-label="Sacar a ${esc(p.usuario)} de la lista" class="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:text-red-300 hover:bg-red-500/10 transition shrink-0">${ICONO_SACAR}</button>` : ''}
    </li>`;
}

function lista(d) {
  const libres = Array.from({ length: Math.max(0, d.cupo - d.titulares.length) }, (_, i) => `
    <li class="flex items-center gap-3 py-2 opacity-40">
      <span class="w-9 shrink-0 text-center text-xs font-bold rounded-lg py-1 border border-dashed border-slate-600">${d.titulares.length + i + 1}</span>
      <span class="text-sm italic text-slate-500">libre</span>
    </li>`).join('');
  return card(`
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-lg font-bold">${ic('circle-check', 'text-emerald-400')} Titulares</h2>
      <button data-action="copiar" class="${BTN} bg-green-600 hover:bg-green-500 text-white text-sm py-2">${ic('copy')} Copiar para WhatsApp</button>
    </div>
    <ul class="divide-y divide-slate-800">
      ${d.titulares.map((p, i) => filaJugador(p, i + 1, 'bg-emerald-500/15 text-emerald-300')).join('')}
      ${libres}
    </ul>
    ${d.suplentes.length ? `
      <h3 class="text-base font-bold mt-5 mb-1">${ic('repeat', 'text-amber-300')} Suplentes</h3>
      <ul class="divide-y divide-slate-800">
        ${d.suplentes.map((p, i) => filaJugador(p, 'S' + (i + 1), 'bg-amber-500/15 text-amber-300')).join('')}
      </ul>` : ''}
    ${esAdmin() && D.grupo.anotados.length ? `<button data-action="reemplazar" class="${BTN_SEC} w-full mt-4 text-sm inline-flex items-center justify-center gap-2">${ICONO_REEMPLAZAR} Reemplazar a alguien</button>` : ''}
  `);
}

// Los que van a ver el partido: no juegan, pero así saben quién más va.
function tarjetaPublico() {
  const yo = miUid();
  const gente = D.grupo.publico.filter(id => jugador(id) || D.miembros[id]).map(id => ({ id, ...(jugador(id) || D.miembros[id]) }));
  const voy = D.grupo.publico.includes(yo);
  const puedo = !D.grupo.anotados.includes(yo) && fasePartido() !== 'terminado' && !D.grupo.partido.suspendido;
  if (!gente.length && !puedo) return '';
  return card(`
    <div class="flex items-center justify-between gap-2">
      <h2 class="text-base font-bold">${ic('megaphone', 'text-amber-300')} Tribuna${gente.length ? ` <span class="text-slate-400 font-medium">(${gente.length})</span>` : ''}</h2>
      ${puedo ? (voy
        ? `<button data-action="publico-no" class="${BTN_SEC} text-xs py-1.5">Ya no voy</button>`
        : `<button data-action="publico-si" class="${BTN_SEC} text-xs py-1.5">${ic('megaphone')} Voy a la tribuna</button>`) : ''}
    </div>
    ${gente.length ? `
      <ul class="mt-3 flex flex-wrap gap-2">
        ${gente.map(p => `
          <li class="inline-flex items-center gap-1.5 rounded-full bg-slate-800/70 pl-1 pr-3 py-1 text-sm">
            ${avatar(p, 24)}
            <span>${esc(p.usuario)}${marcaLesion(p)}${p.id === yo ? ' <span class="text-xs text-emerald-400">(vos)</span>' : ''}</span>
          </li>`).join('')}
      </ul>` : `<p class="mt-1 text-xs text-slate-500">¿No jugás pero vas a ir a alentar? Sumate a la tribuna, así saben quién más va.</p>`}
  `);
}

function equipos(d) {
  const eq = D.grupo.equipos;
  const editor = puedeEditarEquipos();
  const vigentes = eq && !equiposDesactualizados(d);
  const botones = editor ? `
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button data-action="armar" data-modo="equilibrado" ${d.titulares.length < 2 ? 'disabled' : ''} class="${BTN_OK} text-sm">${ic('scale')} Armar equilibrados</button>
      <button data-action="armar" data-modo="aleatorio" ${d.titulares.length < 2 ? 'disabled' : ''} class="${BTN_SEC} text-sm">🎲 Aleatorio</button>
    </div>
    ${eq ? `<button data-action="borrar-equipos" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-500 hover:text-red-300 mt-2">Borrar equipos</button>` : ''}` : '';
  if (!eq) {
    return card(`
      <h2 class="text-lg font-bold">${ic('swords', 'text-emerald-400')} Equipos</h2>
      <p class="text-sm text-slate-400 mt-1">Todavía no se armaron los equipos.</p>
      ${botones}`);
  }
  const solicitudes = Object.entries(D.grupo.solicitudes).filter(([id, s]) => jugador(id) && equipoDe(id) && equipoDe(id) !== s.a);
  // Las flechas y los botones de armar aparecen solo en modo edición (admins y armadores).
  const editando = editor && vigentes && ui.editarEquipos;
  const mover = (p, e) => editando ? `<button data-action="mover-equipo" data-id="${p.id}" title="Pasar al ${NOMBRE_EQUIPO[otroEquipo(e)]}" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs shrink-0">${e === 'A' ? '→' : '←'}</button>` : '';
  const prom = e => { const js = eq[e].map(jugador).filter(Boolean); return js.reduce((t, p) => t + puntaje(p.id), 0) / (js.length || 1); };
  const columna = (e, borde, fondo, texto) => {
    const js = eq[e].map(jugador).filter(Boolean);
    const sups = vigentes ? suplentesDe(e, d) : [];
    return `
      <div class="rounded-2xl border-t-4 ${borde} ${fondo} p-3">
        <ul class="space-y-2">
          ${js.map(p => `
            <li class="flex items-center gap-2.5">
              ${avatar(p, 30)}
              <a href="#/jugador/${p.id}" class="flex-1 min-w-0">
                <span class="block font-semibold truncate">${esc(p.usuario)}${marcaLesion(p)}${D.grupo.solicitudes[p.id] && solicitudes.some(([id]) => id === p.id) ? ' <span title="Pidió cambiarse" class="text-sky-300">' + ic('arrow-left-right') + '</span>' : ''}</span>
                <span class="block text-[11px] text-slate-500">${pos(p).emoji} ${pos(p).corto}</span>
              </a>
              <span class="opacity-70">${chipNota(p.id)}</span>
              ${mover(p, e)}
            </li>`).join('')}
        </ul>
        ${sups.length ? `
          <div class="mt-3 pt-2 border-t border-slate-700/50">
            <p class="text-[11px] font-semibold uppercase tracking-wide text-amber-300/80 mb-1.5">${ic('repeat')} Suplentes</p>
            <ul class="space-y-1.5 text-sm text-slate-300">
              ${sups.map(p => `
                <li class="flex items-center gap-2">
                  <span class="text-[10px] font-bold rounded px-1.5 py-0.5 bg-amber-500/15 text-amber-300 shrink-0">S${d.suplentes.indexOf(p) + 1}</span>
                  ${avatar(p, 22)}
                  <a href="#/jugador/${p.id}" class="truncate flex-1">${esc(p.usuario)}${marcaLesion(p)}</a>
                  <span class="text-xs">${pos(p).emoji}</span>
                  <span class="opacity-70">${chipNota(p.id)}</span>
                  ${mover(p, e)}
                </li>`).join('')}
            </ul>
          </div>` : ''}
      </div>`;
  };

  // Pedido propio para cambiarse (solo si no puede moverse solo).
  const yo = miUid(), miEquipo = equipoDe(yo), miSolicitud = D.grupo.solicitudes[yo];
  const abiertos = vigentes && miEquipo && !editor && !equiposCerrados();
  const pedido = abiertos ? (miSolicitud && miSolicitud.a !== miEquipo
    ? `<div class="flex items-center justify-between gap-2 text-xs bg-sky-500/10 border border-sky-500/20 rounded-xl px-3 py-2">
         <span>${ic('arrow-left-right')} Pediste pasar al ${NOMBRE_EQUIPO[miSolicitud.a]}.</span>
         <button data-action="cancelar-solicitud" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-400">Cancelar</button>
       </div>`
    : `<button data-action="pedir-cambio" class="${BTN_SEC} w-full text-xs py-2">${ic('arrow-left-right')} Pasarme al otro equipo</button>`) : '';

  const pendientes = editor && vigentes && solicitudes.length ? `
    <div class="mt-3 rounded-xl border border-sky-500/30 bg-sky-500/5 p-3">
      <h3 class="text-sm font-bold mb-2">${ic('arrow-left-right')} Pedidos de cambio (${solicitudes.length})</h3>
      <ul class="space-y-2">
        ${solicitudes.map(([id, s]) => `
          <li class="flex items-center gap-2 text-sm">
            ${avatar(jugador(id), 24)}
            <span class="flex-1 min-w-0 truncate"><b>${esc(jugador(id).usuario)}</b> quiere pasar al ${NOMBRE_EQUIPO[s.a]}</span>
            <button data-action="aprobar-cambio" data-id="${id}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-emerald-500 text-slate-950">Aprobar</button>
            <button data-action="rechazar-cambio" data-id="${id}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800 text-slate-300">Rechazar</button>
          </li>`).join('')}
      </ul>
    </div>` : '';

  // Pedidos para rehacer los equipos: todos ven cuántos; quiénes, solo los admins.
  const nRehacer = vigentes ? pedidosRehacer() : 0;
  const quienes = esAdmin() ? quienesRehacer().map(id => jugador(id)?.usuario || D.miembros[id]?.usuario).filter(Boolean) : [];
  const umbral = umbralRehacer(d), pct = Math.min(100, Math.round(100 * nRehacer / umbral));
  const avisoRehacer = nRehacer ? `
    <div class="mt-3 text-xs" title="Con ${umbral} (el ${Math.round(PORCENTAJE_REHACER * 100)}% de los titulares) se rehacen solos, equilibrados">
      <div class="flex items-center gap-2">
        <span class="shrink-0">🙋 <b>${nRehacer}</b> de ${umbral} pidieron rehacerlos</span>
        <div class="flex-1 h-1.5 rounded-full bg-slate-800 overflow-hidden"><div class="h-full rounded-full bg-violet-400 transition-all" style="width:${pct}%"></div></div>
        <span class="font-bold text-violet-300">${pct}%</span>
      </div>
      ${quienes.length ? `<p class="text-violet-200/70 mt-1">${quienes.map(esc).join(', ')} <span class="text-slate-500">(solo lo ven los admins)</span></p>` : ''}
    </div>` : '';
  const yaPedi = D.rehacer.some(r => r.id === yo && r.ronda === rondaActual());
  const botonRehacer = abiertos && rondaActual() ? (yaPedi
    ? `<button data-action="rehacer-cancelar" class="${BTN} w-full text-xs py-2 bg-violet-500/15 text-violet-200 border border-violet-500/30" title="Nadie ve quién lo pidió">🙋 Pediste rehacerlos · Cancelar</button>`
    : `<button data-action="rehacer-pedir" class="${BTN_SEC} w-full text-xs py-2">🙋 Pedir rehacerlos</button>`) : '';

  const modo = eq.editado ? ic('pencil') + ' editado a mano' : eq.modo === 'aleatorio' ? '🎲 aleatorio' : ic('scale') + ' equilibrado';
  const dif = Math.abs(prom('A') - prom('B'));
  return card(`
    <div class="flex items-center justify-between gap-2">
      <h2 class="text-lg font-bold">${ic('swords', 'text-emerald-400')} Equipos</h2>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-500">${modo}</span>
        ${editor && vigentes ? `<button data-action="editar-equipos" class="text-xs rounded-lg px-2.5 py-1 ${editando ? 'bg-emerald-500 text-slate-950 font-semibold' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'}">${editando ? ic('check') + ' Listo' : ic('pencil') + ' Editar'}</button>` : ''}
      </div>
    </div>
    ${vigentes ? '' : `<p class="mt-2 text-xs text-amber-300 bg-amber-500/10 rounded-lg px-3 py-2">${ic('triangle-alert')} La lista de titulares cambió desde que se armaron. ${editor ? 'Volvé a armarlos.' : 'Los van a rearmar.'}</p>`}
    ${pendientes}
    <div class="mt-4 grid grid-cols-[1fr_auto_1fr] items-center gap-2 text-center">
      <div>
        <p class="text-lg sm:text-xl font-black text-red-300 tracking-wide">🔴 EQUIPO A</p>
        ${editor ? `<p class="text-xs text-slate-400">prom <b class="text-slate-200">${prom('A').toFixed(1)}</b></p>` : `<p class="text-xs text-slate-500">${eq.A.length} jugadores</p>`}
      </div>
      <span class="text-xs font-black text-slate-500 rounded-full border border-slate-700 w-9 h-9 grid place-items-center">VS</span>
      <div>
        <p class="text-lg sm:text-xl font-black text-sky-300 tracking-wide">EQUIPO B 🔵</p>
        ${editor ? `<p class="text-xs text-slate-400">prom <b class="text-slate-200">${prom('B').toFixed(1)}</b></p>` : `<p class="text-xs text-slate-500">${eq.B.length} jugadores</p>`}
      </div>
    </div>
    ${editor ? `<p class="text-center text-[11px] mt-1 ${dif <= 0.3 ? 'text-emerald-400' : dif <= 0.8 ? 'text-amber-300' : 'text-red-300'}">${ic('scale')} Diferencia: ${dif.toFixed(1)}</p>` : ''}
    <div class="grid sm:grid-cols-2 gap-3 mt-3">
      ${columna('A', 'border-red-500', 'bg-red-500/5', 'text-red-300')}
      ${columna('B', 'border-sky-500', 'bg-sky-500/5', 'text-sky-300')}
    </div>
    ${avisoRehacer}
    ${editando ? `
      <div class="mt-3 rounded-xl border border-slate-700 bg-slate-800/40 p-3">
        <p class="text-xs text-slate-400">Tocá → o ← para pasar a alguien al otro equipo, o volvé a armarlos:</p>
        ${botones}
      </div>` : ''}
    <div class="grid ${pedido && botonRehacer ? 'grid-cols-2' : 'grid-cols-1'} gap-2 mt-3">${pedido}${botonRehacer}</div>
    ${vigentes ? botonCancha(eq) : ''}
    ${vigentes ? `<button data-action="copiar-equipos" class="${BTN_SEC} w-full mt-2 text-xs py-2">${ic('copy')} Copiar equipos para WhatsApp</button>` : ''}
    ${editor && !vigentes ? botones : ''}`);
}

// Botón para abrir la cancha: si te falta elegir, resalta.
function botonCancha(eq) {
  const L = lugaresDe(eq, D.grupo.anotados);
  const total = eq.A.length + eq.B.length;
  const eligieron = ['A', 'B'].reduce((t, e) => t + L[e].ocupa.filter(Boolean).length, 0);
  const yo = miUid(), mio = equipoDe(yo);
  const meFalta = mio && !L[mio].ocupa.includes(yo) && !posicionesCerradas();
  return meFalta
    ? `<button data-action="ver-cancha" class="${BTN_OK} w-full mt-3 text-sm">📍 Elegí tu posición en la cancha</button>`
    : `<button data-action="ver-cancha" class="${BTN_SEC} w-full mt-3 text-xs py-2">🏟️ Posiciones en la cancha${posicionesCerradas() ? '' : ` · ${eligieron} de ${total} eligieron`}</button>`;
}

function modalCancha() {
  const eq = D.grupo.equipos;
  if (!eq) return '';
  const d = derivar(), editor = puedeEditarEquipos(), cerradas = posicionesCerradas();
  const L = lugaresDe(eq, D.grupo.anotados, cerradas);
  const yo = miUid(), mio = equipoDe(yo), elegido = ui.elegidoCancha;
  const color = { A: 'ring-red-400', B: 'ring-sky-400' };
  const arrastra = id => id && (editor || (id === yo && !cerradas)) ? `data-arrastra="${id}"` : '';
  const punto = (e, i) => {
    const l = L[e].forma[i], id = L[e].ocupa[i], p = id && jugador(id);
    const top = e === 'A' ? (100 - l.y) / 2 : 50 + l.y / 2;
    const puedo = !id && !cerradas && mio === e && !editor;
    const marca = id === elegido ? 'ring-4 ring-white animate-pulse' : id === yo ? 'ring-[3px] ring-amber-300' : `ring-2 ${color[e]}`;
    return `
      <button data-action="tocar-lugar" data-e="${e}" data-i="${i}" ${arrastra(id)} style="left:${l.x}%;top:${top}%;${arrastra(id) ? 'touch-action:none' : ''}" class="absolute -translate-x-1/2 -translate-y-1/2 w-16 flex flex-col items-center gap-0.5">
        ${p
          ? `<span class="rounded-full ${marca}">${avatar(p, 32)}</span>
             <span class="max-w-full truncate rounded bg-black/60 px-1 text-[10px] font-semibold leading-4 text-white">${esc(p.usuario)}${marcaLesion(p)}</span>`
          : `<span class="w-8 h-8 rounded-full border-2 border-dashed grid place-items-center text-[9px] font-black ${puedo ? 'border-amber-300 bg-amber-300/20 text-amber-200 animate-pulse' : 'border-white/50 bg-black/20 text-white/70'}">${ROLES[l.rol][0]}</span>
             <span class="rounded bg-black/40 px-1 text-[10px] leading-4 text-white/70">Libre</span>`}
      </button>`;
  };
  const sinLugar = cerradas ? [] : ['A', 'B'].flatMap(e => eq[e].filter(id => !L[e].ocupa.includes(id)).map(id => [e, id]));
  const banco = [...suplentesDe('A', d), ...suplentesDe('B', d)];
  const miLugar = mio && L[mio].ocupa.indexOf(yo);
  const estado = editor
    ? (elegido ? `Moviendo a <b>${esc(jugador(elegido)?.usuario || '')}</b>: tocá otro lugar de su equipo (si está ocupado, se intercambian).` : 'Arrastrá a un jugador a otro lugar (o tocalo y tocá el lugar). Soltalo afuera de la cancha para sacarlo. Podés cambiar todo, aunque estén cerradas.')
    : !mio ? 'Mirá dónde juega cada uno.'
    : miLugar >= 0 ? `Jugás de <b>${ROLES[L[mio].forma[miLugar].rol][1]}</b>.${cerradas ? '' : ' Si querés, arrastrá tu foto a otro lugar libre (o afuera de la cancha para dejarlo).'}`
    : cerradas ? 'No elegiste a tiempo: te acomodó el sistema.' : 'Arrastrá tu foto a un lugar libre de tu equipo (los amarillos) o tocalo. El primero que lo elige se lo queda.';
  const cierre = cierrePosiciones();
  return `
    <div class="fixed inset-0 z-50 bg-slate-950 overflow-y-auto" role="dialog" aria-label="Posiciones en la cancha">
      <div class="max-w-md mx-auto p-4 space-y-3">
        <div class="flex items-center justify-between gap-2">
          <h2 class="text-lg font-black">🏟️ Posiciones</h2>
          <button data-action="cerrar-modal" aria-label="Cerrar" class="${BTN_ICONO} !w-9 !h-9">${ic('x')}</button>
        </div>
        <p class="text-sm text-slate-300">${estado}</p>
        <p class="text-xs ${cerradas ? 'text-amber-300' : 'text-slate-500'}">${cerradas ? '🔒 Las posiciones ya se cerraron.' : cierre ? `Se cierran el ${esc(momentoLindo(cierre))} (una hora antes). Los que no elijan se acomodan solos.` : 'Se cierran una hora antes del partido.'}</p>
        <div data-cancha class="relative w-full aspect-[2/3] rounded-2xl overflow-hidden border border-emerald-500/30 shadow-lg shadow-emerald-950/50" style="background:radial-gradient(ellipse at center,rgba(16,185,129,.12),transparent 70%),repeating-linear-gradient(180deg,#052e22 0 10%,#063a2b 10% 20%)">
          <div class="absolute inset-x-0 top-1/2 border-t-2 border-emerald-300/25"></div>
          <div class="absolute left-1/2 top-1/2 w-24 h-24 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-emerald-300/25"></div>
          <div class="absolute left-1/2 top-1/2 w-1.5 h-1.5 -translate-x-1/2 -translate-y-1/2 rounded-full bg-emerald-300/40"></div>
          <div class="absolute left-1/2 top-0 w-2/5 h-[12%] -translate-x-1/2 border-2 border-t-0 border-emerald-300/25"></div>
          <div class="absolute left-1/2 bottom-0 w-2/5 h-[12%] -translate-x-1/2 border-2 border-b-0 border-emerald-300/25"></div>
          <span class="absolute left-2 top-2 text-xs font-black text-red-200 drop-shadow">🔴 A</span>
          <span class="absolute left-2 bottom-2 text-xs font-black text-sky-200 drop-shadow">🔵 B</span>
          ${['A', 'B'].map(e => L[e].forma.map((_, i) => punto(e, i)).join('')).join('')}
        </div>
        ${sinLugar.length ? `
          <div>
            <p class="text-xs font-semibold text-slate-400 mb-1.5">Todavía sin lugar</p>
            <div class="flex flex-wrap gap-1.5">
              ${sinLugar.map(([e, id]) => `<button data-action="elegir-en-cancha" data-id="${id}" ${arrastra(id)} style="${arrastra(id) ? 'touch-action:none' : ''}" class="inline-flex items-center gap-1.5 rounded-full border ${id === elegido ? 'border-white bg-slate-700' : e === 'A' ? 'border-red-500/40' : 'border-sky-500/40'} bg-slate-800 pl-0.5 pr-2.5 py-0.5 text-xs">${avatar(jugador(id), 22)} ${esc(jugador(id)?.usuario || '')}${marcaLesion(id)}</button>`).join('')}
            </div>
          </div>` : ''}
        ${banco.length ? `
          <div>
            <p class="text-xs font-semibold text-amber-300/80 mb-1.5">${ic('repeat')} Banco de suplentes · si se baja alguien, el que entra ocupa su lugar</p>
            <div class="flex flex-wrap gap-1.5">
              ${banco.map(p => `<span class="inline-flex items-center gap-1.5 rounded-full border border-slate-700 bg-slate-800 pl-0.5 pr-2.5 py-0.5 text-xs">${avatar(p, 22)} ${esc(p.usuario)}${marcaLesion(p)}</span>`).join('')}
            </div>
          </div>` : ''}
        ${editor ? `
          <div class="flex flex-wrap gap-2 pt-1">
            ${elegido ? `
              ${eq.pos?.[elegido] ? `<button data-action="sacar-de-lugar" class="${BTN_SEC} text-xs py-2">Sacarlo de su lugar</button>` : ''}
              <button data-action="elegir-en-cancha" data-id="" class="${BTN_SEC} text-xs py-2">Cancelar</button>`
            : sinLugar.length ? `<button data-action="completar-posiciones" class="${BTN_OK} text-sm flex-1">✨ Completar posiciones</button>` : ''}
          </div>
          ${elegido ? '' : '<p class="text-[11px] text-slate-500">Completar respeta a los que ya eligieron y acomoda al resto según la posición de su perfil.</p>'}` : ''}
      </div>
    </div>`;
}

function tarjetaMvp() {
  const m = D.mvp, estado = estadoMvp();
  if (!m) return '';
  const quien = id => `${avatar(fichaCandidato(m, id), 28)}<b class="truncate">${esc(nombreCandidato(m, id))}</b>`;
  const editar = esAdmin() && estado !== 'cerrada'
    ? `<button data-action="mvp-editar" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-400">Editar candidatos</button>` : '';

  if (estado === 'pendiente') {
    if (!esAdmin()) return '';
    return card(`
      <div class="flex items-center justify-between gap-2">
        <p class="text-sm">🏆 La votación del jugador del partido abre el ${esc(momentoLindo(m.abre))}.</p>
        ${editar}
      </div>`);
  }

  if (estado === 'abierta') {
    const voto = m.miVoto;
    return `
      <div class="${CARD} border-amber-500/40 bg-gradient-to-br from-amber-500/10 to-slate-900">
        <div class="flex items-start justify-between gap-2">
          <div>
            <h2 class="text-lg font-black">🏆 Jugador del partido</h2>
            <p class="text-xs text-slate-400">Del ${esc(fechaLinda(m.id))} · se vota hasta ${hastaCuando(m)}</p>
          </div>
          ${editar}
        </div>
        ${voto
          ? `<div class="mt-3 flex items-center gap-2 text-sm">${ic('circle-check', 'text-emerald-400')} Votaste a ${quien(voto)}
               <button data-action="mvp-votar" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-400 ml-auto">Cambiar</button></div>`
          : `<p class="mt-3 text-sm text-amber-200">${ic('triangle-alert')} Todavía no votaste.</p>
             <button data-action="mvp-votar" class="${BTN} w-full mt-2 bg-amber-400 hover:bg-amber-300 text-slate-950">🏆 Votar al mejor del partido</button>`}
        ${sinMiVoto(m.candidatos).length ? `
          <div class="mt-3 pt-3 border-t border-amber-500/20 flex items-center gap-3">
            <p class="flex-1 text-xs text-slate-300">Ya que estás, calificá a los que jugaron y todavía no calificaste.</p>
            <button data-action="calificar-rapido" data-ids="${esc(m.candidatos.join(','))}" class="${BTN_SEC} text-xs shrink-0">⭐ Calificar (${sinMiVoto(m.candidatos).length})</button>
          </div>` : ''}
      </div>`;
  }

  // Cerrada: se ve grande un día; después queda chica abajo (tarjetaUltimo).
  if (!m.votos || mvpVieja(m)) return '';
  return mvpCerrada(m);
}

const mvpVieja = m => Date.now() >= m.cierra + DIA;
function mvpCerrada(m) {
  const r = resultadoMvp(m);
  const cuerpo = !r.ganadores.length
    ? `<p class="mt-2 text-sm text-slate-400">Hubo ${r.total} ${r.total === 1 ? 'voto' : 'votos'}: hacen falta al menos ${MIN_VOTOS_MVP}, así que esta vez quedó desierto.</p>`
    : `<div class="mt-3 flex flex-wrap justify-center gap-4">
         ${r.ganadores.map(id => `
           <div class="flex flex-col items-center gap-1">
             ${avatar(fichaCandidato(m, id), 72)}
             <b>${esc(nombreCandidato(m, id))}</b>
           </div>`).join('')}
       </div>
       <p class="text-center text-xs text-slate-400 mt-2">${r.ganadores.length > 1 ? `Empataron con ${r.max} votos cada uno · votaron ${r.total}` : `${r.max} de ${r.total} votos`}</p>
       <div class="text-center">
         <button data-action="ver-votos" data-id="${m.id}" aria-expanded="${ui.verVotos === m.id}" class="mt-2 text-xs font-semibold text-slate-300 hover:text-white inline-flex items-center gap-1">
           ${ui.verVotos === m.id ? 'Ocultar' : 'Ver'} los votos <span class="transition ${ui.verVotos === m.id ? 'rotate-180' : ''}">▾</span>
         </button>
       </div>
       ${ui.verVotos === m.id ? `
         <ul class="mt-2 rounded-xl border border-amber-500/20 bg-slate-900/60 divide-y divide-slate-800">
           ${podioMvp(r).map((x, i) => `
             <li class="flex items-center gap-3 px-3 py-2">
               <span class="text-xl leading-none">${['🥇', '🥈', '🥉'][i]}</span>
               <span class="flex -space-x-2 shrink-0">${x.ids.map(id => avatar(fichaCandidato(m, id), 28)).join('')}</span>
               <span class="flex-1 min-w-0 text-sm font-semibold leading-tight break-words">${x.ids.map(id => esc(nombreCandidato(m, id))).join(' y ')}</span>
               <span class="text-xs text-slate-400 shrink-0">${x.votos} ${x.votos === 1 ? 'voto' : 'votos'}${x.ids.length > 1 ? ' c/u' : ''}</span>
             </li>`).join('')}
         </ul>` : ''}
       <button data-action="mvp-copiar" class="${BTN} w-full mt-3 text-sm bg-green-600 hover:bg-green-500 text-white">${ic('copy')} Copiar resultado para WhatsApp</button>`;
  return `
    <div class="${CARD} border-amber-500/40 bg-gradient-to-br from-amber-500/10 to-slate-900">
      <h2 class="text-lg font-black">🏆 Jugador del partido</h2>
      <p class="text-xs text-slate-400">Del ${esc(fechaLinda(m.id))}</p>
      ${cuerpo}
    </div>`;
}

// 🟥 Admins: reportes pendientes. Los que jugaron: botón para reportar (3 días después del partido).
// Admins: aviso en el grupo de que hay gente esperando para entrar.
function avisoPendientes() {
  if (!esAdmin() || !D.pendientes.length) return '';
  const n = D.pendientes.length;
  return `
    <a href="#/admin" class="flex items-center gap-3 rounded-2xl border border-emerald-500/30 bg-emerald-500/10 p-3 hover:bg-emerald-500/15 transition">
      ${ic('user-plus', 'text-emerald-300 !w-5 !h-5')}
      <span class="flex-1 text-sm"><b>${n} ${n === 1 ? 'persona quiere' : 'personas quieren'} entrar</b> al grupo</span>
      <span class="${BTN_CHIP}">Revisar ${ic('chevron-right')}</span>
    </a>`;
}

// Pantalla de administración del grupo (solo admins).
function vistaAdmin() {
  // Dos pestañas: Partido (fecha, cancha, fecha fija, resultado) y Grupo (foto, link, jugadores).
  const tab = guardado.get(LS + 'adminTab') === 'grupo' ? 'grupo' : 'partido';
  return `
    <div class="flex items-center gap-2">
      <a href="#/" class="${BTN_CHIP} !h-10 !px-2.5 !text-sm" aria-label="Volver al grupo">${ic('arrow-left')} Grupo</a>
      <div class="min-w-0 flex-1">
        <p class="text-[11px] font-semibold uppercase tracking-wide text-emerald-400">Administrar</p>
        <p class="font-bold truncate leading-tight">${esc(D.grupo.nombre)}</p>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-1 rounded-2xl bg-slate-900 border border-slate-800 p-1">
      ${[['partido', 'calendar', 'Partido'], ['grupo', 'users', 'Grupo']].map(([k, i, t]) => `

    </div>
    ${tab === 'partido' ? panelPartido(derivar()) : `
    ${card(`
      <div class="flex items-center gap-4">
        ${fotoGrupo(D.grupo, 64)}
        <div class="flex-1 min-w-0">

          <button data-action="decidir" data-id="${p.id}" data-si="1" class="${BTN_OK} text-xs px-3 py-1.5">Aceptar</button>

}

function tarjetaFaltas() {
  let html = '';
  if (esAdmin() && D.reportes.length) {
    const pend = {};
    D.reportes.forEach(r => (pend[`${r.fecha}_${r.target}`] ||= { fecha: r.fecha, target: r.target, por: [] }).por.push(r.por));
    html += card(`
      <h2 class="text-lg font-bold">🟥 Faltazos reportados <span class="text-sm font-normal text-slate-500">(${Object.keys(pend).length})</span></h2>
      <p class="text-xs text-slate-400 mb-3">Solo cuentan si los aprobás. El reportado no ve quién lo reportó.</p>
      <ul class="space-y-3">
        ${Object.entries(pend).map(([k, r]) => {
          const m = D.mvps.find(x => x.id === r.fecha);
          const p = m ? fichaCandidato(m, r.target) : jugador(r.target) || { id: r.target, usuario: '?', posicion: 'comodin' };
          return `
            <li class="flex items-center gap-2 text-sm">
              ${avatar(p, 32)}
              <div class="flex-1 min-w-0">
                <b class="block truncate">${esc(p.usuario)}</b>
                <span class="text-xs text-slate-400">${esc(fechaLinda(r.fecha))} · lo reportó ${r.por.map(id => esc(jugador(id)?.usuario || '?')).join(', ')}</span>
              </div>
              <button data-action="aprobar-falta" data-k="${esc(k)}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-red-600 text-white shrink-0">Aprobar</button>
              <button data-action="rechazar-falta" data-k="${esc(k)}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800 text-slate-300 shrink-0">Rechazar</button>
            </li>`;
        }).join('')}
      </ul>`);
  }
  const m = D.mvp, ahora = Date.now();
  if (m && m.candidatos.includes(miUid()) && ahora >= m.abre && ahora < m.abre + 3 * DIA) {
    const mios = D.reportes.filter(r => r.fecha === m.id && r.por === miUid()).length;
    html += card(`
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="text-sm font-semibold">🟥 ¿Alguien faltó sin avisar el ${esc(fechaLinda(m.id))}?</p>
          <p class="text-xs text-slate-400">${mios ? `Reportaste a ${mios}. ` : ''}Un admin lo revisa antes de que cuente.</p>
        </div>
        <button data-action="faltas-reportar" class="${BTN_SEC} text-sm shrink-0">${mios ? 'Ver' : 'Reportar'}</button>
      </div>`);
  }
  return html;
}

    <form data-form="reemplazar" class="space-y-3">
      ${libres.length ? `
        <ul class="divide-y divide-slate-800 max-h-[40vh] overflow-y-auto">
          ${libres.map(p => `
            <li>
              <label class="flex items-center gap-3 py-2 cursor-pointer">

                ${avatar(p, 28)}
                <span class="flex-1 truncate">${esc(p.usuario)}${marcaLesion(p)}${p.invitado ? ' <span class="text-xs text-slate-500">(invitado)</span>' : ''}</span>

      <input id="reemp-nuevo" name="nuevo" maxlength="20" placeholder="O alguien sin cuenta (nombre)" class="${INPUT}">

    <button data-action="reemplazar" class="w-full mt-2 py-2 text-sm text-slate-400">← Elegir a otro</button>`);

// "¿Seguro que te bajás?" con lo que implica según cuánto falta.
function modalBajar() {
  const id = ui.bajar, p = jugador(id);
  if (!p) return '';
  const yo = id === miUid(), t = tiemposPartido(), titular = derivar().titulares.some(x => x.id === id);
  const horas = t ? (t.inicio - Date.now()) / 3600e3 : Infinity;
  const quien = yo ? 'te bajás' : `se baja ${p.usuario}`;
  const [color, texto] = D.grupo.partido.suspendido || !titular ? ['slate', titular ? 'El partido está suspendido: no afecta la asistencia.' : 'Es suplente: no afecta la asistencia.']
    : horas < 0 ? ['red', `🟥 El partido ya empezó. Si ${quien} ahora, cuenta como que <b>faltó sin avisar</b>.`]
    : horas < 6 ? ['red', `⏰ Falta muy poco para el partido. Si ${quien} ahora, cuenta como baja <b>a último momento</b> en la asistencia (salvo que haya lluvia o se suspenda).`]
    : horas < 24 ? ['amber', `🕐 Es el día del partido. Si ${quien} ahora, cuenta como baja <b>tarde</b> en la asistencia (salvo que haya lluvia o se suspenda).`]
    : ['emerald', 'Con tiempo: no afecta la asistencia. ¡Gracias por avisar!'];
  const caja = { red: 'border-red-500/30 bg-red-500/10 text-red-100', amber: 'border-amber-500/30 bg-amber-500/10 text-amber-100', emerald: 'border-emerald-500/30 bg-emerald-500/10 text-emerald-100', slate: 'border-slate-700 bg-slate-800/60 text-slate-300' }[color];
  return modal(`
    <div class="text-center">
      <div class="text-4xl">😢</div>
      <h2 class="text-xl font-black mt-1">${yo ? '¿Estás seguro que querés bajarte?' : `¿Bajar a ${esc(p.usuario)} de la lista?`}</h2>
    </div>
    <p class="mt-4 rounded-xl border px-3 py-2 text-sm ${caja}">${texto}</p>
    <div class="grid grid-cols-2 gap-2 mt-4">
      <button data-action="cerrar-modal" class="${BTN_SEC}">Cancelar</button>
      <button data-action="confirmar-bajar" class="${BTN} bg-red-600 hover:bg-red-500 text-white">Sí, ${yo ? 'me bajo' : 'bajarlo'}</button>
    </div>`);
}

// ---------------- ⚽ En juego ----------------
// Desde la hora del partido hasta que termina: cronómetro y los equipos.
// Resultado: el admin (o un armador) carga quién ganó al terminar; todos lo ven.
// modoResultado: 'ganador' (por defecto), 'goles' (el marcador) o 'goleadores' (cuántos hizo cada uno).
const conGoles = () => ['goles', 'goleadores'].includes(D.grupo.modoResultado);
const conGoleadores = () => D.grupo.modoResultado === 'goleadores';
// Goles de cada uno en un resultado, por equipo: "Franco 3, Beto 2".
const textoGoleadores = (x, e) => {
  const ids = [...(x[e] || []), ...(x['S' + e] || [])].filter(id => x.goles?.[id] > 0).sort((a, b) => x.goles[b] - x.goles[a]);
  return ids.map(id => `${jugador(id)?.usuario || x.nombres?.[id] || 'Ex jugador'}${x.goles[id] > 1 ? ' ' + x.goles[id] : ''}`).join(', ');
};
function lineaGoleadores(x) {
  if (!x.goles) return '';
  const [a, b] = [textoGoleadores(x, 'A'), textoGoleadores(x, 'B')];
  return a || b ? `<p class="text-xs text-slate-300 mt-1">⚽ ${a ? `🔴 ${esc(a)}` : ''}${a && b ? ' · ' : ''}${b ? `🔵 ${esc(b)}` : ''}</p>` : '';
}
// Con goleadores: el marcador es la suma de cada equipo (se actualiza mientras se escribe).
function sumarGoles() {
  ['A', 'B'].forEach(e => {
    const out = document.getElementById('r-total-' + e);
    if (out) out.textContent = [...document.querySelectorAll(`[data-gol="${e}"]`)].reduce((t, i) => t + (parseInt(i.value) || 0), 0);
  });
}
const textoResultado = x => x.ganador === 'empate'
  ? `Empate${x.golesA != null ? ` ${x.golesA} – ${x.golesB}` : ''}`
  : `Ganó el ${NOMBRE_EQUIPO[x.ganador]}${x.golesA != null ? ` · ${x.ganador === 'A' ? x.golesA : x.golesB} a ${x.ganador === 'A' ? x.golesB : x.golesA}` : ''}`;
// El admin o un armador anota cuántos hizo cada uno; el marcador sale de la suma.
function formGoleadores(actual) {
  const d = derivar(), eq = D.grupo.equipos;
  const fila = (id, e, sup) => {
    const j = jugador(id);
    if (!j) return '';
    return `
      <li class="flex items-center gap-2 min-w-0">
        ${avatar(j, 20)}<span class="truncate flex-1 text-sm ${sup ? 'text-slate-400' : ''}">${esc(j.usuario)}${marcaLesion(j)}</span>
        <input id="r-g-${id}" name="g_${id}" data-gol="${e}" type="number" inputmode="numeric" min="0" max="30" value="${actual?.goles?.[id] || ''}" placeholder="0" class="${INPUT} !w-12 !px-1 !py-1 text-center font-bold shrink-0">
      </li>`;
  };
  const col = (e, color) => {
    const sups = suplentesDe(e, d).map(j => j.id);
    const asignados = [...(eq[e] || []), ...sups].reduce((t, id) => t + (actual?.goles?.[id] || 0), 0);
    const otros = actual?.goles ? Math.max(0, (e === 'A' ? actual.golesA : actual.golesB) - asignados) : '';
    return `
      <div class="rounded-xl border ${color} p-2 space-y-1.5">
        <p class="text-xs font-bold flex justify-between">${NOMBRE_EQUIPO[e]}<span id="r-total-${e}" class="text-lg leading-none font-black">0</span></p>
        <ul class="space-y-1.5">${(eq[e] || []).map(id => fila(id, e)).join('')}${sups.map(id => fila(id, e, true)).join('')}
          <li class="flex items-center gap-2"><span class="flex-1 text-xs text-slate-500">En contra / no sé quién</span>
            <input id="r-x-${e}" name="x_${e}" data-gol="${e}" type="number" inputmode="numeric" min="0" max="30" value="${otros || ''}" placeholder="0" class="${INPUT} !w-12 !px-1 !py-1 text-center font-bold shrink-0"></li>
        </ul>
      </div>`;
  };
  return `
    <form data-form="resultado" class="space-y-3">
      <p class="text-xs text-slate-400 -mt-1">Anotá los goles de cada uno; el resultado es la suma.</p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${col('A', 'border-red-500/30 bg-red-500/5')}${col('B', 'border-sky-500/30 bg-sky-500/5')}</div>
      <button class="${BTN_OK} w-full">Guardar resultado</button>
    </form>
    <button data-action="sin-goles" class="${BTN_CHIP} w-full mt-2 !py-2">No sé los goles, solo quién ganó</button>`;
}

function tarjetaResultado() {
  const p = D.grupo.partido, t = tiemposPartido();
  const actual = D.resultados.find(x => x.fecha === p.fecha);
  const termino = p.fecha && !p.suspendido && (t ? Date.now() >= t.fin : p.fecha < hoyArg());
  const puede = puedeEditarEquipos() && D.grupo.equipos;
  // Cargar el resultado de esta fecha.
  if (termino && puede && (!actual || ui.corregirResultado)) {
    const goles = conGoles() && !ui.sinGoles;
    return card(`
      <h2 class="text-lg font-bold">${ic('flag', 'text-emerald-400')} ¿Cómo salió?</h2>
      <p class="text-xs text-slate-400 mt-0.5 mb-3">Lo ven todos los del grupo.${goles ? '' : ' Si saben los goles, el admin lo puede activar en Administrar.'}</p>
      ${goles && conGoleadores() ? formGoleadores(actual) : goles ? `
        <form data-form="resultado" class="space-y-3">
          <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2 text-center">
            <label class="text-sm font-bold text-red-300">🔴 Equipo A<input id="r-a" name="golesA" type="number" inputmode="numeric" min="0" max="99" required value="${actual?.golesA ?? ''}" class="${INPUT} mt-1 text-center text-2xl font-black"></label>
            <span class="text-slate-500 font-black pt-6">–</span>
            <label class="text-sm font-bold text-sky-300">🔵 Equipo B<input id="r-b" name="golesB" type="number" inputmode="numeric" min="0" max="99" required value="${actual?.golesB ?? ''}" class="${INPUT} mt-1 text-center text-2xl font-black"></label>
          </div>
          <button class="${BTN_OK} w-full">Guardar resultado</button>
        </form>
        <button data-action="sin-goles" class="${BTN_CHIP} w-full mt-2 !py-2">No sé los goles, solo quién ganó</button>`
      : `
        <div class="grid grid-cols-3 gap-2">
          <button data-action="resultado" data-ganador="A" class="${BTN} text-sm bg-red-500/15 hover:bg-red-500/25 text-red-200">Ganó<br>🔴 A</button>
          <button data-action="resultado" data-ganador="empate" class="${BTN} text-sm bg-slate-800 hover:bg-slate-700">Empate</button>
          <button data-action="resultado" data-ganador="B" class="${BTN} text-sm bg-sky-500/15 hover:bg-sky-500/25 text-sky-200">Ganó<br>🔵 B</button>
        </div>`}
      ${actual ? '<button data-action="corregir-resultado" class="text-xs text-slate-500 hover:text-slate-300 w-full mt-2">Cancelar</button>' : ''}`);
  }
  // Mostrar el de esta fecha o el del último partido.
  const x = actual || (!termino || !puede ? D.resultados.find(r => r.fecha < (p.fecha || '9999')) : null);
  if (!x || resultadoViejo(x)) return '';
  return vistaResultado(x, x === actual, x === actual && puede);
}

const resultadoViejo = x => Date.now() >= Date.parse(`${x.fecha}T00:00:00-03:00`) + 2 * DIA;
function vistaResultado(x, esActual, corregir) {
  const color = x.ganador === 'A' ? 'from-red-500/20 border-red-500/30' : x.ganador === 'B' ? 'from-sky-500/20 border-sky-500/30' : 'from-slate-700/40 border-slate-600';
  return `
    <div class="rounded-2xl border bg-gradient-to-br ${color} to-slate-900 p-4">
      <div class="flex items-center justify-between gap-2">
        <p class="text-xs font-bold uppercase tracking-wider text-slate-400">${esActual ? '🏁 Resultado' : `Último partido · ${esc(fechaLinda(x.fecha))}`}</p>
        ${corregir ? '<button data-action="corregir-resultado" class="text-xs text-slate-400 hover:text-slate-200 underline-offset-2">Corregir</button>' : ''}
      </div>
      <p class="text-2xl font-black mt-1">${x.ganador === 'empate' ? '🤝' : '🏆'} ${esc(textoResultado(x))}</p>
      ${lineaGoleadores(x)}
      ${equiposDelResultado(x)}
    </div>`;
}

// Pasado un día, el resultado y el jugador del partido quedan en una sola fila chica, abajo,
// que se despliega tocándola (así no ocupan media pantalla toda la semana).
function tarjetaUltimo() {
  const p = D.grupo.partido;
  const cand = D.resultados.find(r => r.fecha <= (p.fecha || '9999'));
  const res = cand && resultadoViejo(cand) && !(cand.fecha === p.fecha && ui.corregirResultado) ? cand : null;
  const m0 = D.mvp;
  const m = m0 && estadoMvp() === 'cerrada' && m0.votos && mvpVieja(m0) && (!res || m0.id === res.fecha) ? m0 : null;
  if (!res && !m) return '';
  const fecha = res?.fecha || m.id;
  const r = m && resultadoMvp(m);
  const mejores = r?.ganadores.length ? r.ganadores.map(id => esc(nombreCandidato(m, id))).join(' y ') : '';
  const abierto = ui.verUltimo === fecha;
  return `
    <div class="rounded-2xl border border-slate-800 bg-slate-900/70">
      <button data-action="ver-ultimo" data-fecha="${fecha}" aria-expanded="${abierto}" class="w-full flex items-center gap-3 px-4 py-3 text-left">
        <span class="flex-1 min-w-0">
          <span class="block text-[11px] font-bold uppercase tracking-wider text-slate-500">🏁 Último partido · ${esc(fechaLinda(fecha))}</span>
          <span class="block text-sm font-semibold truncate">${res ? esc(textoResultado(res)) : ''}${res && mejores ? ' · ' : ''}${mejores ? `🏆 ${mejores}` : ''}</span>
        </span>

// ---------------- 📊 Historial ----------------
// Partidos con resultado cargado: cuántos jugó cada uno y cuántos ganó. Se leen todos
// recién al abrir una ficha (en el grupo solo se escuchan los últimos 6).
const todosResultados = { gid: null, docs: null };
async function cargarTodosResultados() {
  const gid = D.gid;
  if (todosResultados.gid === gid) return;
  Object.assign(todosResultados, { gid, docs: null });
  try {
    const qs = await F.getDocs(F.query(colResultados(gid), F.orderBy('fecha', 'desc'), F.limit(300)));
    if (todosResultados.gid === gid) todosResultados.docs = qs.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) {
    console.warn(e.code);
    if (todosResultados.gid === gid) todosResultados.docs = [];  // sin historial; no reintenta en cada dibujo
  }
  render();
}
function historialDe(id) {
  if (todosResultados.gid !== D.gid || !todosResultados.docs) return null;
  // Los recién cargados (escuchados en vivo) pisan a los leídos al abrir.
  const porFecha = Object.fromEntries([...todosResultados.docs, ...D.resultados].map(x => [x.fecha, x]));
  const h = { pj: 0, pg: 0, pe: 0, pp: 0, goles: 0, pjGoles: 0 };
  for (const x of Object.values(porFecha)) {
    const e = ['A', 'B'].find(k => (x[k] || []).includes(id) || (x['S' + k] || []).includes(id));
    if (!e) continue;
    h.pj++;
    if (x.goles) { h.pjGoles++; h.goles += x.goles[id] || 0; }
    if (x.ganador === 'empate') h.pe++; else if (x.ganador === e) h.pg++; else h.pp++;
  }
  return h;
}
function tarjetaHistorial(id) {
  const h = historialDe(id);
  if (!h) { cargarTodosResultados(); return ''; }
  if (!h.pj) return '';
  const caja = (n, txt, color) => `<div class="rounded-xl bg-slate-800/60 py-2"><p class="text-2xl font-black ${color}">${n}</p><p class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${txt}</p></div>`;

    <div class="grid grid-cols-4 gap-2 mt-3 text-center">
      ${caja(h.pj, 'Jugados', 'text-slate-100')}${caja(h.pg, 'Ganados', 'text-emerald-300')}${caja(h.pe, 'Empates', 'text-slate-300')}${caja(h.pp, 'Perdidos', 'text-red-300')}

}

// ---------------- 🏟️ Mi carrera (todos mis grupos) ----------------
// Para "Mi ficha" y la tira de Inicio: de cada grupo, los resultados, mis promedios
// (calc/notas) y los ganadores del jugador del partido. Se vuelve a leer cada 10 minutos
// (mientras tanto se siguen viendo los números de antes).
const carrera = { clave: null, grupos: null, ts: 0 };
const claveCarrera = () => `${miUid()}:${(D.perfil?.grupos || []).map(g => g.id).join(',')}`;
async function cargarCarrera() {
  const uid = miUid(), gids = (D.perfil?.grupos || []).map(g => g.id);
  const clave = claveCarrera();
  if (!uid || (carrera.clave === clave && Date.now() - carrera.ts < 10 * 60e3)) return;
  if (carrera.clave !== clave) carrera.grupos = null;
  Object.assign(carrera, { clave, ts: Date.now() });
  const out = {};
  await Promise.all(gids.map(async gid => {
    const g = out[gid] = { resultados: [], notas: null, mvps: {} };
    try {
      const qs = await F.getDocs(F.query(colResultados(gid), F.orderBy('fecha', 'desc'), F.limit(300)));
      g.resultados = qs.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) { console.warn(e.code); }
    try { g.notas = (await F.getDoc(F.doc(db, 'grupos', gid, 'calc', 'notas'))).data()?.notas?.[uid] || null; } catch (e) { console.warn(e.code); }
    try {
      const qs = await F.getDocs(colMvp(gid));
      for (const d of qs.docs) {
        const gan = await ganadoresMvp(gid, { id: d.id, ...d.data() });
        if (gan) g.mvps[d.id] = gan;
      }
    } catch (e) { console.warn(e.code); }
  }));
  if (carrera.clave !== clave) return;
  carrera.grupos = out;
  render();
}
// null mientras carga.
function statsCarrera() {
  cargarCarrera();
  if (!carrera.grupos || carrera.clave !== claveCarrera()) return null;
  const uid = miUid(), partidos = [];
  let estrellas = 0, n = 0, grupos = 0;
  const suma = {};
  for (const [gid, g] of Object.entries(carrera.grupos)) {
    const nombre = D.misGrupos[gid]?.nombre || D.perfil.grupos.find(x => x.id === gid)?.nombre || 'Grupo';
    for (const x of g.resultados) {
      const e = ['A', 'B'].find(k => (x[k] || []).includes(uid) || (x['S' + k] || []).includes(uid));
      if (!e) continue;
      partidos.push({ gid, nombre, x, e, r: x.ganador === 'empate' ? 'E' : x.ganador === e ? 'G' : 'P', mvp: (g.mvps[x.fecha] || []).includes(uid), goles: x.goles ? x.goles[uid] || 0 : null });
    }
    estrellas += Object.values(g.mvps).filter(gan => gan.includes(uid)).length;
    // Mis calificaciones de todos los grupos, pesando más donde tengo más votos.
    if (g.notas?.n) {
      n += g.notas.n; grupos++;
      STATS.forEach(s => (suma[s.k] = (suma[s.k] || 0) + (g.notas.prom[s.k] || 0) * g.notas.n));
    }
  }
  partidos.sort((a, b) => b.x.fecha.localeCompare(a.x.fecha));
  const cuenta = r => partidos.filter(p => p.r === r).length;
  const pj = partidos.length, pg = cuenta('G');
  let racha = 0;
  while (racha < pj && partidos[racha].r === 'G') racha++;
  const prom = n ? Object.fromEntries(STATS.map(s => [s.k, suma[s.k] / n])) : null;
  const campo = prom && CAMPO.reduce((t, k) => t + prom[k], 0) / CAMPO.length;
  const general = prom && (D.perfil.posicion === 'arquero' ? (campo + prom.arquero) / 2 : campo);
  // Goles: solo de los partidos donde se cargó quién los hizo.
  const conGol = partidos.filter(p => p.goles !== null);
  const goles = conGol.reduce((t, p) => t + p.goles, 0);
  return { partidos, pj, pg, pe: cuenta('E'), pp: cuenta('P'), racha, estrellas, n, grupos, prom, general, goles, pjGoles: conGol.length };
}

// ---------------- 📋 Asistencia ----------------
// Mira los últimos 90 días: partidos jugados contra faltas sin avisar (pesan 2), bajas
// a último momento, menos de 6 h antes (pesan 1) y bajas tarde, menos de 24 h (pesan ½).
// No cuentan las bajas con lluvia o con el partido suspendido.
const VENTANA_ASISTENCIA = 90 * DIA;
function asistenciaDe(id) {
  const desde = Date.now() - VENTANA_ASISTENCIA;
  const reciente = f => inicioDia(f) >= desde;
  const faltas = D.faltas.filter(f => f.target === id && reciente(f.fecha));
  const jugados = (D.mvps || []).filter(m => reciente(m.fecha) && m.candidatos?.includes(id) && !faltas.some(f => f.fecha === m.fecha)).length;
  const bajas = D.bajas.filter(b => b.target === id && reciente(b.fecha));
  // Si después se volvió a anotar y jugó esa fecha, la baja no cuenta.
  const jugo = f => (D.mvps || []).some(m => m.fecha === f && m.candidatos?.includes(id));
  const cuentan = bajas.filter(b => !b.excusa && !jugo(b.fecha));
  const ultimo = cuentan.filter(b => b.tipo === 'ultimo').length, tarde = cuentan.length - ultimo;
  const peso = jugados + 2 * faltas.length + ultimo + 0.5 * tarde;
  return { jugados, faltas: faltas.length, ultimo, tarde, bajas, pct: peso ? Math.round(100 * jugados / peso) : null };
}
const nivelAsistencia = pct => pct >= 90 ? ['emerald', 'Confiable'] : pct >= 70 ? ['amber', 'Regular'] : ['red', 'Se baja seguido'];
// Al lado del nombre, solo si viene fallando: ⏰.
function marcaAsistencia(id) {
  const a = asistenciaDe(id);
  return a.pct != null && a.pct < 70 ? ` <span class="text-xs" title="Asistencia ${a.pct}%: se baja seguido a último momento o falta">⏰</span>` : '';
}
function tarjetaAsistencia(id) {
  const a = asistenciaDe(id);
  if (a.pct == null && !a.bajas.length) return '';
  const [color, nivel] = a.pct == null ? ['slate', 'Sin partidos'] : nivelAsistencia(a.pct);
  const excusa = { lluvia: '🌧️ había lluvia, no cuenta', suspendido: '🚫 se suspendió, no cuenta' };
  const textoColor = { emerald: 'text-emerald-300', amber: 'text-amber-300', red: 'text-red-300', slate: 'text-slate-400' }[color];
  const barraColor = { emerald: 'bg-emerald-400', amber: 'bg-amber-400', red: 'bg-red-400', slate: 'bg-slate-500' }[color];
  return card(`
    <div class="flex items-baseline justify-between gap-2">

      <span class="font-black text-xl ${textoColor}">${a.pct == null ? '–' : a.pct + '%'}</span>
    </div>
    ${a.pct != null ? `<div class="mt-2 h-2 rounded-full bg-slate-800 overflow-hidden"><div class="h-full rounded-full ${barraColor}" style="width:${a.pct}%"></div></div>` : ''}
    <p class="text-sm mt-2"><b class="${textoColor}">${nivel}</b> · ${a.jugados} jugados${a.faltas ? ` · ${a.faltas} 🟥 sin avisar` : ''}${a.ultimo ? ` · ${a.ultimo} a último momento` : ''}${a.tarde ? ` · ${a.tarde} tarde` : ''}</p>
    ${a.bajas.length ? `
      <ul class="mt-2 space-y-1 text-xs text-slate-400">
        ${a.bajas.sort((x, y) => y.ts - x.ts).map(b => `
          <li class="flex items-center gap-2">
            <span class="flex-1">${b.tipo === 'ultimo' ? '⏰ A último momento' : '🕐 Tarde'}: se bajó ${b.horas < 1 ? 'menos de 1 h' : Math.floor(b.horas) + ' h'} antes, el ${esc(fechaLinda(b.fecha))}${b.excusa ? ` · ${excusa[b.excusa]}` : ''}</span>
            ${esAdmin() ? `<button data-action="perdonar-baja" data-k="${esc(b.id)}" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0">Perdonar</button>` : ''}
          </li>`).join('')}
      </ul>` : ''}`);

// Al lado del nombre: 🟥 (o 🟥2) mientras tenga faltas vigentes.
function marcaRoja(id) {
  const n = rojasDe(id).length;
  if (!n) return '';
  return ` <span class="text-xs" title="Faltó sin avisar${n > 1 ? ` ${n} veces` : ''}${castigado(id) ? '. Esta fecha, si se llena la lista, queda de suplente' : ''}">🟥${n > 1 ? n : ''}</span>`;

// 😈 Hater: con al menos 3 compañeros calificados, en promedio pone 3 o menos, o
// califica 2,5 puntos o más por debajo de lo que les ponen los demás a los mismos.
// Se miran solo las 6 habilidades de campo (Arquero baja a casi todos y no cuenta).
const HATER = { minVotos: 3, maxPromedio: 3, maxDiferencia: -2.5 };
let haterCache = { votos: null, ids: new Set() };
function esHater(id) {
  if (D.notas) return !!D.notas.haters?.includes(id);
  if (haterCache.votos !== D.votos) {
    const prom = s => CAMPO.reduce((t, k) => t + (s[k] || 0), 0) / CAMPO.length;
    const por = {};
    for (const vs of Object.values(D.votos)) {
      const voters = Object.keys(vs).filter(v => D.miembros?.[v]);
      for (const v of voters) {
        const otros = voters.filter(o => o !== v);
        (por[v] ||= []).push({ mio: prom(vs[v]), otros: otros.length ? otros.reduce((t, o) => t + prom(vs[o]), 0) / otros.length : null });
      }
    }
    const ids = new Set();
    for (const [v, xs] of Object.entries(por)) {
      if (xs.length < HATER.minVotos) continue;
      const media = xs.reduce((t, x) => t + x.mio, 0) / xs.length;
      const comp = xs.filter(x => x.otros !== null);
      const dif = comp.length >= HATER.minVotos ? comp.reduce((t, x) => t + x.mio - x.otros, 0) / comp.length : 0;
      if (media <= HATER.maxPromedio || dif <= HATER.maxDiferencia) ids.add(v);
    }
    haterCache = { votos: D.votos, ids };
  }
  return haterCache.ids.has(id);
}

  if (ui.modal === 'faltas' && !m) ui.modal = null;
  if (ui.modal === 'mvp-votar' && clave) try { sessionStorage.setItem(clave, '1'); } catch {}
  if (ui.modal === 'reemplazar' && !esAdmin()) ui.modal = null;
  if (ui.modal === 'cancha' && !D.grupo.equipos) ui.modal = null;
  if (ui.modal === 'fecha' && !esAdmin()) ui.modal = null;
  if (ui.modal === 'reemplazar' && ui.reemplazar && !D.grupo.anotados.includes(ui.reemplazar)) ui.reemplazar = null;
  return ui.modal === 'mvp-votar' ? modalVotarMvp() : ui.modal === 'mvp-editar' ? modalEditarMvp()
    : ui.modal === 'faltas' ? modalFaltas() : ui.modal === 'reemplazar' ? modalReemplazar() : ui.modal === 'avisos' ? modalAvisos() : ui.modal === 'calificar' ? modalCalificar() : ui.modal === 'bajar' ? modalBajar() : ui.modal === 'foto' ? modalFoto() : ui.modal === 'recalificar' ? modalRecalificar() : ui.modal === 'ficha' ? modalFicha() : ui.modal === 'instalar' ? modalInstalar() : ui.modal === 'cancha' ? modalCancha() : ui.modal === 'fecha' ? modalFecha() : '';
}

// renovar: pide un token nuevo (por ejemplo, después de cambiar la contraseña).
async function api(accion, datos = {}, url, renovar = false) {
  if (!url) throw Object.assign(new Error('sin api'), { mensaje: 'Falta configurar el servidor de Vercel (ver README)' });
  const headers = { 'Content-Type': 'application/json', 'X-Firebase-AppCheck': await tokenAppCheck() };
  if (D.user) headers.Authorization = 'Bearer ' + await D.user.getIdToken(renovar);
  const r = await fetch(url, {
    method: 'POST',
    headers,
    body: JSON.stringify({ accion, ...datos }),
  }).catch(e => {
    throw Object.assign(e, { mensaje: 'No se pudo conectar con el servidor. Probá de nuevo en un rato o desde otra red (por ejemplo, datos del celular).' });
  });
  if (r.status === 401 && D.user && !renovar) return api(accion, datos, url, true);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error), { mensaje: j.error || `Error del servidor (${r.status})` });
  return j;
}

// Carga perezosa: un botón con data-perezoso se "toca" solo cuando aparece en pantalla.
function activarCargaPerezosa() {
  const b = document.querySelector('#app [data-perezoso]');
  if (!b || b._obs || !('IntersectionObserver' in window)) return;
  b._obs = new IntersectionObserver(es => {
    if (es[0].isIntersecting) { b._obs.disconnect(); b.click(); }
  }, { rootMargin: '200px' });
  b._obs.observe(b);
}

// Re-renderiza sin perder lo que el usuario está escribiendo.
function pintar(el, html) {
  if (el._html === html) return;
  const sucios = [...el.querySelectorAll('[data-dirty]')].map(i => [i.id, i.value, i.checked]);
  const foco = el.contains(document.activeElement) ? document.activeElement.id : null;
  // Dónde estaba el cursor: si no, al redibujar queda al principio y se escribe al revés.
  let cursor = null;
  try { if (foco) cursor = [document.activeElement.selectionStart, document.activeElement.selectionEnd]; } catch {}
  // Lo que tenía scroll propio (los modales, como la cancha): que no vuelva arriba al redibujar.
  const conScroll = () => [...el.querySelectorAll('.overflow-y-auto, .overflow-auto')].map((x, i) => [`${i}:${x.getAttribute('aria-label') || ''}`, x]);
  const scrolls = new Map(conScroll().filter(([, x]) => x.scrollTop).map(([k, x]) => [k, x.scrollTop]));
  el.innerHTML = el._html = html;
  if (scrolls.size) conScroll().forEach(([k, x]) => { if (scrolls.has(k)) x.scrollTop = scrolls.get(k); });
  sucios.forEach(([id, v, checked]) => {
    const i = document.getElementById(id);
    if (!i) return;
    if (i.type === 'radio' || i.type === 'checkbox') i.checked = checked;
    else i.value = v;
    i.dataset.dirty = '1';
    if (i.dataset.out) document.getElementById(i.dataset.out).textContent = v;
  });
  if (foco) {
    const i = document.getElementById(foco);
    i?.focus();
    try { if (cursor?.[0] != null) i.setSelectionRange(...cursor); } catch {}  // (los type="number" no tienen cursor)
  }
}

  const el = $('#app');

  if (location.hash === '#/terminos') return pintar(el, vistaTerminos());
  if (location.hash === '#/privacidad') return pintar(el, vistaPrivacidad());
  const link = location.hash.match(/^#\/(clave|verificar)\/([A-Za-z0-9_-]+)$/);
  if (link) return pintar(el, link[1] === 'clave' ? vistaNuevaClave(link[2]) : vistaVerificar(link[2]));

// Guarda el resultado de la fecha, con los equipos con los que se jugó (suplentes
// incluidos) y los nombres, así se sigue viendo aunque alguien se vaya del grupo.
async function guardarResultado(ganador, goles = null, goleadores = null) {
  const p = D.grupo.partido, eq = D.grupo.equipos, d = derivar();
  const base = {
    fecha: p.fecha, ganador, A: eq?.A || [], B: eq?.B || [], por: miUid(), ts: Date.now(),
    ...(goles ? { golesA: goles[0], golesB: goles[1] } : {}),
  };
  const SA = suplentesDe('A', d).map(j => j.id), SB = suplentesDe('B', d).map(j => j.id);
  const nombres = Object.fromEntries([...base.A, ...base.B, ...SA, ...SB].map(id => [id, jugador(id)?.usuario]).filter(x => x[1]));
  const ref = F.doc(colResultados(D.gid), p.fecha);
  const ok = await act(async () => {
    try { await F.setDoc(ref, { ...base, SA, SB, nombres, ...(goleadores ? { goles: goleadores } : {}) }); }
    // Con las reglas viejas de Firestore no se pueden guardar los suplentes: va sin ellos.
    catch (e) { if (e.code !== 'permission-denied') throw e; await F.setDoc(ref, base); }
  }, '🏁 Resultado guardado');
  if (ok) { ui.corregirResultado = false; ui.sinGoles = false; render(); }
  return ok;
}

async function guardarPerfil(f) {
  const edad = parseInt(f.get('edad'));
  if (!(edad >= 10 && edad <= 99)) return toast('Poné una edad entre 10 y 99');
  const ok = await escribirPerfil({ edad, posicion: f.get('posicion'), foto: ui.foto ?? D.perfil?.foto ?? '', cuadro: cuadroDe(f) }, '💾 Ficha guardada');
  if (ok) { ui.foto = null; ui.cuadroElegido = undefined; }
  return ok;
}

// Escribe la ficha con lo que cambió (el resto queda como estaba), en el usuario y en cada grupo.
async function escribirPerfil(cambio, msg = '💾 Guardado') {
  const uid = miUid();
  const actual = D.perfil || {};
  const datos = {
    usuario: actual.usuario || usuarioDeAuth(),
    edad: actual.edad,
    posicion: actual.posicion || 'comodin',
    foto: actual.foto || '',
    lesionado: !!actual.lesionado,
    cuadro: actual.cuadro || '',
    ...cambio,
  };
  return act(async () => {
    await F.setDoc(refUsuario(uid), { ...datos, grupos: actual.grupos || [], creado: actual.creado || Date.now(), ...(actual.pendientes?.length ? { pendientes: actual.pendientes } : {}) });
    // La ficha se copia en cada grupo para que solo la vean sus miembros.
    await Promise.allSettled((actual.grupos || []).map(g => F.updateDoc(F.doc(colMiembros(g.id), uid), datos)));
  }, msg);
}

const formularios = {
  'dato-edad': async f => {
    const edad = parseInt(f.get('edad'));

  entrar: async f => {
    if (avisoMail(f.get('usuario'))) return toast(avisoMail(f.get('usuario')));

    if (!ok) guardado.set(CLAVE_ACTUALIZAR, null);
    return ok;
  },
  registro: async f => {
    const usuario = f.get('usuario').trim();
    if (avisoMail(usuario)) return toast(avisoMail(usuario));
    if (!/^[A-Za-z0-9_.]{3,20}$/.test(usuario)) return toast('El usuario puede tener letras, números, punto o guion bajo (3 a 20)');
    const edad = parseInt(f.get('edad'));
    const minima = CONFIG.publico ? 13 : 10;
    if (!(edad >= minima && edad <= 99)) return toast(`Poné una edad entre ${minima} y 99`);
    const mail = (f.get('mail') || '').trim();
    const error = revisarClave(f, usuario);
    if (error) return toast(error);
    if (CONFIG.publico) {
      if (!f.get('acepto')) return toast('Tenés que aceptar los términos y la privacidad');
      guardado.set(CLAVE_ACTUALIZAR, 'mail');
    }
    const datos = { usuario, edad, posicion: f.get('posicion'), foto: ui.foto || '', cuadro: cuadroDe(f), grupos: [], creado: Date.now() };
    D.registrando = true;
    render();
    const ok = await act(async () => {
      const cred = await A.createUserWithEmailAndPassword(auth, emailDe(usuario), f.get('pass'));
      await F.setDoc(refUsuario(cred.user.uid), datos);
      // Si falla el mail, se vuelve a pedir en "Actualizá tu cuenta".
      if (mail) await api('mail', { mail }, urlCuenta()).catch(e => console.error(e));
    }, `¡Bienvenido, ${usuario}! ⚽`);
    D.registrando = false;
    if (ok) ui.foto = null;
    render();
    return ok;
  },
  perfil: guardarPerfil,
  resultado: f => {
    // Con goleadores: cada uno lo suyo; el marcador es la suma.
    if (f.has('x_A')) {
      const goles = {}, tot = { A: 0, B: 0 };
      for (const [k, v] of f) {
        const n = parseInt(v) || 0;
        if (n < 0 || n > 30) return toast('Poné entre 0 y 30 goles');
        if (k.startsWith('g_') && n) goles[k.slice(2)] = n;
      }
      for (const e of ['A', 'B']) tot[e] = [...document.querySelectorAll(`[data-gol="${e}"]`)].reduce((t, i) => t + (parseInt(i.value) || 0), 0);
      return guardarResultado(tot.A > tot.B ? 'A' : tot.B > tot.A ? 'B' : 'empate', [tot.A, tot.B], goles);
    }
    const a = parseInt(f.get('golesA')), b = parseInt(f.get('golesB'));
    if (!(a >= 0 && b >= 0 && a <= 99 && b <= 99)) return toast('Poné los goles de los dos equipos');
    return guardarResultado(a > b ? 'A' : b > a ? 'B' : 'empate', [a, b]);
  },
  agenda: async f => {
    const dias = f.getAll('dia'), horas = f.getAll('hora'), lugares = f.getAll('lugarFijo');

    for (let i = 0; i < dias.length; i++) {
      if (dias[i] === '') continue;
      const hora = normalizarHora((horas[i] || '').trim());
      if (!horaValida(hora)) return toast('Poné la hora como 20:00');
      slots.push({ dia: Number(dias[i]), hora, lugar: (lugares[i] || '').trim() });
    }
    if (!slots.length) return toast('Elegí al menos un día');
    const ok = await actualizarGrupo(s => {
      s.agenda = { slots, saltear: (s.agenda?.saltear || []).filter(f => f >= hoyArg()) };

      if (!s.partido.fecha || s.partido.fecha < hoyArg()) {
        const [prox] = proximasFechas(s.agenda, ayerArg());
        if (prox) s.partido = { ...s.partido, fecha: prox.fecha, cuando: prox.hora, lugar: prox.lugar || s.partido.lugar };
