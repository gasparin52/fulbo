// Jugador del partido: se vota desde una hora después de que empieza el partido (si no
// tiene hora, desde las 00:00 del día siguiente) hasta las 23:59 del día siguiente.
// Todo en hora argentina (UTC-3). Las reglas de Firestore hacen la misma cuenta.
const TZ = 'America/Argentina/Buenos_Aires';
const DIA = 864e5;
const MIN_VOTOS_MVP = 3;
const inicioDia = fecha => Date.parse(`${fecha}T00:00:00-03:00`);
const horaValida = c => /^([01]\d|2[0-3]):[0-5]\d$/.test(c || '');
const abreVotacion = (fecha, hora) => horaValida(hora) ? Date.parse(`${fecha}T${hora}:00-03:00`) + 3600e3 : inicioDia(fecha) + DIA;
const cierraVotacion = fecha => inicioDia(fecha) + 2 * DIA;
// "20", "20hs", "8:30", "20.30 hs" → "20:00", "08:30", "20:30". Si no se entiende, queda como está.
function normalizarHora(t) {
  const m = t.match(/^(\d{1,2})(?:\s*[:.h]\s*(\d{2}))?\s*(?:h|hs|hrs?)?\.?$/i);
  if (!m || +m[1] > 23 || +(m[2] || 0) > 59) return t;
  return `${m[1].padStart(2, '0')}:${m[2] || '00'}`;
}
// La hora del partido aunque esté escrita como "Viernes 20hs" (null si no se entiende).
function horaDelPartido(p) {
  if (horaValida(p.cuando)) return p.cuando;
  const m = (p.cuando || '').match(/(\d{1,2})(?:\s*[:.]\s*(\d{2}))?\s*(?:h|hs|hrs?)\b/i) || (p.cuando || '').match(/\b(\d{1,2}):(\d{2})\b/);
  if (!m || +m[1] > 23 || +(m[2] || 0) > 59) return null;
  return `${m[1].padStart(2, '0')}:${m[2] || '00'}`;
}
// Duración (máximo 2 h), cierre de equipos y "en juego".
const DURACION_DEFAULT = 60, DURACIONES = [30, 40, 50, 60, 70, 80, 90, 100, 110, 120];
const CIERRE_EQUIPOS_MIN = 30;      // los equipos se cierran media hora antes
const BLOQUEO_DESPUES_H = 6;        // después de terminar, la lista sigue bloqueada un rato
const duracionDe = p => Math.min(120, Math.max(30, Number(p.duracion) || DURACION_DEFAULT));
function tiemposPartido() {
  const p = D.grupo?.partido, h = p && horaDelPartido(p);
  if (!p?.fecha || !h) return null;
  const inicio = Date.parse(`${p.fecha}T${h}:00-03:00`), dur = duracionDe(p) * 60e3;
  return { inicio, fin: inicio + dur, cierre: inicio - CIERRE_EQUIPOS_MIN * 60e3, dur, hora: h };
}
// 'normal' | 'cerrado' (equipos cerrados) | 'enjuego' | 'terminado' (recién terminado).
function fasePartido() {
  const t = tiemposPartido(), n = Date.now();
  if (!t || D.grupo.partido.suspendido) return 'normal';
  if (n >= t.fin + BLOQUEO_DESPUES_H * 3600e3) return 'normal';
  return n >= t.fin ? 'terminado' : n >= t.inicio ? 'enjuego' : n >= t.cierre ? 'cerrado' : 'normal';
}
const listaBloqueada = () => ['enjuego', 'terminado'].includes(fasePartido());
const equiposCerrados = () => fasePartido() !== 'normal';
const reloj = ms => { const t = Math.max(0, Math.floor(ms / 1000)); return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; };
// Fecha y hora argentinas de un momento: "martes 3/11 a las 21:00".
const momentoLindo = ms => {
  const iso = new Date(ms - 3 * 3600e3).toISOString();
  return `${fechaLinda(iso.slice(0, 10))} a las ${iso.slice(11, 16)}`;
};
// Hasta cuándo se vota: "hoy a las 23:59", "mañana a las 23:59" o la fecha.
const hastaCuando = m => {
  const hoy = new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
  const ultimo = new Date(m.cierra - 1 - 3 * 3600e3).toISOString().slice(0, 10);
  const manana = new Date(Date.parse(hoy + 'T12:00:00Z') + DIA).toISOString().slice(0, 10);
  return `${ultimo === hoy ? 'hoy' : ultimo === manana ? 'mañana' : 'el ' + fechaLinda(ultimo)} a las 23:59`;
};
const fechaLinda = f => {
  if (!f) return '';
  const d = new Date(`${f}T12:00:00-03:00`);
  return `${d.toLocaleDateString('es-AR', { weekday: 'long', timeZone: TZ })} ${d.getUTCDate()}/${d.getUTCMonth() + 1}`;
};

};

// ---------------- Utilidades ----------------

const genId = (n = 20) => {
  const abc = 'abcdefghijkmnpqrstuvwxyz23456789';
  return [...crypto.getRandomValues(new Uint8Array(n))].map(x => abc[x % abc.length]).join('');
};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};

const emailDe = usuario => `${usuario.trim().toLowerCase()}@${CONFIG.dominio}`;

const esAdmin = () => !!(D.grupo && D.user && D.grupo.admins.includes(D.user.uid));
// Admins y "armadores" (designados por un admin) pueden armar y editar los equipos.
const esArmador = id => !!D.grupo?.armadores.includes(id);
const puedeEditarEquipos = () => esAdmin() || esArmador(miUid());
const equipoDe = id => D.grupo?.equipos?.A.includes(id) ? 'A' : D.grupo?.equipos?.B.includes(id) ? 'B' : null;
const otroEquipo = e => (e === 'A' ? 'B' : 'A');
const NOMBRE_EQUIPO = { A: '🔴 Equipo A', B: '🔵 Equipo B' };

// Pasa a alguien al equipo "a" dentro de un estado de grupo (para usar en actualizarGrupo).
// Sirve para titulares (A / B) y para suplentes (SA / SB).
function moverDeEquipo(s, id, a) {
  if (!s.equipos) return;
  const de = otroEquipo(a);
  for (const p of ['', 'S']) {
    const lista = s.equipos[p + de] || [];
    if (!lista.includes(id)) continue;
    s.equipos[p + de] = lista.filter(x => x !== id);
    s.equipos[p + a] = [...(s.equipos[p + a] || []), id];
    s.equipos.editado = true;
  }
}

// Cada suplente queda asignado a un equipo (SA / SB) por si le toca entrar. Se
// equilibran aparte de los titulares: cada uno va al lado con menos suplentes y, si
// empatan, al de suplentes más flojos. En modo equilibrado se reparten de mejor a peor
// (queda en serpentina); los que se anotan después se suman con la misma cuenta.
function repartirSuplentes(s) {
  const eq = s.equipos;
  const sups = dividir(s).suplentes.map(p => p.id);
  eq.SA = (eq.SA || []).filter(id => sups.includes(id));
  eq.SB = (eq.SB || []).filter(id => sups.includes(id));
  const fuerza = e => eq['S' + e].reduce((t, id) => t + puntaje(id), 0);
  const nuevos = sups.filter(id => !eq.SA.includes(id) && !eq.SB.includes(id));
  if (eq.modo !== 'aleatorio') nuevos.sort((a, b) => puntaje(b) - puntaje(a));
  nuevos.forEach(id => {
    const e = eq.SA.length !== eq.SB.length ? (eq.SA.length < eq.SB.length ? 'A' : 'B') : fuerza('A') <= fuerza('B') ? 'A' : 'B';
    eq['S' + e].push(id);
  });
}

// Puntaje al lado de cada uno en los equipos. Admins y armadores ven el que se usa para
// equilibrar (con el nivel del admin si no tiene votos); el resto, el promedio de votos.
function chipNota(id) {
  const r = resumen(id);
  const v = puedeEditarEquipos() ? puntaje(id) : r.n ? r.general : null;
  return `<span class="w-8 shrink-0 text-right text-xs font-mono font-bold ${v === null ? 'text-slate-600' : colorNota(v)}" title="${r.n ? `Promedio de ${r.n} ${r.n === 1 ? 'voto' : 'votos'}` : 'Sin votos todavía'}">${v === null ? '–' : v.toFixed(1)}</span>`;
}

// Suplentes vigentes de un equipo, en el orden de la lista (S1, S2…).
const suplentesDe = (e, d) => d.suplentes.filter(p => (D.grupo.equipos?.['S' + e] || []).includes(p.id));
const esSuper = () => !!D.user && D.user.email === emailDe(CONFIG.superadmin);
const cortar = arr => { arr.forEach(f => f()); arr.length = 0; };
const urlBase = () => location.origin + location.pathname;
const linkInvitacion = () => `${urlBase()}#/unirse/${D.gid}/${D.grupo.codigo}`;

let toastTimer;
function toast(msg) {

  t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.opacity = 0), 2600);
}

function msgError(e) {
  const c = e?.code || '';
  return {
    'auth/email-already-in-use': 'Ese nombre de usuario ya existe',
    'auth/invalid-credential': 'Usuario o contraseña incorrectos',
    'auth/invalid-login-credentials': 'Usuario o contraseña incorrectos',
    'auth/wrong-password': 'Usuario o contraseña incorrectos',
    'auth/user-not-found': 'Usuario o contraseña incorrectos',
    'auth/weak-password': 'La contraseña tiene que tener al menos 6 caracteres',
    'auth/too-many-requests': 'Demasiados intentos, esperá un rato',
    'auth/operation-not-allowed': 'Falta habilitar el login en Firebase',
    'auth/configuration-not-found': 'Falta habilitar el login en Firebase',
    'auth/network-request-failed': 'Sin conexión',
    'permission-denied': 'No tenés permiso para hacer eso',
  }[c] || 'Algo salió mal' + (c ? ` (${c})` : '');
}

async function act(fn, okMsg) {
  try {
    await fn();
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    console.error(e);
    toast('❌ ' + (e.mensaje || msgError(e)));
    return false;
  }
}

// Transacción sobre el documento del grupo. Solo escribe los campos que
// cambiaron: los jugadores solo pueden tocar "anotados" (ver firestore.rules).
function actualizarGrupo(mut, okMsg) {
  const gid = D.gid;
  return act(() => F.runTransaction(db, async tx => {
    const snap = await tx.get(refGrupo(gid));
    const antes = normGrupo(snap.data());
    const s = structuredClone(antes);
    mut(s);
    const patch = {};
    for (const k of Object.keys(s)) if (JSON.stringify(s[k]) !== JSON.stringify(antes[k])) patch[k] = s[k];
    if (Object.keys(patch).length) tx.update(refGrupo(gid), patch);
  }), okMsg);
}

// ---------------- Suscripciones ----------------
A.onAuthStateChanged(auth, user => {
  const ultimoIngreso = Date.parse(user?.metadata.lastSignInTime || '');
  if (user && Date.now() - ultimoIngreso > CONFIG.diasSesion * 864e5) {
    toast('Tu sesión venció, entrá de nuevo');
    return A.signOut(auth);
  }
  cortar(subsUser);
  cortar(subsGrupo);
  cortar(subsMvp);
  nivelesDe = mvpDe = null;
  Object.assign(D, { user, perfil: user ? undefined : null, gid: null, grupo: null, miembros: null, votos: {}, niveles: {}, mvp: null, mvps: [], estrellas: {}, cargado: {}, faltas: [], reportes: [], rehacer: [], bajas: [] });
  if (user) {
    subsUser.push(F.onSnapshot(refUsuario(user.uid), s => {
      D.perfil = s.exists() ? s.data() : null;
      if (D.perfil) D.registrando = false;
      elegirGrupo();
      procesarInvitacion();
      render();
    }, e => { console.error(e); toast('❌ ' + msgError(e)); }));
  }
  render();
});

function elegirGrupo() {
  const ids = (D.perfil?.grupos || []).map(g => g.id);
  const quiero = guardado.get(LS + 'gid');
  const gid = ids.includes(quiero) ? quiero : ids.includes(D.gid) ? D.gid : ids[0] || null;
  if (gid === D.gid) return;
  cortar(subsGrupo);
  cortar(subsMvp);
  nivelesDe = mvpDe = null;
  Object.assign(D, { gid, grupo: null, miembros: null, votos: {}, niveles: {}, mvp: null, mvps: [], estrellas: {}, cargado: {}, faltas: [], reportes: [], rehacer: [], bajas: [] });
  if (!gid) return;
  guardado.set(LS + 'gid', gid);
  subsGrupo.push(F.onSnapshot(refGrupo(gid), s => {
    if (!s.exists()) return olvidarGrupo(gid, 'Ese grupo ya no existe');
    D.grupo = normGrupo(s.data());
    suscribirNiveles();
    suscribirReportes();
    suscribirRehacer();
    render();
  }, e => {
    if (e.code === 'permission-denied') olvidarGrupo(gid, 'Ya no sos parte de ese grupo');
    else console.error(e);
  }));
  subsGrupo.push(F.onSnapshot(colMiembros(gid), qs => {
    D.miembros = Object.fromEntries(qs.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
    render();
  }, e => console.warn(e.code)));
  subsGrupo.push(F.onSnapshot(colVotos(gid), qs => {
    const v = {};
    qs.docs.forEach(d => { const x = d.data(); (v[x.target] ||= {})[x.voter] = x.stats; });
    D.votos = v;

// ---------------- 🙋 Pedir rehacer los equipos ----------------
// Cada jugador anotado puede pedir que se rehagan los equipos. Todos ven cuántos lo

  cortarRehacer = esAdmin()

  subsGrupo.push(() => { cortarRehacer?.(); cortarRehacer = rehacerDe = null; });
}
const rondaActual = () => {
  const eq = D.grupo?.equipos, rh = D.grupo?.rehacer;
  return eq?.ronda && rh?.ronda === eq.ronda ? eq.ronda : null;
};
const pedidosRehacer = () => (rondaActual() ? D.grupo.rehacer.n : 0);
// Con el 60% de los titulares que tienen cuenta (los invitados no votan) se rehacen solos.
const PORCENTAJE_REHACER = 0.6;
const umbralRehacer = d => Math.max(2, Math.ceil(PORCENTAJE_REHACER * d.titulares.filter(p => !p.invitado).length));
const quienesRehacer = () => D.rehacer.filter(r => r.ronda && r.ronda === rondaActual()).map(r => r.id);
// Al armar equipos nuevos empieza otra ronda y los pedidos vuelven a cero.
function nuevaRonda(s) {
  if (!s.equipos) { s.rehacer = null; return; }
  s.equipos.ronda = genId(8);
  s.rehacer = { ronda: s.equipos.ronda, n: 0 };
}
// El pedido y el contador se escriben juntos: las reglas chequean que cuadren.
function pedirRehacer(quiero) {
  const gid = D.gid, uid = miUid();
  return act(() => F.runTransaction(db, async tx => {
    const g = normGrupo((await tx.get(refGrupo(gid))).data());
    const mio = await tx.get(refRehacer(gid, uid));
    const ronda = g.equipos?.ronda;
    if (!ronda || g.rehacer?.ronda !== ronda) return;
    if ((mio.exists() && mio.data().ronda === ronda) === quiero) return;
    if (quiero) tx.set(refRehacer(gid, uid), { ronda, ts: Date.now() });
    else tx.delete(refRehacer(gid, uid));
    tx.update(refGrupo(gid), { rehacer: { ronda, n: g.rehacer.n + (quiero ? 1 : -1) } });
  }), quiero ? '🙋 Pedido enviado' : 'Pedido cancelado');
}

// ---------------- 🌦️ Clima ----------------
// Pronóstico de Open-Meteo (gratis, sin clave) para la hora del partido en la ciudad
// que eligió el admin. Solo hay pronóstico para los próximos 16 días.
const CLIMA_TTL = 30 * 60e3, CLIMA_REINTENTO = 10 * 60e3, HORA_CLIMA_DEFAULT = '20:00';
let clima = { clave: null, t: 0, datos: null, cargando: false };
const hoyArg = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
function estadoClima() {
  const p = D.grupo?.partido, c = D.grupo?.ciudad;
  if (!c?.lat || !p?.fecha) return null;
  const dias = Math.round((Date.parse(p.fecha + 'T12:00:00Z') - Date.parse(hoyArg() + 'T12:00:00Z')) / DIA);
  if (dias < 0) return null;
  if (dias > 15) return { lejos: true };
  const hora = horaValida(p.cuando) ? p.cuando : HORA_CLIMA_DEFAULT;
  const clave = `${c.lat},${c.lon},${p.fecha},${hora}`;
  const vence = clima.datos ? CLIMA_TTL : CLIMA_REINTENTO;
  if (!clima.cargando && (clima.clave !== clave || Date.now() - clima.t > vence)) cargarClima(clave, c, p.fecha, hora);
  return clima.clave === clave && clima.datos ? { ...clima.datos, hora } : null;
}
async function cargarClima(clave, c, fecha, hora) {
  if (clima.clave !== clave) clima.datos = null;
  Object.assign(clima, { clave, t: Date.now(), cargando: true });
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`
      + '&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,is_day'
      + `&timezone=${encodeURIComponent(TZ)}&start_date=${fecha}&end_date=${fecha}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('clima ' + r.status);
    const h = (await r.json()).hourly;
    const i = h.time.indexOf(`${fecha}T${hora.slice(0, 2)}:00`);
    if (i < 0) throw new Error('clima sin hora');
    if (clima.clave === clave) clima.datos = {
      temp: h.temperature_2m[i], lluvia: h.precipitation_probability[i], viento: h.wind_speed_10m[i],
      codigo: h.weather_code[i], dia: h.is_day[i] === 1,
    };
  } catch (e) {
    console.warn(e);  // Sin clima no pasa nada (por ejemplo, si la red lo bloquea).
  } finally {
    clima.cargando = false;
    render();
  }
}
// Códigos del tiempo de la OMM (los que usa Open-Meteo).
function cieloDe(codigo, dia) {
  if (codigo === 0) return dia ? ['☀️', 'Despejado'] : ['🌙', 'Despejado'];
  if (codigo <= 2) return dia ? ['🌤️', 'Algo nublado'] : ['☁️', 'Algo nublado'];
  if (codigo === 3) return ['☁️', 'Nublado'];
  if (codigo <= 48) return ['🌫️', 'Niebla'];
  if (codigo <= 57) return ['🌦️', 'Llovizna'];
  if (codigo <= 67) return ['🌧️', 'Lluvia'];
  if (codigo <= 77) return ['🌨️', 'Nieve'];
  if (codigo <= 82) return ['🌦️', 'Chaparrones'];
  if (codigo <= 86) return ['🌨️', 'Nieve'];
  return ['⛈️', 'Tormenta'];
}

// Carteles arriba de todo: partido suspendido y faltan jugadores.

const haceCuanto = ts => {

  return min < 1 ? 'recién' : min < 60 ? `hace ${min} min` : min < 1440 ? `hace ${Math.round(min / 60)} h` : min < 2880 ? 'ayer' : `hace ${Math.floor(min / 1440)} días`;
};
// Busca la ciudad que escribió el admin (prefiere Argentina si hay varias con el mismo nombre).
async function buscarCiudad(texto) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(texto)}&count=10&language=es&format=json`);
  if (!r.ok) throw Object.assign(new Error('geo'), { mensaje: 'No se pudo buscar la ciudad. Probá de nuevo más tarde' });
  const res = (await r.json()).results || [];
  const c = res.find(x => x.country_code === 'AR') || res[0];
  if (!c) throw Object.assign(new Error('geo'), { mensaje: `No encontré la ciudad "${texto}"` });
  const redondear = x => Math.round(x * 1e4) / 1e4;
  return { nombre: [c.name, c.admin1, c.country_code !== 'AR' && c.country].filter(Boolean).join(', '), lat: redondear(c.latitude), lon: redondear(c.longitude) };
}

// ---------------- 🟥 Faltó sin avisar ----------------
// Una falta vence cuando el jugador se anotó en 2 fechas posteriores. En la primera
// fecha en que se anota después de la falta queda castigado: si se llena la lista,
// los que llegan después le pasan por delante y él queda de suplente.
const fechasDespues = (f, id) => D.mvps.filter(m => m.id > f.fecha && (m.anotados || m.candidatos || []).includes(id)).length;
const rojasDe = id => D.faltas.filter(f => f.target === id && fechasDespues(f, id) < 2);
// La fecha en curso no cuenta para levantar el castigo: dura hasta que se pasa a la próxima.
const castigado = id => {
  const actual = D.grupo?.partido.fecha;
  return rojasDe(id).some(f => actual !== f.fecha
    && !D.mvps.some(m => m.id > f.fecha && m.id !== actual && (m.anotados || m.candidatos || []).includes(id)));
};
const hoyAR = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);

// ⭐ Estrellas: cuántas veces fue jugador del partido cada uno (empates incluidos).
// Una votación cerrada ya no cambia, así que su resultado se guarda en el celular.
const historialMvp = {};
let cargandoHistorial = false;
async function cargarHistorialMvp() {
  const gid = D.gid, docs = D.mvps || [];
  if (cargandoHistorial || !gid) return;
  cargandoHistorial = true;
  for (const m of docs) {
    const k = `${gid}/${m.id}`;
    if (estadoMvp(m) !== 'cerrada' || historialMvp[k]) continue;
    const clave = `${LS}mvp_res_${gid}_${m.id}`;
    let ganadores = null;
    try { ganadores = JSON.parse(guardado.get(clave)); } catch {}
    if (!Array.isArray(ganadores)) {
      try {
        const qs = await F.getDocs(colVotosMvp(gid, m.id));
        ganadores = resultadoMvp({ votos: Object.fromEntries(qs.docs.map(d => [d.id, d.data().voto])) }).ganadores;
        guardado.set(clave, JSON.stringify(ganadores));
      } catch (e) {
        console.warn(e.code);
        continue;
      }
    }
    historialMvp[k] = ganadores;
  }
  cargandoHistorial = false;
  if (D.gid !== gid) return;
  const estrellas = {};
  docs.forEach(m => (historialMvp[`${gid}/${m.id}`] || []).forEach(id => (estrellas[id] = (estrellas[id] || 0) + 1)));
  D.estrellas = estrellas;
  render();
}
const estrellasDe = id => D.estrellas?.[id] || 0;

// ---------------- Jugador del partido ----------------
const estadoMvp = (m = D.mvp, ahora = Date.now()) => !m ? null : ahora < m.abre ? 'pendiente' : ahora < m.cierra ? 'abierta' : 'cerrada';

// Mi voto se lee siempre; los votos de todos, recién cuando cierra (así lo exigen las reglas).
function actualizarSubsMvp() {
  const m = D.mvp;
  const clave = m ? `${D.gid}/${m.id}/${estadoMvp() === 'cerrada'}` : null;
  if (clave === mvpDe) return;
  cortar(subsMvp);
  mvpDe = clave;
  if (!m) return;
  const gid = D.gid;
  subsMvp.push(F.onSnapshot(F.doc(colVotosMvp(gid, m.id), miUid()), s => {
    if (D.mvp?.id !== m.id) return;
    D.mvp.miVoto = s.exists() ? s.data().voto : null;
    render();
  }, e => console.warn(e.code)));
  if (estadoMvp() === 'cerrada') {
    subsMvp.push(F.onSnapshot(colVotosMvp(gid, m.id), qs => {
      if (D.mvp?.id !== m.id) return;
      D.mvp.votos = Object.fromEntries(qs.docs.map(d => [d.id, d.data().voto]));
      render();
    }, e => console.warn(e.code)));
  }
}

// Candidatos: los titulares del partido (con nombre guardado por si después se van del grupo).
function datosVotacion(s, fecha) {
  const candidatos = dividir(s).titulares.map(p => p.id);

    abre: abreVotacion(fecha, s.partido.cuando),

  };

function crearVotacion(fecha) {

  }));

// Una hora después de que empieza el partido, el primero que abre la app crea la votación.
let mvpIntentado = null;
function asegurarVotacion() {
  const f = D.grupo?.partido.fecha;
  // Espera a tener las votaciones y las 🟥, que deciden quiénes fueron titulares.
  if (!f || !D.miembros || !D.cargado.mvps || !D.cargado.faltas || D.mvp?.id === f || mvpIntentado === `${D.gid}/${f}`) return;
  if (Date.now() < abreVotacion(f, D.grupo.partido.cuando) || Date.now() >= cierraVotacion(f)) return;
  mvpIntentado = `${D.gid}/${f}`;
  crearVotacion(f);

function resultadoMvp(m) {
  const conteo = {};
  Object.values(m.votos || {}).forEach(id => (conteo[id] = (conteo[id] || 0) + 1));
  const total = Object.values(conteo).reduce((a, b) => a + b, 0);
  const max = Math.max(0, ...Object.values(conteo));
  const ganadores = total >= MIN_VOTOS_MVP ? Object.keys(conteo).filter(id => conteo[id] === max) : [];
  return { conteo, total, max, ganadores };
}

// ---------------- Jugadores, votos y puntajes ----------------
function jugador(id) {
  if (id.startsWith('inv_')) {
    const i = D.grupo?.invitados[id];
    return i && { id, usuario: i.nombre, posicion: i.posicion, invitado: true };
  }
  return D.miembros?.[id];
}

function resumen(id) {
  const p = jugador(id);
  // Solo cuentan los votos de gente que sigue en el grupo.
  const vs = Object.entries(D.votos[id] || {}).filter(([voter]) => D.miembros?.[voter]).map(([, s]) => s);
  if (!vs.length) return { n: 0 };
  const prom = {};
  STATS.forEach(s => (prom[s.k] = vs.reduce((t, v) => t + (v[s.k] || 0), 0) / vs.length));
  const campo = CAMPO.reduce((t, k) => t + prom[k], 0) / CAMPO.length;
  const general = p?.posicion === 'arquero' ? (campo + prom.arquero) / 2 : campo;
  return { n: vs.length, prom, general };
}

// Para equilibrar: promedio de votos si tiene; si no, el nivel que puso el admin.
function puntaje(id) {
  const r = resumen(id);
  return r.n ? r.general : Number(D.niveles[id]) || NIVEL_DEFAULT;
}

// Titulares y suplentes de un estado de grupo. Los castigados (🟥) entran de titular
// solo si sobra lugar; entre los suplentes se respeta el orden de llegada.
function dividir(s) {
  const lista = s.anotados.map(jugador).filter(Boolean);
  const cupo = Number(s.partido.cupo) || 10;
  const entran = new Set([...lista.filter(p => !castigado(p.id)), ...lista.filter(p => castigado(p.id))].slice(0, cupo));
  return { cupo, titulares: lista.filter(p => entran.has(p)), suplentes: lista.filter(p => !entran.has(p)) };
}
const derivar = () => dividir(D.grupo);
const baseKey = titulares => titulares.map(p => p.id).sort().join(',');
const equiposDesactualizados = d => D.grupo.equipos && D.grupo.equipos.base !== baseKey(d.titulares);

// Cuando se llena el cupo, el primer admin o armador que tiene la app abierta arma
// los equipos equilibrados. Una sola vez por lista: si después los borran, no insiste.
let autoArmado = null, supsRepartidos = null, rondaIniciada = null, rehechos = null;
function asegurarEquipos() {
  const c = D.cargado;
  if (!puedeEditarEquipos() || !D.miembros || !c.votos || !c.niveles || !c.mvps || !c.faltas) return;
  const d = derivar(), eq = D.grupo.equipos;
  // Equipos armados antes de que existieran los pedidos para rehacer: les abre una ronda.
  if (eq && !eq.ronda && rondaIniciada !== D.gid) {
    rondaIniciada = D.gid;
    actualizarGrupo(s => { if (s.equipos && !s.equipos.ronda) nuevaRonda(s); });
  }
  // Suplentes que se anotaron después de armar: se suman solos a un equipo.
  if (eq && !equiposDesactualizados(d) && d.suplentes.some(p => ![...(eq.SA || []), ...(eq.SB || [])].includes(p.id))) {
    const clave = `${D.gid}/${d.suplentes.map(p => p.id).join(',')}`;
    if (supsRepartidos !== clave) {
      supsRepartidos = clave;
      actualizarGrupo(s => { if (s.equipos) repartirSuplentes(s); });
    }
  }
  const ronda = rondaActual();
  if (equiposCerrados()) return;
  if (ronda && !equiposDesactualizados(d) && pedidosRehacer() >= umbralRehacer(d) && rehechos !== ronda) {
    rehechos = ronda;
    actualizarGrupo(s => {
      if (!s.equipos || s.rehacer?.ronda !== ronda || s.rehacer.n < umbralRehacer(dividir(s))) return;
      const { titulares } = dividir(s);
      s.equipos = { ...armarEquipos(titulares, 'equilibrado'), modo: 'equilibrado', base: baseKey(titulares) };
      repartirSuplentes(s);
      nuevaRonda(s);
      s.solicitudes = {};
    }, '🔄 La mayoría pidió rehacerlos: equipos nuevos');
  }
  if (d.titulares.length < d.cupo) return;
  const clave = `${D.gid}/${baseKey(d.titulares)}`;
  if (autoArmado === clave) return;
  autoArmado = clave;
  if (D.grupo.equipos && !equiposDesactualizados(d)) return;
  actualizarGrupo(s => {
    const { titulares, cupo } = dividir(s);
    const base = baseKey(titulares);
    if (titulares.length < cupo || s.equipos?.base === base) return;
    s.equipos = { ...armarEquipos(titulares, 'equilibrado'), modo: 'equilibrado', base };
    repartirSuplentes(s);
    nuevaRonda(s);
    s.solicitudes = {};
  }, '⚖️ Se llenó el cupo: equipos equilibrados armados');
}

function armarEquipos(jugadores, modo) {
  const mezclados = shuffle([...jugadores]);
  const A = [], B = [];
  if (modo === 'aleatorio') {
    mezclados.forEach((p, i) => (i % 2 ? B : A).push(p.id));
    return { A, B };
  }
  // Equilibrado: prueba todas las formas de partir en dos (mismo tamaño, ±1) y se queda
  // con la de menor diferencia de puntaje. Los arqueros quedan repartidos mitad y mitad.
  // Entre las que empatan elige una al azar, así "Armar equilibrados" puede variar.
  const n = mezclados.length;
  const pts = mezclados.map(p => puntaje(p.id));
  const total = pts.reduce((a, b) => a + b, 0);
  const arq = mezclados.map(p => p.posicion === 'arquero');
  const nArq = arq.filter(Boolean).length;
  const tam = Math.floor(n / 2);
  if (n > 20) return serpentina(mezclados);
  let mejor = Infinity, mejores = [];
  for (let m = 0; m < 1 << n; m++) {
    let cant = 0, suma = 0, arqs = 0;
    for (let i = 0; i < n; i++) if (m & (1 << i)) { cant++; suma += pts[i]; if (arq[i]) arqs++; }
    if (cant !== tam) continue;
    if (nArq >= 2 && (arqs < Math.floor(nArq / 2) || arqs > Math.ceil(nArq / 2))) continue;
    const dif = Math.abs(total - 2 * suma);
    if (dif < mejor - 1e-9) { mejor = dif; mejores = [m]; }
    else if (dif < mejor + 1e-9) mejores.push(m);
  }
  const m = mejores[Math.floor(Math.random() * mejores.length)];
  mezclados.forEach((p, i) => (m & (1 << i) ? B : A).push(p.id));
  return Math.random() < 0.5 ? { A, B } : { A: B, B: A };
}

// Para listas muy largas: de mayor a menor en serpentina A, B, B, A… (arqueros uno por lado).
function serpentina(jugadores) {
  const A = [], B = [];
  const orden = jugadores.sort((a, b) => puntaje(b.id) - puntaje(a.id));
  let resto = orden, offset = 0;
  const arqueros = orden.filter(p => p.posicion === 'arquero');
  if (arqueros.length >= 2) {
    A.push(arqueros[0].id);
    B.push(arqueros[1].id);
    resto = orden.filter(p => p !== arqueros[0] && p !== arqueros[1]);
    offset = 2;
  }
  resto.forEach((p, i) => (['A', 'B', 'B', 'A'][(i + offset) % 4] === 'A' ? A : B).push(p.id));
  return { A, B };
}

  const L = ['🆚 *EQUIPOS*'];
  [['🔴', 'Equipo A', 'A'], ['🔵', 'Equipo B', 'B']].forEach(([emoji, nom, e]) => {

async function copiar(texto, msg = '📋 ¡Copiado! Pegalo en el grupo') {
  try {
    await navigator.clipboard.writeText(texto);
  } catch {
    const ta = Object.assign(document.createElement('textarea'), { value: texto });
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast(msg);
}

// Recorta al centro y achica a 256×256: ~20 KB, entra cómodo en Firestore.
async function procesarFoto(file) {
  const img = await createImageBitmap(file);
  const L = 256, lado = Math.min(img.width, img.height);
  const c = Object.assign(document.createElement('canvas'), { width: L, height: L });
  c.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, L, L);
  return c.toDataURL('image/jpeg', 0.82);
}

function radar(prom) {
  const size = 300, c = size / 2, R = 96, n = STATS.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
  const poly = r => STATS.map((_, i) => pt(i, r).map(x => x.toFixed(1)).join(',')).join(' ');
  const anillos = [2, 4, 6, 8, 10].map(v => `<polygon points="${poly((R * v) / 10)}" fill="none" stroke="#334155"/>`).join('');
  const ejes = STATS.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#334155"/>`; }).join('');
  const datos = prom
    ? `<polygon points="${STATS.map((s, i) => pt(i, (R * prom[s.k]) / 10).map(x => x.toFixed(1)).join(',')).join(' ')}" fill="rgba(16,185,129,.35)" stroke="#10b981" stroke-width="2" stroke-linejoin="round"/>`
    : '';
  const etiquetas = STATS.map((s, i) => {
    const [x, y] = pt(i, R + 26);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#94a3b8">${s.corto}${prom ? `<tspan fill="#e2e8f0"> ${prom[s.k].toFixed(1)}</tspan>` : ''}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" class="w-full max-w-[320px] mx-auto">${anillos}${ejes}${datos}${etiquetas}</svg>`;
}

function indicadorClima() {
  const c = estadoClima();
  if (!c) return '';
  if (c.lejos) return '<p class="mt-4 text-xs text-slate-500 rounded-xl border border-dashed border-slate-700 px-3 py-2">🌤️ El pronóstico aparece cuando faltan 16 días o menos</p>';
  const [icono, cielo] = cieloDe(c.codigo, c.dia);
  // El fondo cambia según el tiempo: lluvia, sol, noche despejada o nublado.
  const mojado = c.lluvia >= 50 || (c.codigo >= 51 && c.codigo <= 67) || c.codigo >= 80;
  const tema = mojado ? 'from-sky-600/30 via-blue-800/20 to-slate-900/40 border-sky-500/30'
    : c.codigo <= 2 && c.dia ? 'from-amber-400/25 via-orange-500/10 to-slate-900/40 border-amber-400/30'
    : c.codigo <= 2 ? 'from-indigo-600/30 via-violet-800/15 to-slate-900/40 border-indigo-400/30'
    : 'from-slate-500/25 via-slate-700/20 to-slate-900/40 border-slate-500/30';
  const consejo = c.lluvia >= 70 ? '☔ Muy probable que llueva' : c.lluvia >= 40 ? '🌂 Puede llover' : c.viento >= 35 ? '🌬️ Mucho viento' : c.temp >= 30 ? '🥵 Llevá agua' : c.temp <= 8 ? '🧤 Abrigate' : '';
  const abierto = !!ui.climaAbierto;
  // Cerrado: una fila con lo justo. Tocándola se despliega el detalle.
  const dato = (titulo, valor, alerta, color, pct) => `
    <div class="flex-1 rounded-lg bg-slate-950/40 px-3 py-1.5">
      <div class="text-[10px] uppercase tracking-wide text-slate-400">${titulo}</div>
      <div class="font-bold ${alerta ? color : 'text-slate-100'}">${valor}</div>
      ${pct != null ? `<div class="mt-1 h-1 rounded-full bg-slate-700/70 overflow-hidden"><div class="h-full rounded-full bg-sky-400" style="width:${pct}%"></div></div>` : ''}
    </div>`;
  return `
    <div class="mt-3 rounded-xl border bg-gradient-to-br ${tema} text-sm">
      <button data-action="toggle-clima" aria-expanded="${abierto}" class="w-full flex items-center gap-2.5 px-3 py-2 text-left">
        <span class="text-xl leading-none">${icono}</span>
        <span class="font-bold text-slate-100">${Math.round(c.temp)}°</span>
        <span class="text-slate-300 truncate">${cielo}</span>
        <span class="ml-auto flex items-center gap-2.5 shrink-0 text-xs">
          <span class="${c.lluvia >= 50 ? 'text-sky-300 font-semibold' : 'text-slate-400'}">💧 ${c.lluvia}%</span>
          <span class="${c.viento >= 30 ? 'text-amber-300 font-semibold' : 'text-slate-400'}">💨 ${Math.round(c.viento)}</span>
          <span class="text-slate-400 transition-transform ${abierto ? 'rotate-180' : ''}">▾</span>
        </span>
      </button>
      ${abierto ? `
        <div class="px-3 pb-3">
          ${consejo ? `<p class="text-xs font-semibold text-slate-200 mb-2">${consejo}</p>` : ''}
          <div class="flex gap-2">
            ${dato('💧 Lluvia', `${c.lluvia}%`, c.lluvia >= 50, 'text-sky-300', c.lluvia)}
            ${dato('💨 Viento', `${Math.round(c.viento)} <span class="text-xs font-medium">km/h</span>`, c.viento >= 30, 'text-amber-300')}
          </div>
          <p class="mt-2 text-[11px] text-slate-400">Pronóstico para el ${esc(fechaLinda(D.grupo.partido.fecha))} a las ${esc(c.hora)} en ${esc(D.grupo.ciudad.nombre)} · se actualiza cada media hora</p>
        </div>` : ''}
    </div>`;
}

// "Hoy" / "Mañana" al lado de la fecha del partido.
function cuantoFalta(fecha) {
  if (!fecha) return '';
  const dias = Math.round((Date.parse(fecha + 'T12:00:00Z') - Date.parse(hoyArg() + 'T12:00:00Z')) / DIA);
  return dias === 0 ? 'Hoy' : dias === 1 ? 'Mañana' : dias > 1 && dias < 7 ? `En ${dias} días` : '';
}

function header(d) {
  const p = D.grupo.partido;
  const faltan = d.cupo - d.titulares.length;
  const falta = cuantoFalta(p.fecha);
  const fecha = fechaLinda(p.fecha);
  const chip = 'inline-flex items-center gap-1.5 rounded-lg bg-slate-800/70 border border-slate-700/60 px-2.5 py-1';
  const mapa = p.lugar ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.lugar, D.grupo.ciudad?.nombre].filter(Boolean).join(', '))}` : '';
  return `
    <div>
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <h1 class="text-3xl font-black tracking-tight">${esc(p.titulo || 'Fulbo ⚽')}</h1>
          <div class="mt-2 flex flex-wrap gap-1.5 text-sm">
            ${fecha ? `<span class="${chip}">📅 <b class="font-semibold text-slate-100">${esc(fecha[0].toUpperCase() + fecha.slice(1))}</b>${falta ? `<span class="text-[11px] font-semibold rounded px-1.5 py-0.5 bg-emerald-500/15 text-emerald-300">${falta}</span>` : ''}</span>` : ''}
            ${p.cuando ? `<span class="${chip}">🕗 <b class="font-semibold text-slate-100">${esc(p.cuando)}</b></span>` : ''}
            ${p.lugar ? `<a href="${esc(mapa)}" target="_blank" rel="noopener" title="Ver en el mapa" class="${chip} min-w-0 hover:border-slate-500">📍 <b class="font-semibold text-slate-100 truncate">${esc(p.lugar)}</b></a>` : ''}
          </div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-3xl font-black ${faltan <= 0 ? 'text-emerald-400' : ''}">${d.titulares.length}<span class="text-slate-500 text-xl">/${d.cupo}</span></div>
          <div class="text-xs text-slate-400">${faltan > 0 ? `faltan ${faltan}` : '¡completo!'}</div>
        </div>
      </div>
      <div class="mt-3 h-2 rounded-full bg-slate-800 overflow-hidden">
        <div class="h-full bg-emerald-500 transition-all" style="width:${Math.min(100, (d.titulares.length / d.cupo) * 100)}%"></div>
      </div>
      ${indicadorClima()}
    </div>`;
}

function miEstado(d) {
  const uid = miUid();
  const iT = d.titulares.findIndex(p => p.id === uid);
  const iS = d.suplentes.findIndex(p => p.id === uid);
  const anotado = iT >= 0 || iS >= 0;
  const estado = iT >= 0 ? `<span class="text-emerald-400">✅ Estás anotado · titular #${iT + 1}</span>`
    : iS >= 0 ? `<span class="text-amber-400">⏳ Estás de suplente S${iS + 1}</span>`
    : `<span class="text-slate-400">No estás anotado para este partido</span>`;
  const lleno = d.titulares.length >= d.cupo;
  return card(`
    <p class="text-sm">${estado}</p>
    ${castigado(uid) ? `<p class="mt-2 text-xs text-red-200 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2">🟥 Tenés una tarjeta roja por faltar sin avisar: esta fecha, si se llena la lista, los que se anoten después te pasan adelante y quedás de suplente.</p>` : ''}
    ${listaBloqueada()
      ? `<p class="mt-3 text-xs text-slate-400">${fasePartido() === 'enjuego' ? '⚽ El partido está en juego' : '🏁 El partido terminó'}: la lista está cerrada.</p>`
      : anotado
      ? `<button data-action="bajar" data-id="${uid}" class="${BTN} w-full mt-3 bg-slate-800 hover:bg-red-950 text-red-300 border border-red-900/50">Me bajo 😢</button>`
      : `<button data-action="anotarme" class="${BTN_OK} w-full mt-3 text-lg">⚽ ¡Me anoto!${lleno ? ' <span class="text-sm font-medium">(entrás de suplente)</span>' : ''}</button>`}
  `);
}

function filaJugador(p, etiqueta, clase) {
  // Cada uno se baja con "Me bajo"; sacar a otros de la lista es cosa del admin.
  const puedeBorrar = esAdmin();
  const nombre = `<span class="block font-medium truncate">${esc(p.usuario)}${estrellasDe(p.id) ? ` <span class="text-xs text-amber-300" title="Jugador del partido ${estrellasDe(p.id)} ${estrellasDe(p.id) === 1 ? 'vez' : 'veces'}">⭐${estrellasDe(p.id) > 1 ? estrellasDe(p.id) : ''}</span>` : ''}${marcaLesion(p.id)}${marcaRoja(p.id)}${marcaAsistencia(p.id)}${marcaHater(p.id)}${marcaScout(p.id)}${p.id === miUid() ? ' <span class="text-xs text-emerald-400">(vos)</span>' : ''}${p.invitado ? ' <span class="text-xs text-slate-500">(invitado)</span>' : ''}</span>`;
  return `
    <li class="flex items-center gap-3 py-2">
      <span class="w-9 shrink-0 text-center text-xs font-bold rounded-lg py-1 ${clase}">${etiqueta}</span>
      ${avatar(p, 32)}
      <a href="#/jugador/${p.id}" class="flex-1 min-w-0 hover:text-emerald-300">${nombre}
        <span class="text-xs text-slate-400">${pos(p).emoji} ${pos(p).label}</span>
      </a>
      ${esAdmin() ? `<span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-800 ${colorNota(puntaje(p.id))}" title="Puntaje para equilibrar">${puntaje(p.id).toFixed(1)}</span>` : ''}
      ${puedeBorrar ? `<button data-action="bajar" data-id="${p.id}" title="Sacar de la lista" aria-label="Sacar a ${esc(p.usuario)} de la lista" class="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:text-red-300 hover:bg-red-500/10 transition shrink-0">${ICONO_SACAR}</button>` : ''}
    </li>`;
}

function lista(d) {
  const libres = Array.from({ length: Math.max(0, d.cupo - d.titulares.length) }, (_, i) => `
    <li class="flex items-center gap-3 py-2 opacity-40">
      <span class="w-9 shrink-0 text-center text-xs font-bold rounded-lg py-1 border border-dashed border-slate-600">${d.titulares.length + i + 1}</span>
      <span class="text-sm italic text-slate-500">libre</span>
    </li>`).join('');
  return card(`
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-lg font-bold">✅ Titulares</h2>
      <button data-action="copiar" class="${BTN} bg-green-600 hover:bg-green-500 text-white text-sm py-2">📋 Copiar para WhatsApp</button>
    </div>
    <ul class="divide-y divide-slate-800">
      ${d.titulares.map((p, i) => filaJugador(p, i + 1, 'bg-emerald-500/15 text-emerald-300')).join('')}
      ${libres}
    </ul>
    ${d.suplentes.length ? `
      <h3 class="text-base font-bold mt-5 mb-1">🔁 Suplentes</h3>
      <ul class="divide-y divide-slate-800">
        ${d.suplentes.map((p, i) => filaJugador(p, 'S' + (i + 1), 'bg-amber-500/15 text-amber-300')).join('')}
      </ul>` : ''}
    ${esAdmin() && D.grupo.anotados.length ? `<button data-action="reemplazar" class="${BTN_SEC} w-full mt-4 text-sm inline-flex items-center justify-center gap-2">${ICONO_REEMPLAZAR} Reemplazar a alguien</button>` : ''}
  `);
}

function equipos(d) {
  const eq = D.grupo.equipos;
  const editor = puedeEditarEquipos();
  const vigentes = eq && !equiposDesactualizados(d);
  const botones = editor ? `
    <div class="grid grid-cols-2 gap-2 mt-4">
      <button data-action="armar" data-modo="equilibrado" ${d.titulares.length < 2 ? 'disabled' : ''} class="${BTN_OK} text-sm">⚖️ Armar equilibrados</button>
      <button data-action="armar" data-modo="aleatorio" ${d.titulares.length < 2 ? 'disabled' : ''} class="${BTN_SEC} text-sm">🎲 Aleatorio</button>
    </div>
    ${eq ? `<button data-action="borrar-equipos" class="mt-2 text-xs text-slate-500 hover:text-red-300 underline">Borrar equipos</button>` : ''}` : '';
  if (!eq) {
    return card(`
      <h2 class="text-lg font-bold">🆚 Equipos</h2>
      <p class="text-sm text-slate-400 mt-1">Todavía no se armaron los equipos.</p>
      ${botones}`);
  }
  const solicitudes = Object.entries(D.grupo.solicitudes).filter(([id, s]) => jugador(id) && equipoDe(id) && equipoDe(id) !== s.a);
  const columna = (e, color) => {
    const js = eq[e].map(jugador).filter(Boolean);
    const suma = js.reduce((t, p) => t + puntaje(p.id), 0);
    const mover = p => editor && vigentes ? `<button data-action="mover-equipo" data-id="${p.id}" title="Pasar al ${NOMBRE_EQUIPO[otroEquipo(e)]}" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs shrink-0">${e === 'A' ? '→' : '←'}</button>` : '';
    const sups = vigentes ? suplentesDe(e, d) : [];
    return `
      <div class="rounded-xl border ${color} p-3">
        <div class="flex items-baseline justify-between gap-2">
          <h3 class="font-bold">${NOMBRE_EQUIPO[e]} <span class="text-xs font-normal text-slate-400">(${js.length})</span></h3>
          ${editor ? `<span class="text-xs text-slate-400">Σ ${suma.toFixed(1)} · prom ${(suma / (js.length || 1)).toFixed(1)}</span>` : ''}
        </div>
        <ul class="mt-2 space-y-1.5 text-sm">
          ${js.map(p => `
            <li class="flex items-center gap-2">
              ${avatar(p, 22)}
              <span class="truncate flex-1">${esc(p.usuario)}${D.grupo.solicitudes[p.id] && solicitudes.some(([id]) => id === p.id) ? ' <span title="Pidió cambiarse">🔄</span>' : ''}</span>
              <span>${pos(p).emoji}</span>
              ${chipNota(p.id)}
              ${mover(p)}
            </li>`).join('')}
        </ul>
        ${sups.length ? `
          <p class="mt-3 mb-1.5 text-xs font-semibold text-amber-300/80">🔁 Suplentes</p>
          <ul class="space-y-1.5 text-sm text-slate-300">
            ${sups.map(p => `
              <li class="flex items-center gap-2">
                <span class="text-[10px] font-bold rounded px-1.5 py-0.5 bg-amber-500/15 text-amber-300 shrink-0">S${d.suplentes.indexOf(p) + 1}</span>
                ${avatar(p, 22)}
                <span class="truncate flex-1">${esc(p.usuario)}</span>
                <span>${pos(p).emoji}</span>
                ${chipNota(p.id)}
                ${mover(p)}
              </li>`).join('')}
          </ul>` : ''}
      </div>`;
  };

  // Pedido propio para cambiarse (solo si no puede moverse solo).
  const yo = miUid(), miEquipo = equipoDe(yo), miSolicitud = D.grupo.solicitudes[yo];
  const pedido = vigentes && miEquipo && !editor && !equiposCerrados() ? (miSolicitud && miSolicitud.a !== miEquipo
    ? `<div class="mt-3 flex items-center justify-between gap-2 text-sm bg-sky-500/10 border border-sky-500/20 rounded-xl px-3 py-2">
         <span>🔄 Pediste pasar al ${NOMBRE_EQUIPO[miSolicitud.a]}. Esperando respuesta.</span>
         <button data-action="cancelar-solicitud" class="text-xs text-slate-400 underline shrink-0">Cancelar</button>
       </div>`
    : `<button data-action="pedir-cambio" class="${BTN_SEC} w-full mt-3 text-sm">🔄 Pedir pasar al ${NOMBRE_EQUIPO[otroEquipo(miEquipo)]}</button>`) : '';

  const pendientes = editor && vigentes && solicitudes.length ? `
    <div class="mt-3 rounded-xl border border-sky-500/30 bg-sky-500/5 p-3">
      <h3 class="text-sm font-bold mb-2">🔄 Pedidos de cambio (${solicitudes.length})</h3>
      <ul class="space-y-2">
        ${solicitudes.map(([id, s]) => `
          <li class="flex items-center gap-2 text-sm">
            ${avatar(jugador(id), 24)}
            <span class="flex-1 min-w-0 truncate"><b>${esc(jugador(id).usuario)}</b> quiere pasar al ${NOMBRE_EQUIPO[s.a]}</span>
            <button data-action="aprobar-cambio" data-id="${id}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-emerald-500 text-slate-950">Aprobar</button>
            <button data-action="rechazar-cambio" data-id="${id}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800 text-slate-300">Rechazar</button>
          </li>`).join('')}
      </ul>
    </div>` : '';

  // Pedidos para rehacer los equipos: todos ven cuántos; quiénes, solo los admins.
  const nRehacer = vigentes ? pedidosRehacer() : 0;
  const quienes = esAdmin() ? quienesRehacer().map(id => jugador(id)?.usuario || D.miembros[id]?.usuario).filter(Boolean) : [];
  const umbral = umbralRehacer(d), pct = Math.min(100, Math.round(100 * nRehacer / umbral));
  const avisoRehacer = nRehacer ? `
    <div class="mt-3 rounded-xl border border-violet-500/30 bg-violet-500/10 px-3 py-2 text-sm">
      <div class="flex items-baseline justify-between gap-2">
        <span>🙋 <b>${nRehacer}</b> de <b>${umbral}</b> pidieron rehacer los equipos</span>
        <span class="text-xs font-bold text-violet-200">${pct}%</span>
      </div>
      <div class="mt-1.5 h-2 rounded-full bg-slate-800 overflow-hidden"><div class="h-full rounded-full bg-violet-400 transition-all" style="width:${pct}%"></div></div>
      <p class="text-[11px] text-slate-400 mt-1">Con ${umbral} (el ${Math.round(PORCENTAJE_REHACER * 100)}% de los titulares) se rehacen solos, equilibrados.</p>
      ${quienes.length ? `<p class="text-xs text-violet-200/80 mt-1">${quienes.map(esc).join(', ')} <span class="text-slate-500">(solo lo ven los admins)</span></p>` : ''}
    </div>` : '';
  const yaPedi = D.rehacer.some(r => r.id === yo && r.ronda === rondaActual());
  const botonRehacer = vigentes && rondaActual() && !editor && miEquipo && !equiposCerrados() ? (yaPedi
    ? `<div class="mt-3 flex items-center justify-between gap-2 text-sm bg-violet-500/10 border border-violet-500/20 rounded-xl px-3 py-2">
         <span>🙋 Pediste rehacer los equipos. Nadie ve quién lo pidió.</span>
         <button data-action="rehacer-cancelar" class="text-xs text-slate-400 underline shrink-0">Cancelar</button>
       </div>`
    : `<button data-action="rehacer-pedir" class="${BTN_SEC} w-full mt-3 text-sm">🙋 Pedir rehacer los equipos</button>`) : '';

  const modo = eq.editado ? '✏️ editado a mano' : eq.modo === 'aleatorio' ? '🎲 aleatorio' : '⚖️ equilibrado';
  return card(`
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-bold">🆚 Equipos</h2>
      <span class="text-xs text-slate-500">${modo}</span>
    </div>
    ${vigentes ? '' : `<p class="mt-2 text-xs text-amber-300 bg-amber-500/10 rounded-lg px-3 py-2">⚠️ La lista de titulares cambió desde que se armaron. ${editor ? 'Volvé a armarlos.' : 'Los van a rearmar.'}</p>`}
    ${pendientes}
    ${avisoRehacer}
    <div class="grid sm:grid-cols-2 gap-3 mt-3">
      ${columna('A', 'border-red-500/30 bg-red-500/5')}
      ${columna('B', 'border-sky-500/30 bg-sky-500/5')}
    </div>
    ${editor && vigentes ? '<p class="text-xs text-slate-500 mt-2">Tocá → o ← para pasar a alguien al otro equipo.</p>' : ''}
    ${vigentes ? `<button data-action="copiar-equipos" class="${BTN} w-full mt-3 text-sm bg-green-600 hover:bg-green-500 text-white">📋 Copiar equipos para WhatsApp</button>` : ''}
    ${pedido}
    ${botonRehacer}
    ${botones}`);
}

function tarjetaMvp() {
  const m = D.mvp, estado = estadoMvp();
  if (!m) return '';
  const quien = id => `${avatar(fichaCandidato(m, id), 28)}<b class="truncate">${esc(nombreCandidato(m, id))}</b>`;
  const editar = esAdmin() && estado !== 'cerrada'
    ? `<button data-action="mvp-editar" class="text-xs text-slate-400 underline">Editar candidatos</button>` : '';

  if (estado === 'pendiente') {
    if (!esAdmin()) return '';
    return card(`
      <div class="flex items-center justify-between gap-2">
        <p class="text-sm">🏆 La votación del jugador del partido abre el ${esc(momentoLindo(m.abre))}.</p>
        ${editar}
      </div>`);
  }

  if (estado === 'abierta') {
    const voto = m.miVoto;
    return `
      <div class="${CARD} border-amber-500/40 bg-gradient-to-br from-amber-500/10 to-slate-900">
        <div class="flex items-start justify-between gap-2">
          <div>
            <h2 class="text-lg font-black">🏆 Jugador del partido</h2>
            <p class="text-xs text-slate-400">Del ${esc(fechaLinda(m.id))} · se vota hasta ${hastaCuando(m)}</p>
          </div>
          ${editar}
        </div>
        ${voto
          ? `<div class="mt-3 flex items-center gap-2 text-sm">✅ Votaste a ${quien(voto)}
               <button data-action="mvp-votar" class="ml-auto text-xs text-slate-400 underline shrink-0">Cambiar</button></div>`
          : `<p class="mt-3 text-sm text-amber-200">⚠️ Todavía no votaste.</p>
             <button data-action="mvp-votar" class="${BTN} w-full mt-2 bg-amber-400 hover:bg-amber-300 text-slate-950">🏆 Votar al mejor del partido</button>`}
        ${sinMiVoto(m.candidatos).length ? `
          <div class="mt-3 pt-3 border-t border-amber-500/20 flex items-center gap-3">
            <p class="flex-1 text-xs text-slate-300">Ya que estás, calificá a los que jugaron y todavía no calificaste.</p>
            <button data-action="calificar-rapido" data-ids="${esc(m.candidatos.join(','))}" class="${BTN_SEC} text-xs shrink-0">⭐ Calificar (${sinMiVoto(m.candidatos).length})</button>
          </div>` : ''}
      </div>`;
  }

  // Cerrada: el resultado se muestra 3 días.
  if (Date.now() > m.cierra + 3 * DIA || !m.votos) return '';
  const r = resultadoMvp(m);
  const cuerpo = !r.ganadores.length
    ? `<p class="mt-2 text-sm text-slate-400">Hubo ${r.total} ${r.total === 1 ? 'voto' : 'votos'}: hacen falta al menos ${MIN_VOTOS_MVP}, así que esta vez quedó desierto.</p>`
    : `<div class="mt-3 flex flex-wrap justify-center gap-4">
         ${r.ganadores.map(id => `
           <div class="flex flex-col items-center gap-1">
             ${avatar(fichaCandidato(m, id), 72)}
             <b>${esc(nombreCandidato(m, id))}</b>
           </div>`).join('')}
       </div>
       <p class="text-center text-xs text-slate-400 mt-2">${r.ganadores.length > 1 ? 'Empate con' : 'Con'} ${r.max} de ${r.total} votos</p>
       <button data-action="mvp-copiar" class="${BTN} w-full mt-3 text-sm bg-green-600 hover:bg-green-500 text-white">📋 Copiar resultado para WhatsApp</button>`;
  return `
    <div class="${CARD} border-amber-500/40 bg-gradient-to-br from-amber-500/10 to-slate-900">
      <h2 class="text-lg font-black">🏆 Jugador del partido</h2>
      <p class="text-xs text-slate-400">Del ${esc(fechaLinda(m.id))}</p>
      ${cuerpo}
    </div>`;
}

// 🟥 Admins: reportes pendientes. Los que jugaron: botón para reportar (3 días después del partido).
function tarjetaFaltas() {
  let html = '';
  if (esAdmin() && D.reportes.length) {
    const pend = {};
    D.reportes.forEach(r => (pend[`${r.fecha}_${r.target}`] ||= { fecha: r.fecha, target: r.target, por: [] }).por.push(r.por));
    html += card(`
      <h2 class="text-lg font-bold">🟥 Faltazos reportados <span class="text-sm font-normal text-slate-500">(${Object.keys(pend).length})</span></h2>
      <p class="text-xs text-slate-400 mb-3">Solo cuentan si los aprobás. El reportado no ve quién lo reportó.</p>
      <ul class="space-y-3">
        ${Object.entries(pend).map(([k, r]) => {
          const m = D.mvps.find(x => x.id === r.fecha);
          const p = m ? fichaCandidato(m, r.target) : jugador(r.target) || { id: r.target, usuario: '?', posicion: 'comodin' };
          return `
            <li class="flex items-center gap-2 text-sm">
              ${avatar(p, 32)}
              <div class="flex-1 min-w-0">
                <b class="block truncate">${esc(p.usuario)}</b>
                <span class="text-xs text-slate-400">${esc(fechaLinda(r.fecha))} · lo reportó ${r.por.map(id => esc(jugador(id)?.usuario || '?')).join(', ')}</span>
              </div>
              <button data-action="aprobar-falta" data-k="${esc(k)}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-red-600 text-white shrink-0">Aprobar</button>
              <button data-action="rechazar-falta" data-k="${esc(k)}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800 text-slate-300 shrink-0">Rechazar</button>
            </li>`;
        }).join('')}
      </ul>`);
  }
  const m = D.mvp, ahora = Date.now();
  if (m && m.candidatos.includes(miUid()) && ahora >= m.abre && ahora < m.abre + 3 * DIA) {
    const mios = D.reportes.filter(r => r.fecha === m.id && r.por === miUid()).length;
    html += card(`
      <div class="flex items-center justify-between gap-3">
        <div class="min-w-0">
          <p class="text-sm font-semibold">🟥 ¿Alguien faltó sin avisar el ${esc(fechaLinda(m.id))}?</p>
          <p class="text-xs text-slate-400">${mios ? `Reportaste a ${mios}. ` : ''}Un admin lo revisa antes de que cuente.</p>
        </div>
        <button data-action="faltas-reportar" class="${BTN_SEC} text-sm shrink-0">${mios ? 'Ver' : 'Reportar'}</button>
      </div>`);
  }
  return html;
}

function modalFaltas() {
  const m = D.mvp;
  const mios = new Set(D.reportes.filter(r => r.fecha === m.id && r.por === miUid()).map(r => r.target));
  return modal(`
    <h2 class="text-lg font-black">🟥 ¿Quién faltó sin avisar?</h2>
    <p class="text-sm text-slate-400">Partido del ${esc(fechaLinda(m.id))}. Marcá solo a los que no fueron y no avisaron.</p>
    <p class="text-xs text-amber-200 mt-1 mb-3">Un admin lo revisa antes de que cuente. No es para joder a nadie 😉</p>
    <form data-form="faltas" class="space-y-3">
      <ul class="divide-y divide-slate-800 max-h-[45vh] overflow-y-auto">
        ${m.candidatos.filter(id => id !== miUid()).map(id => {
          const ya = D.faltas.some(f => f.fecha === m.id && f.target === id);
          return `
            <li>
              <label class="flex items-center gap-3 py-2 ${ya ? 'opacity-50' : 'cursor-pointer'}">
                <input type="checkbox" id="falta-${id}" name="falta" value="${id}" ${mios.has(id) || ya ? 'checked' : ''} ${ya ? 'disabled' : ''} class="w-5 h-5 accent-red-500">
                ${avatar(fichaCandidato(m, id), 28)}
                <span class="flex-1 truncate">${esc(nombreCandidato(m, id))}</span>
                ${ya ? '<span class="text-xs text-red-300">🟥 aprobada</span>' : ''}
              </label>
            </li>`;
        }).join('')}
      </ul>
      <button class="${BTN} w-full bg-red-600 hover:bg-red-500 text-white">Guardar</button>
    </form>
    <button data-action="cerrar-modal" class="w-full mt-2 py-2 text-sm text-slate-400">Cancelar</button>`);
}

// Admin: cambiar a alguien de la lista por otro que entra en su mismo lugar (y equipo).
function modalReemplazar() {
  if (!ui.reemplazar) {
    const d = derivar();
    const fila = (p, etiqueta, clase) => `
      <li class="flex items-center gap-3 py-2">
        <span class="w-9 shrink-0 text-center text-xs font-bold rounded-lg py-1 ${clase}">${etiqueta}</span>
        ${avatar(p, 28)}
        <span class="flex-1 min-w-0 truncate">${esc(p.usuario)}</span>
        <button data-action="reemplazar" data-id="${p.id}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-sky-500/15 text-sky-200 hover:bg-sky-500/25 shrink-0">Reemplazar</button>
      </li>`;
    return modal(`
      <h2 class="text-lg font-black">⇄ ¿A quién reemplazás?</h2>
      <p class="text-sm text-slate-400 mb-3">El que pongas entra en su mismo lugar de la lista y en su mismo equipo.</p>
      <ul class="divide-y divide-slate-800 max-h-[55vh] overflow-y-auto">
        ${d.titulares.map((p, i) => fila(p, i + 1, 'bg-emerald-500/15 text-emerald-300')).join('')}
        ${d.suplentes.map((p, i) => fila(p, 'S' + (i + 1), 'bg-amber-500/15 text-amber-300')).join('')}
      </ul>
      <button data-action="cerrar-modal" class="w-full mt-2 py-2 text-sm text-slate-400">Cancelar</button>`);
  }
  const sale = jugador(ui.reemplazar);
  const anotados = new Set(D.grupo.anotados);
  const libres = [
    ...Object.values(D.miembros).sort((a, b) => a.usuario.localeCompare(b.usuario)),
    ...Object.keys(D.grupo.invitados).map(jugador).sort((a, b) => a.usuario.localeCompare(b.usuario)),
  ].filter(p => !anotados.has(p.id));
  return modal(`
    <h2 class="text-lg font-black">⇄ Reemplazar a ${esc(sale.usuario)}</h2>
    <p class="text-sm text-slate-400 mb-3">El que elijas entra en su mismo lugar de la lista${equipoDe(sale.id) || (D.grupo.equipos?.SA || []).concat(D.grupo.equipos?.SB || []).includes(sale.id) ? ' y en su mismo equipo' : ''}.</p>
    <form data-form="reemplazar" class="space-y-3">
      ${libres.length ? `
        <ul class="divide-y divide-slate-800 max-h-[40vh] overflow-y-auto">
          ${libres.map(p => `
            <li>
              <label class="flex items-center gap-3 py-2 cursor-pointer">
                <input type="radio" id="reemp-${p.id}" name="entra" value="${p.id}" class="w-5 h-5 accent-sky-400">

// ---------------- 📋 Asistencia ----------------
// Mira los últimos 90 días: partidos jugados contra faltas sin avisar (pesan 2), bajas
// a último momento, menos de 6 h antes (pesan 1) y bajas tarde, menos de 24 h (pesan ½).
// No cuentan las bajas con lluvia o con el partido suspendido.
const VENTANA_ASISTENCIA = 90 * DIA;
function asistenciaDe(id) {
  const desde = Date.now() - VENTANA_ASISTENCIA;
  const reciente = f => inicioDia(f) >= desde;
  const faltas = D.faltas.filter(f => f.target === id && reciente(f.fecha));
  const jugados = (D.mvps || []).filter(m => reciente(m.fecha) && m.candidatos?.includes(id) && !faltas.some(f => f.fecha === m.fecha)).length;
  const bajas = D.bajas.filter(b => b.target === id && reciente(b.fecha));
  // Si después se volvió a anotar y jugó esa fecha, la baja no cuenta.
  const jugo = f => (D.mvps || []).some(m => m.fecha === f && m.candidatos?.includes(id));
  const cuentan = bajas.filter(b => !b.excusa && !jugo(b.fecha));
  const ultimo = cuentan.filter(b => b.tipo === 'ultimo').length, tarde = cuentan.length - ultimo;
  const peso = jugados + 2 * faltas.length + ultimo + 0.5 * tarde;
  return { jugados, faltas: faltas.length, ultimo, tarde, bajas, pct: peso ? Math.round(100 * jugados / peso) : null };
}
const nivelAsistencia = pct => pct >= 90 ? ['emerald', 'Confiable'] : pct >= 70 ? ['amber', 'Regular'] : ['red', 'Se baja seguido'];
// Al lado del nombre, solo si viene fallando: ⏰.
function marcaAsistencia(id) {
  const a = asistenciaDe(id);
  return a.pct != null && a.pct < 70 ? ` <span class="text-xs" title="Asistencia ${a.pct}%: se baja seguido a último momento o falta">⏰</span>` : '';
}
function tarjetaAsistencia(id) {
  const a = asistenciaDe(id);
  if (a.pct == null && !a.bajas.length) return '';
  const [color, nivel] = a.pct == null ? ['slate', 'Sin partidos'] : nivelAsistencia(a.pct);
  const excusa = { lluvia: '🌧️ había lluvia, no cuenta', suspendido: '🚫 se suspendió, no cuenta' };
  const textoColor = { emerald: 'text-emerald-300', amber: 'text-amber-300', red: 'text-red-300', slate: 'text-slate-400' }[color];
  const barraColor = { emerald: 'bg-emerald-400', amber: 'bg-amber-400', red: 'bg-red-400', slate: 'bg-slate-500' }[color];
  return card(`
    <div class="flex items-baseline justify-between gap-2">
      <h2 class="font-bold">📋 Asistencia <span class="text-xs font-normal text-slate-500">(últimos 90 días)</span></h2>
      <span class="font-black text-xl ${textoColor}">${a.pct == null ? '–' : a.pct + '%'}</span>
    </div>
    ${a.pct != null ? `<div class="mt-2 h-2 rounded-full bg-slate-800 overflow-hidden"><div class="h-full rounded-full ${barraColor}" style="width:${a.pct}%"></div></div>` : ''}
    <p class="text-sm mt-2"><b class="${textoColor}">${nivel}</b> · ${a.jugados} jugados${a.faltas ? ` · ${a.faltas} 🟥 sin avisar` : ''}${a.ultimo ? ` · ${a.ultimo} a último momento` : ''}${a.tarde ? ` · ${a.tarde} tarde` : ''}</p>
    ${a.bajas.length ? `
      <ul class="mt-2 space-y-1 text-xs text-slate-400">
        ${a.bajas.sort((x, y) => y.ts - x.ts).map(b => `
          <li class="flex items-center gap-2">
            <span class="flex-1">${b.tipo === 'ultimo' ? '⏰ A último momento' : '🕐 Tarde'}: se bajó ${b.horas < 1 ? 'menos de 1 h' : Math.floor(b.horas) + ' h'} antes, el ${esc(fechaLinda(b.fecha))}${b.excusa ? ` · ${excusa[b.excusa]}` : ''}</span>
            ${esAdmin() ? `<button data-action="perdonar-baja" data-k="${esc(b.id)}" class="underline shrink-0">Perdonar</button>` : ''}
          </li>`).join('')}
      </ul>` : ''}`);
}

// Al lado del nombre: 🟥 (o 🟥2) mientras tenga faltas vigentes.
function marcaRoja(id) {
  const n = rojasDe(id).length;
  if (!n) return '';
  return ` <span class="text-xs" title="Faltó sin avisar${n > 1 ? ` ${n} veces` : ''}${castigado(id) ? '. Esta fecha, si se llena la lista, queda de suplente' : ''}">🟥${n > 1 ? n : ''}</span>`;

// 😈 Hater: con al menos 3 compañeros calificados, en promedio pone 3 o menos, o
// califica 2,5 puntos o más por debajo de lo que les ponen los demás a los mismos.
// Se miran solo las 6 habilidades de campo (Arquero baja a casi todos y no cuenta).
const HATER = { minVotos: 3, maxPromedio: 3, maxDiferencia: -2.5 };
let haterCache = { votos: null, ids: new Set() };
function esHater(id) {
  if (haterCache.votos !== D.votos) {
    const prom = s => CAMPO.reduce((t, k) => t + (s[k] || 0), 0) / CAMPO.length;
    const por = {};
    for (const vs of Object.values(D.votos)) {
      const voters = Object.keys(vs).filter(v => D.miembros?.[v]);
      for (const v of voters) {
        const otros = voters.filter(o => o !== v);
        (por[v] ||= []).push({ mio: prom(vs[v]), otros: otros.length ? otros.reduce((t, o) => t + prom(vs[o]), 0) / otros.length : null });
      }
    }
    const ids = new Set();
    for (const [v, xs] of Object.entries(por)) {
      if (xs.length < HATER.minVotos) continue;
      const media = xs.reduce((t, x) => t + x.mio, 0) / xs.length;
      const comp = xs.filter(x => x.otros !== null);
      const dif = comp.length >= HATER.minVotos ? comp.reduce((t, x) => t + x.mio - x.otros, 0) / comp.length : 0;
      if (media <= HATER.maxPromedio || dif <= HATER.maxDiferencia) ids.add(v);
    }
    haterCache = { votos: D.votos, ids };
  }
  return haterCache.ids.has(id);
}

const SA = { usuarios: null, cargando: false, error: null, editando: null, foto: null, passSugerida: genId(8) };

async function api(accion, datos = {}) {
  if (!CONFIG.api) throw Object.assign(new Error('sin api'), { mensaje: 'Falta configurar el servidor de Vercel (ver README)' });
  const headers = { 'Content-Type': 'application/json' };
  if (D.user) headers.Authorization = 'Bearer ' + await D.user.getIdToken();
  const r = await fetch(CONFIG.api, {
    method: 'POST',
    headers,
    body: JSON.stringify({ accion, ...datos }),
  }).catch(e => {
    throw Object.assign(e, { mensaje: 'No se pudo conectar con el servidor. Probá de nuevo en un rato o desde otra red (por ejemplo, datos del celular).' });
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error), { mensaje: j.error || `Error del servidor (${r.status})` });
  return j;
}

async function cargarUsuarios() {
  if (SA.cargando) return;
  SA.cargando = true;
  SA.error = null;
  try {
    SA.usuarios = (await api('listar')).usuarios.sort((a, b) => a.usuario.localeCompare(b.usuario));
  } catch (e) {
    console.error(e);
    // "Failed to fetch": no llegó al servidor (red que lo bloquea) o el servidor se cayó.
    SA.error = e.mensaje || 'No se pudo conectar con el servidor. Si estás en la red del trabajo, probá desde el celular con datos.';
    SA.usuarios ??= [];  // sin reintentos automáticos: está el botón Recargar
  }
  SA.cargando = false;
  render();
}

// Re-renderiza sin perder lo que el usuario está escribiendo.
function pintar(el, html) {
  if (el._html === html) return;
  const sucios = [...el.querySelectorAll('[data-dirty]')].map(i => [i.id, i.value, i.checked]);
  const foco = el.contains(document.activeElement) ? document.activeElement.id : null;
  el.innerHTML = el._html = html;
  sucios.forEach(([id, v, checked]) => {
    const i = document.getElementById(id);
    if (!i) return;
    if (i.type === 'radio' || i.type === 'checkbox') i.checked = checked;
    else i.value = v;
    i.dataset.dirty = '1';
    if (i.dataset.out) document.getElementById(i.dataset.out).textContent = v;
  });
  if (foco) document.getElementById(foco)?.focus();
}

function render() {
  renderVistas();
  const listo = D.user && D.perfil && D.grupo && D.miembros?.[miUid()];
  pintar($('#modal'), listo ? renderModal() : '');
  if (listo) {
    asegurarVotacion();
    asegurarEquipos();
  }
}

function renderVistas() {
  const el = $('#app');
  if (D.user === undefined) return pintar(el, cargando());
  if (!D.user) return pintar(el, vistaLogin()), actualizarAvisoUsuario();
  if (D.perfil === undefined || (D.registrando && !D.perfil)) return pintar(el, cargando(D.registrando ? 'Creando tu cuenta…' : undefined));
  if (!D.perfil) return pintar(el, vistaCompletar());
  if (location.hash === '#/usuarios' && esSuper()) return pintar(el, vistaUsuarios());
  if (location.hash === '#/reglas') return pintar(el, vistaReglas());
  if (location.hash === '#/grupos' || !D.gid) return pintar(el, vistaGrupos(!!D.gid));
  if (!D.grupo || !D.miembros || !D.miembros[miUid()]) return pintar(el, cargando());
  const m = location.hash.match(/^#\/jugador\/(.+)$/);
  if (m && jugador(m[1])) return pintar(el, vistaFicha(m[1]));
  pintar(el, vistaPrincipal());
}

async function guardarPerfil(f) {
  const edad = parseInt(f.get('edad'));
  if (!(edad >= 10 && edad <= 99)) return toast('Poné una edad entre 10 y 99');
  const uid = miUid();
  const actual = D.perfil || {};
  const datos = {
    usuario: actual.usuario || usuarioDeAuth(),
    edad,
    posicion: f.get('posicion'),
    foto: ui.foto ?? actual.foto ?? '',
    lesionado: !!actual.lesionado,
  };
  const ok = await act(async () => {
    await F.setDoc(refUsuario(uid), { ...datos, grupos: actual.grupos || [], creado: actual.creado || Date.now() });
    // La ficha se copia en cada grupo para que solo la vean sus miembros.
    await Promise.allSettled((actual.grupos || []).map(g => F.updateDoc(F.doc(colMiembros(g.id), uid), datos)));
  }, '💾 Ficha guardada');
  if (ok) ui.foto = null;
  return ok;
}

      // Entra en el mismo equipo; si los equipos estaban al día, siguen al día.
      if (s.equipos) {
        for (const k of ['A', 'B', 'SA', 'SB']) if (s.equipos[k]) s.equipos[k] = s.equipos[k].map(x => (x === sale ? entra : x));
        if (alDia) s.equipos.base = baseKey(titulares.map(p => ({ id: p.id === sale ? entra : p.id })));
      }
    }, `⇄ ${jugador(sale)?.usuario || 'Jugador'} reemplazado`);
    if (ok) { ui.modal = null; render(); }
    return ok;
  },
  faltas: async f => {
    const m = D.mvp, uid = miUid();
    const marcados = new Set(f.getAll('falta'));
    const mios = D.reportes.filter(r => r.fecha === m.id && r.por === uid);
    const ok = await act(async () => {
      const b = F.writeBatch(db);
      m.candidatos.filter(id => marcados.has(id) && !mios.some(r => r.target === id))
        .forEach(id => b.set(F.doc(colReportes(D.gid), `${m.id}_${id}_${uid}`), { fecha: m.id, target: id, por: uid, ts: Date.now() }));
      mios.filter(r => !marcados.has(r.target)).forEach(r => b.delete(F.doc(colReportes(D.gid), r.id)));
      await b.commit();
    }, marcados.size ? '🟥 Enviado. Lo revisa un admin' : 'Listo');
    if (ok) { ui.modal = null; render(); }
    return ok;
  },
  'mvp-candidatos': async f => {
    const m = D.mvp;
    const candidatos = f.getAll('cand');
    const nuevo = (f.get('nuevo') || '').trim();
    if (nuevo) candidatos.push('inv_' + genId(10));
    if (!candidatos.length) return toast('Tiene que haber al menos un candidato');
    const nombres = Object.fromEntries(candidatos.map(id => [id, id === candidatos.at(-1) && nuevo ? nuevo : nombreCandidato(m, id)]));
    const ok = await act(() => F.updateDoc(refMvp(D.gid, m.id), { candidatos, nombres }), '💾 Candidatos actualizados');
    if (ok) { ui.modal = null; render(); }
    return ok;
  },
  partido: async f => {
    const cupo = Math.max(2, Math.min(30, parseInt(f.get('cupo')) || 10));
    // La ciudad se busca solo si cambió (el campo muestra el nombre que se guardó).
    const texto = (f.get('ciudad') || '').trim();
    let ciudad = D.grupo.ciudad || null;
    if (texto !== (ciudad?.nombre || '')) {
      if (!texto) ciudad = null;
      else {
        try { ciudad = await buscarCiudad(texto); }
        catch (e) { toast('❌ ' + (e.mensaje || 'No se pudo buscar la ciudad')); return false; }
      }
    }
    const ok = await actualizarGrupo(s => {
      s.partido = { ...s.partido, titulo: f.get('titulo').trim(), fecha: f.get('fecha') || '', cuando: normalizarHora(f.get('cuando').trim()), lugar: f.get('lugar').trim(), cupo, duracion: duracionDe({ duracion: parseInt(f.get('duracion')) }) };
      s.ciudad = ciudad;
    }, ciudad && ciudad.nombre !== D.grupo.ciudad?.nombre ? `💾 Partido guardado · clima de ${ciudad.nombre}` : '💾 Partido guardado');
    // El campo de ciudad muestra el nombre que encontró (puede diferir de lo escrito).
    if (ok) { const i = $('#p-ciudad'); if (i) i.value = ciudad?.nombre || ''; }
    return ok;
  },
  invitado: f => {
    const id = 'inv_' + genId(10);
    const nivel = Number(f.get('nivel'));
    return actualizarGrupo(s => {
      s.invitados[id] = { nombre: f.get('nombre').trim(), posicion: f.get('posicion') };
      s.anotados.push(id);
    }, 'Invitado anotado').then(ok => ok && nivel !== NIVEL_DEFAULT ? guardarNivel(id, nivel).then(() => ok) : ok);
  },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  if ('fondo' in b.dataset && e.target !== b) return;  // clic dentro del modal: no lo cierra
  acciones[b.dataset.action]?.(b.dataset);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el) cambios[el.dataset.change]?.(el, el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id) t.dataset.dirty = '1';
  if (t.dataset.out) document.getElementById(t.dataset.out).textContent = t.value;
  if (t.id === 'l-usuario') actualizarAvisoUsuario();
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const btn = form.querySelector('button:not([type=button])');
  if (btn) btn.disabled = true;
  try {
    if (await formularios[form.dataset.form]?.(new FormData(form), form.dataset)) {
      form.querySelectorAll('[data-dirty]').forEach(i => delete i.dataset.dirty);
      if (['crear-grupo', 'unirse', 'invitado', 'sa-crear'].includes(form.dataset.form)) {
        form.reset();
        form.querySelectorAll('[data-out]').forEach(i => (document.getElementById(i.dataset.out).textContent = i.value));
      }
      form._html = null;
      render();
    }
  } finally {
    if (btn && btn.isConnected) btn.disabled = false;
  }
});

leerInvitacion();
render();
// La votación abre y cierra por horario: revisar cada medio minuto.
setInterval(() => { actualizarSubsMvp(); cargarHistorialMvp(); render(); }, 30000);
</script>
