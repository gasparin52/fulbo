<!doctype html>
<html lang="es" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fulbo ⚽ Anotate</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    select, input { color-scheme: dark; }
    input[type=range] { accent-color: #10b981; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
  <div id="app" class="max-w-2xl mx-auto px-4 py-6 space-y-5"><p class="text-slate-400">Cargando…</p></div>
  <div id="modal"></div>
  <div id="toast" class="fixed z-50 bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-xl bg-slate-100 text-slate-900 font-medium shadow-xl opacity-0 pointer-events-none transition-opacity max-w-[90vw] text-center"></div>

<script type="module">
// ======================= CONFIGURACIÓN =======================
const CONFIG = {
  firebase: {
    apiKey: 'AIzaSyAuvaJTlSBo-FGc-CV5XvxIB6lSgMYgG4g',
    authDomain: 'fulbo-5d6f5.firebaseapp.com',
    projectId: 'fulbo-5d6f5',
    storageBucket: 'fulbo-5d6f5.firebasestorage.app',
    messagingSenderId: '52183970723',
    appId: '1:52183970723:web:d996338f96b0448ae42016',
  },
  // Los usuarios entran con nombre de usuario; por dentro Firebase usa
  // "usuario@dominio". Tiene que coincidir con firestore.rules.
  dominio: 'fulbo.app',
  // Usuario con acceso al panel de usuarios (el servidor lo vuelve a verificar).
  superadmin: 'gasparin',
  // URL de la función de Vercel (api/admin.js).
  api: 'https://fulbo-one.vercel.app/api/admin',
  // Días que dura la sesión antes de pedir la contraseña de nuevo.
  diasSesion: 30,
};
// =============================================================

const POS = {
  comodin:   { label: 'Jugador/Comodín', corto: 'Comodín', emoji: '🃏' },
  arquero:   { label: 'Arquero', corto: 'Arquero', emoji: '🧤' },
  defensor:  { label: 'Defensor', corto: 'Defensor', emoji: '🛡️' },
  medio:     { label: 'Mediocampista', corto: 'Medio', emoji: '⚙️' },
  delantero: { label: 'Delantero', corto: 'Delantero', emoji: '⚽' },
};
const STATS = [
  { k: 'velocidad', label: 'Velocidad', corto: 'VEL', emoji: '⚡' },
  { k: 'tecnica',   label: 'Técnica',   corto: 'TÉC', emoji: '🎩' },
  { k: 'pase',      label: 'Pase',      corto: 'PAS', emoji: '🎯' },
  { k: 'remate',    label: 'Remate',    corto: 'REM', emoji: '💥' },
  { k: 'defensa',   label: 'Defensa',   corto: 'DEF', emoji: '🛡️' },
  { k: 'fisico',    label: 'Resistencia', corto: 'RES', emoji: '🔋' },  // la clave sigue siendo "fisico" para no perder votos
  { k: 'arquero',   label: 'Arquero',   corto: 'ARQ', emoji: '🧤' },
];
const CAMPO = STATS.filter(s => s.k !== 'arquero').map(s => s.k);
const NIVEL_DEFAULT = 5;
const LS = 'f5_';

// ---------------- Firebase ----------------
const V = '10.12.2';
let A, F, auth, db;
try {
  const [{ initializeApp }, authMod, fsMod] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
  ]);
  A = authMod;
  F = fsMod;
  const app = initializeApp(CONFIG.firebase);
  auth = A.getAuth(app);
  db = F.getFirestore(app);
  // Desarrollo: http://localhost:8791/?emulador usa los emuladores locales de Firebase.
  if (location.hostname === 'localhost' && new URLSearchParams(location.search).has('emulador')) {
    A.connectAuthEmulator(auth, 'http://127.0.0.1:9099', { disableWarnings: true });
    F.connectFirestoreEmulator(db, '127.0.0.1', 8085);
    CONFIG.api = 'http://localhost:3001/api/admin';
  }
} catch (e) {
  console.error(e);
  document.querySelector('#app').innerHTML = '<p class="text-red-300">No se pudo cargar Firebase. Revisá la conexión y recargá la página.</p>';
  throw e;
}

const refUsuario = id => F.doc(db, 'usuarios', id);
const refGrupo = g => F.doc(db, 'grupos', g);
const colMiembros = g => F.collection(db, 'grupos', g, 'miembros');
const colVotos = g => F.collection(db, 'grupos', g, 'votos');
const refNiveles = g => F.doc(db, 'grupos', g, 'privado', 'niveles');
const colMvp = g => F.collection(db, 'grupos', g, 'mvp');
const refMvp = (g, fecha) => F.doc(db, 'grupos', g, 'mvp', fecha);
const colVotosMvp = (g, fecha) => F.collection(db, 'grupos', g, 'mvp', fecha, 'votos');

// Jugador del partido: se vota el día siguiente al partido, de 00:00 a 23:59 (hora argentina, UTC-3).
const TZ = 'America/Argentina/Buenos_Aires';
const DIA = 864e5;
const MIN_VOTOS_MVP = 3;
const abreVotacion = fecha => Date.parse(`${fecha}T00:00:00-03:00`) + DIA;
const fechaLinda = f => {
  if (!f) return '';
  const d = new Date(`${f}T12:00:00-03:00`);
  return `${d.toLocaleDateString('es-AR', { weekday: 'long', timeZone: TZ })} ${d.getUTCDate()}/${d.getUTCMonth() + 1}`;
};

// ---------------- Estado ----------------
const datosGrupoIniciales = () => ({
  partido: { titulo: 'Fulbo ⚽', fecha: '', cuando: '', lugar: '', cupo: 10 },  // fecha: "AAAA-MM-DD"
  anotados: [],                // uids e ids de invitados ("inv_…"), en orden de llegada
  invitados: {},               // id -> { nombre, posicion } (gente sin cuenta)
  equipos: null,               // { A: [ids], B: [ids], modo, base, editado }
  solicitudes: {},             // uid -> { a: 'A'|'B', ts } pedidos para cambiarse de equipo
});
const normGrupo = d => {
  const g = { nombre: '', admins: [], armadores: [], codigo: '', baneados: [], ...datosGrupoIniciales(), ...(d || {}) };
  g.partido = { ...datosGrupoIniciales().partido, ...g.partido };
  return g;
};

const D = {
  user: undefined,     // undefined: todavía no sabemos; null: sin sesión
  perfil: undefined,   // usuarios/{uid}; null si todavía no completó la ficha
  gid: null,
  grupo: null,
  miembros: null,      // uid -> ficha dentro del grupo
  votos: {},           // target -> { voter -> stats }
  niveles: {},         // solo admins: id -> 1..10
  cargado: {},         // { votos, niveles }: ya llegó la primera lectura
  registrando: false,
  mvp: null,           // última votación del jugador del partido: { id: fecha, candidatos, nombres, abre, cierra, miVoto, votos }
};
const ui = { tab: 'entrar', foto: null };  // foto: null = sin cambios, '' = quitar, dataURL = nueva
let subsUser = [], subsGrupo = [], subsMvp = [], nivelesDe = null, mvpDe = null;

// ---------------- Utilidades ----------------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const genId = (n = 20) => {
  const abc = 'abcdefghijkmnpqrstuvwxyz23456789';
  return [...crypto.getRandomValues(new Uint8Array(n))].map(x => abc[x % abc.length]).join('');
};
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const guardado = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const pos = p => POS[p?.posicion] || POS.comodin;
const emailDe = usuario => `${usuario.trim().toLowerCase()}@${CONFIG.dominio}`;
const miUid = () => D.user?.uid;
const esAdmin = () => !!(D.grupo && D.user && D.grupo.admins.includes(D.user.uid));
// Admins y "armadores" (designados por un admin) pueden armar y editar los equipos.
const esArmador = id => !!D.grupo?.armadores.includes(id);
const puedeEditarEquipos = () => esAdmin() || esArmador(miUid());
const equipoDe = id => D.grupo?.equipos?.A.includes(id) ? 'A' : D.grupo?.equipos?.B.includes(id) ? 'B' : null;
const otroEquipo = e => (e === 'A' ? 'B' : 'A');
const NOMBRE_EQUIPO = { A: '🔴 Equipo A', B: '🔵 Equipo B' };

// Pasa a alguien al equipo "a" dentro de un estado de grupo (para usar en actualizarGrupo).
function moverDeEquipo(s, id, a) {
  if (!s.equipos) return;
  const de = otroEquipo(a);
  if (!s.equipos[de].includes(id)) return;
  s.equipos[de] = s.equipos[de].filter(x => x !== id);
  s.equipos[a].push(id);
  s.equipos.editado = true;
}
const esSuper = () => !!D.user && D.user.email === emailDe(CONFIG.superadmin);
const cortar = arr => { arr.forEach(f => f()); arr.length = 0; };
const urlBase = () => location.origin + location.pathname;
const linkInvitacion = () => `${urlBase()}#/unirse/${D.gid}/${D.grupo.codigo}`;
const datosPerfil = p => ({ usuario: p.usuario, edad: p.edad, posicion: p.posicion, foto: p.foto || '' });

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.style.opacity = 0), 2600);
}

function msgError(e) {
  const c = e?.code || '';
  return {
    'auth/email-already-in-use': 'Ese nombre de usuario ya existe',
    'auth/invalid-credential': 'Usuario o contraseña incorrectos',
    'auth/invalid-login-credentials': 'Usuario o contraseña incorrectos',
    'auth/wrong-password': 'Usuario o contraseña incorrectos',
    'auth/user-not-found': 'Usuario o contraseña incorrectos',
    'auth/weak-password': 'La contraseña tiene que tener al menos 6 caracteres',
    'auth/too-many-requests': 'Demasiados intentos, esperá un rato',
    'auth/operation-not-allowed': 'Falta habilitar el login en Firebase',
    'auth/configuration-not-found': 'Falta habilitar el login en Firebase',
    'auth/network-request-failed': 'Sin conexión',
    'permission-denied': 'No tenés permiso para hacer eso',
  }[c] || 'Algo salió mal' + (c ? ` (${c})` : '');
}

async function act(fn, okMsg) {
  try {
    await fn();
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    console.error(e);
    toast('❌ ' + (e.mensaje || msgError(e)));
    return false;
  }
}

// Transacción sobre el documento del grupo. Solo escribe los campos que
// cambiaron: los jugadores solo pueden tocar "anotados" (ver firestore.rules).
function actualizarGrupo(mut, okMsg) {
  const gid = D.gid;
  return act(() => F.runTransaction(db, async tx => {
    const snap = await tx.get(refGrupo(gid));
    const antes = normGrupo(snap.data());
    const s = structuredClone(antes);
    mut(s);
    const patch = {};
    for (const k of Object.keys(s)) if (JSON.stringify(s[k]) !== JSON.stringify(antes[k])) patch[k] = s[k];
    if (Object.keys(patch).length) tx.update(refGrupo(gid), patch);
  }), okMsg);
}

// ---------------- Suscripciones ----------------
A.onAuthStateChanged(auth, user => {
  const ultimoIngreso = Date.parse(user?.metadata.lastSignInTime || '');
  if (user && Date.now() - ultimoIngreso > CONFIG.diasSesion * 864e5) {
    toast('Tu sesión venció, entrá de nuevo');
    return A.signOut(auth);
  }
  cortar(subsUser);
  cortar(subsGrupo);
  cortar(subsMvp);
  nivelesDe = mvpDe = null;
  Object.assign(D, { user, perfil: user ? undefined : null, gid: null, grupo: null, miembros: null, votos: {}, niveles: {}, mvp: null, mvps: [], estrellas: {}, cargado: {} });
  if (user) {
    subsUser.push(F.onSnapshot(refUsuario(user.uid), s => {
      D.perfil = s.exists() ? s.data() : null;
      if (D.perfil) D.registrando = false;
      elegirGrupo();
      procesarInvitacion();
      render();
    }, e => { console.error(e); toast('❌ ' + msgError(e)); }));
  }
  render();
});

function elegirGrupo() {
  const ids = (D.perfil?.grupos || []).map(g => g.id);
  const quiero = guardado.get(LS + 'gid');
  const gid = ids.includes(quiero) ? quiero : ids.includes(D.gid) ? D.gid : ids[0] || null;
  if (gid === D.gid) return;
  cortar(subsGrupo);
  cortar(subsMvp);
  nivelesDe = mvpDe = null;
  Object.assign(D, { gid, grupo: null, miembros: null, votos: {}, niveles: {}, mvp: null, mvps: [], estrellas: {}, cargado: {} });
  if (!gid) return;
  guardado.set(LS + 'gid', gid);
  subsGrupo.push(F.onSnapshot(refGrupo(gid), s => {
    if (!s.exists()) return olvidarGrupo(gid, 'Ese grupo ya no existe');
    D.grupo = normGrupo(s.data());
    suscribirNiveles();
    render();
  }, e => {
    if (e.code === 'permission-denied') olvidarGrupo(gid, 'Ya no sos parte de ese grupo');
    else console.error(e);
  }));
  subsGrupo.push(F.onSnapshot(colMiembros(gid), qs => {
    D.miembros = Object.fromEntries(qs.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
    render();
  }, e => console.warn(e.code)));
  subsGrupo.push(F.onSnapshot(colVotos(gid), qs => {
    const v = {};
    qs.docs.forEach(d => { const x = d.data(); (v[x.target] ||= {})[x.voter] = x.stats; });
    D.votos = v;
    D.cargado.votos = true;
    render();
  }, e => console.warn(e.code)));
  subsGrupo.push(F.onSnapshot(F.query(colMvp(gid), F.orderBy('fecha', 'desc')), qs => {
    D.mvps = qs.docs.map(d => ({ id: d.id, ...d.data() }));
    const d = D.mvps[0];
    const misma = d && D.mvp?.id === d.id;
    D.mvp = d ? { ...d, miVoto: misma ? D.mvp.miVoto : undefined, votos: misma ? D.mvp.votos : null } : null;
    actualizarSubsMvp();
    cargarHistorialMvp();
    render();
  }, e => console.warn(e.code)));
}

// ⭐ Estrellas: cuántas veces fue jugador del partido cada uno (empates incluidos).
// Una votación cerrada ya no cambia, así que su resultado se guarda en el celular.
const historialMvp = {};
let cargandoHistorial = false;
async function cargarHistorialMvp() {
  const gid = D.gid, docs = D.mvps || [];
  if (cargandoHistorial || !gid) return;
  cargandoHistorial = true;
  for (const m of docs) {
    const k = `${gid}/${m.id}`;
    if (estadoMvp(m) !== 'cerrada' || historialMvp[k]) continue;
    const clave = `${LS}mvp_res_${gid}_${m.id}`;
    let ganadores = null;
    try { ganadores = JSON.parse(guardado.get(clave)); } catch {}
    if (!Array.isArray(ganadores)) {
      try {
        const qs = await F.getDocs(colVotosMvp(gid, m.id));
        ganadores = resultadoMvp({ votos: Object.fromEntries(qs.docs.map(d => [d.id, d.data().voto])) }).ganadores;
        guardado.set(clave, JSON.stringify(ganadores));
      } catch (e) {
        console.warn(e.code);
        continue;
      }
    }
    historialMvp[k] = ganadores;
  }
  cargandoHistorial = false;
  if (D.gid !== gid) return;
  const estrellas = {};
  docs.forEach(m => (historialMvp[`${gid}/${m.id}`] || []).forEach(id => (estrellas[id] = (estrellas[id] || 0) + 1)));
  D.estrellas = estrellas;
  render();
}
const estrellasDe = id => D.estrellas?.[id] || 0;

// ---------------- Jugador del partido ----------------
const estadoMvp = (m = D.mvp, ahora = Date.now()) => !m ? null : ahora < m.abre ? 'pendiente' : ahora < m.cierra ? 'abierta' : 'cerrada';

// Mi voto se lee siempre; los votos de todos, recién cuando cierra (así lo exigen las reglas).
function actualizarSubsMvp() {
  const m = D.mvp;
  const clave = m ? `${D.gid}/${m.id}/${estadoMvp() === 'cerrada'}` : null;
  if (clave === mvpDe) return;
  cortar(subsMvp);
  mvpDe = clave;
  if (!m) return;
  const gid = D.gid;
  subsMvp.push(F.onSnapshot(F.doc(colVotosMvp(gid, m.id), miUid()), s => {
    if (D.mvp?.id !== m.id) return;
    D.mvp.miVoto = s.exists() ? s.data().voto : null;
    render();
  }, e => console.warn(e.code)));
  if (estadoMvp() === 'cerrada') {
    subsMvp.push(F.onSnapshot(colVotosMvp(gid, m.id), qs => {
      if (D.mvp?.id !== m.id) return;
      D.mvp.votos = Object.fromEntries(qs.docs.map(d => [d.id, d.data().voto]));
      render();
    }, e => console.warn(e.code)));
  }
}

// Candidatos: los titulares del partido (con nombre guardado por si después se van del grupo).
function datosVotacion(s, fecha) {
  const candidatos = s.anotados.filter(id => jugador(id)).slice(0, Number(s.partido.cupo) || 10);
  const abre = abreVotacion(fecha);
  return {
    fecha,
    candidatos,
    nombres: Object.fromEntries(candidatos.map(id => [id, jugador(id).usuario])),
    abre,
    cierra: abre + DIA,
    creado: Date.now(),
  };
}

function crearVotacion(fecha) {
  const datos = datosVotacion(D.grupo, fecha);
  if (!datos.candidatos.length) return Promise.resolve(false);
  const ref = refMvp(D.gid, fecha);
  return act(() => F.runTransaction(db, async tx => {
    if (!(await tx.get(ref)).exists()) tx.set(ref, datos);
  }));
}

// El día siguiente al partido, el primero que abre la app crea la votación.
let mvpIntentado = null;
function asegurarVotacion() {
  const f = D.grupo?.partido.fecha;
  if (!f || !D.miembros || D.mvp?.id === f || mvpIntentado === `${D.gid}/${f}`) return;
  const abre = abreVotacion(f);
  if (Date.now() < abre || Date.now() >= abre + DIA) return;
  mvpIntentado = `${D.gid}/${f}`;
  crearVotacion(f);
}

function resultadoMvp(m) {
  const conteo = {};
  Object.values(m.votos || {}).forEach(id => (conteo[id] = (conteo[id] || 0) + 1));
  const total = Object.values(conteo).reduce((a, b) => a + b, 0);
  const max = Math.max(0, ...Object.values(conteo));
  const ganadores = total >= MIN_VOTOS_MVP ? Object.keys(conteo).filter(id => conteo[id] === max) : [];
  return { conteo, total, max, ganadores };
}

const nombreCandidato = (m, id) => jugador(id)?.usuario || m.nombres?.[id] || '?';
const fichaCandidato = (m, id) => jugador(id) || { id, usuario: m.nombres?.[id] || '?', posicion: 'comodin' };

function suscribirNiveles() {
  if (!puedeEditarEquipos() || nivelesDe === D.gid) return;
  nivelesDe = D.gid;
  subsGrupo.push(F.onSnapshot(refNiveles(D.gid), s => { D.niveles = s.data() || {}; D.cargado.niveles = true; render(); }, e => console.warn(e.code)));
}

// Saca un grupo de mi lista (me expulsaron o lo borraron).
function olvidarGrupo(gid, msg) {
  toast(msg);
  if (guardado.get(LS + 'gid') === gid) guardado.set(LS + 'gid', null);
  const grupos = (D.perfil?.grupos || []).filter(g => g.id !== gid);
  act(() => F.updateDoc(refUsuario(miUid()), { grupos }));
}

// ---------------- Invitaciones ----------------
function leerInvitacion() {
  const m = location.hash.match(/^#\/unirse\/([^/]+)\/([^/]+)/);
  if (!m) return;
  guardado.set(LS + 'inv', `${m[1]}/${m[2]}`);
  history.replaceState(null, '', location.pathname + location.search);
}

let uniendo = false;
async function procesarInvitacion() {
  const inv = guardado.get(LS + 'inv');
  if (!inv || !D.user || !D.perfil || uniendo) return;
  guardado.set(LS + 'inv', null);
  const [gid, codigo] = inv.split('/');
  if (D.perfil.grupos?.some(g => g.id === gid)) {
    guardado.set(LS + 'gid', gid);
    elegirGrupo();
    return render();
  }
  uniendo = true;
  await unirse(gid, codigo);
  uniendo = false;
}

function unirse(gid, codigo) {
  return act(async () => {
    try {
      await F.setDoc(F.doc(colMiembros(gid), miUid()), { ...datosPerfil(D.perfil), codigo, unido: Date.now() });
    } catch (e) {
      if (e.code === 'permission-denied') e.mensaje = 'El link de invitación no es válido o ya lo cambiaron. Pedile uno nuevo al admin.';
      throw e;
    }
    const g = await F.getDoc(refGrupo(gid));
    guardado.set(LS + 'gid', gid);
    await F.updateDoc(refUsuario(miUid()), { grupos: [...(D.perfil.grupos || []), { id: gid, nombre: g.data().nombre }] });
  }, '🎉 ¡Te uniste al grupo!');
}

function crearGrupo(nombre) {
  const gid = genId(20), codigo = genId(12), uid = miUid();
  return act(async () => {
    await F.setDoc(refGrupo(gid), { nombre, creador: uid, admins: [uid], codigo, baneados: [], ...datosGrupoIniciales() });
    await F.setDoc(F.doc(colMiembros(gid), uid), { ...datosPerfil(D.perfil), codigo, unido: Date.now() });
    guardado.set(LS + 'gid', gid);
    await F.updateDoc(refUsuario(uid), { grupos: [...(D.perfil.grupos || []), { id: gid, nombre }] });
    location.hash = '';
  }, '⚽ Grupo creado. Compartí el link de invitación desde el panel de admin.');
}

// ---------------- Jugadores, votos y puntajes ----------------
function jugador(id) {
  if (id.startsWith('inv_')) {
    const i = D.grupo?.invitados[id];
    return i && { id, usuario: i.nombre, posicion: i.posicion, invitado: true };
  }
  return D.miembros?.[id];
}

function resumen(id) {
  const p = jugador(id);
  // Solo cuentan los votos de gente que sigue en el grupo.
  const vs = Object.entries(D.votos[id] || {}).filter(([voter]) => D.miembros?.[voter]).map(([, s]) => s);
  if (!vs.length) return { n: 0 };
  const prom = {};
  STATS.forEach(s => (prom[s.k] = vs.reduce((t, v) => t + (v[s.k] || 0), 0) / vs.length));
  const campo = CAMPO.reduce((t, k) => t + prom[k], 0) / CAMPO.length;
  const general = p?.posicion === 'arquero' ? (campo + prom.arquero) / 2 : campo;
  return { n: vs.length, prom, general };
}

// Para equilibrar: promedio de votos si tiene; si no, el nivel que puso el admin.
function puntaje(id) {
  const r = resumen(id);
  return r.n ? r.general : Number(D.niveles[id]) || NIVEL_DEFAULT;
}

function derivar() {
  const lista = D.grupo.anotados.map(jugador).filter(Boolean);
  const cupo = Number(D.grupo.partido.cupo) || 10;
  return { cupo, titulares: lista.slice(0, cupo), suplentes: lista.slice(cupo) };
}
const baseKey = titulares => titulares.map(p => p.id).sort().join(',');
const equiposDesactualizados = d => D.grupo.equipos && D.grupo.equipos.base !== baseKey(d.titulares);

// Cuando se llena el cupo, el primer admin o armador que tiene la app abierta arma
// los equipos equilibrados. Una sola vez por lista: si después los borran, no insiste.
let autoArmado = null;
function asegurarEquipos() {
  if (!puedeEditarEquipos() || !D.miembros || !D.cargado.votos || !D.cargado.niveles) return;
  const d = derivar();
  if (d.titulares.length < d.cupo) return;
  const clave = `${D.gid}/${baseKey(d.titulares)}`;
  if (autoArmado === clave) return;
  autoArmado = clave;
  if (D.grupo.equipos && !equiposDesactualizados(d)) return;
  actualizarGrupo(s => {
    const titulares = s.anotados.map(jugador).filter(Boolean).slice(0, Number(s.partido.cupo) || 10);
    const base = baseKey(titulares);
    if (titulares.length < (Number(s.partido.cupo) || 10) || s.equipos?.base === base) return;
    s.equipos = { ...armarEquipos(titulares, 'equilibrado'), modo: 'equilibrado', base };
    s.solicitudes = {};
  }, '⚖️ Se llenó el cupo: equipos equilibrados armados');
}

function armarEquipos(jugadores, modo) {
  const mezclados = shuffle([...jugadores]);
  const A = [], B = [];
  if (modo === 'aleatorio') {
    mezclados.forEach((p, i) => (i % 2 ? B : A).push(p.id));
    return { A, B };
  }
  // Mayor a menor; el sort es estable, así que los empates quedan al azar.
  const orden = mezclados.sort((a, b) => puntaje(b.id) - puntaje(a.id));
  let resto = orden, offset = 0;
  // Si hay 2+ arqueros, uno para cada lado; la serpentina sigue compensando.
  const arqueros = orden.filter(p => p.posicion === 'arquero');
  if (arqueros.length >= 2) {
    A.push(arqueros[0].id);
    B.push(arqueros[1].id);
    resto = orden.filter(p => p !== arqueros[0] && p !== arqueros[1]);
    offset = 2;
  }
  // Serpentina: A, B, B, A, A, B, B, A…
  resto.forEach((p, i) => (['A', 'B', 'B', 'A'][(i + offset) % 4] === 'A' ? A : B).push(p.id));
  return { A, B };
}

// ---------------- WhatsApp ----------------
function mensajeWsp() {
  const d = derivar();
  const p = D.grupo.partido;
  const L = [`⚽ *${p.titulo || 'Fulbo'}*`];
  if (p.fecha || p.cuando) L.push(`📅 ${[fechaLinda(p.fecha), p.cuando].filter(Boolean).join(' · ')}`);
  if (p.lugar) L.push(`📍 ${p.lugar}`);
  L.push('', `✅ *TITULARES (${d.titulares.length}/${d.cupo})*`);
  for (let i = 0; i < d.cupo; i++) {
    const j = d.titulares[i];
    L.push(j ? `${i + 1}. ${j.usuario} ${pos(j).emoji}` : `${i + 1}. _libre_`);
  }
  if (d.suplentes.length) {
    L.push('', '🔁 *SUPLENTES*');
    d.suplentes.forEach((j, i) => L.push(`S${i + 1}. ${j.usuario} ${pos(j).emoji}`));
  }
  if (D.grupo.equipos && !equiposDesactualizados(d)) L.push('', ...lineasEquipos());
  L.push('', `👉 Anotate acá: ${urlBase()}`);
  return L.join('\n');
}

function lineasEquipos() {
  const L = ['🆚 *EQUIPOS*'];
  [['🔴', 'Equipo A', D.grupo.equipos.A], ['🔵', 'Equipo B', D.grupo.equipos.B]].forEach(([e, nom, ids]) => {
    const js = ids.map(jugador).filter(Boolean);
    L.push('', `${e} *${nom}* (${js.length})`);
    js.forEach(j => L.push(`• ${j.usuario} ${pos(j).emoji}`));
  });
  return L;
}

// Solo los equipos, para mandar cuando ya se armaron.
function mensajeEquipos() {
  const p = D.grupo.partido;
  const L = [`⚽ *${p.titulo || 'Fulbo'}*`];
  if (p.fecha || p.cuando) L.push(`📅 ${[fechaLinda(p.fecha), p.cuando].filter(Boolean).join(' · ')}`);
  if (p.lugar) L.push(`📍 ${p.lugar}`);
  L.push('', ...lineasEquipos());
  return L.join('\n');
}

async function copiar(texto, msg = '📋 ¡Copiado! Pegalo en el grupo') {
  try {
    await navigator.clipboard.writeText(texto);
  } catch {
    const ta = Object.assign(document.createElement('textarea'), { value: texto });
    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast(msg);
}

// ---------------- Fotos ----------------
// Recorta al centro y achica a 256×256: ~20 KB, entra cómodo en Firestore.
async function procesarFoto(file) {
  const img = await createImageBitmap(file);
  const L = 256, lado = Math.min(img.width, img.height);
  const c = Object.assign(document.createElement('canvas'), { width: L, height: L });
  c.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, L, L);
  return c.toDataURL('image/jpeg', 0.82);
}

function avatar(p, size = 40) {
  const s = `width:${size}px;height:${size}px`;
  if (p?.foto) return `<img src="${esc(p.foto)}" alt="" style="${s}" class="rounded-full object-cover shrink-0 bg-slate-800">`;
  const n = p?.usuario || '?';

  return `<span style="${s};background:hsl(${hue} 40% 32%);font-size:${Math.round(size * 0.42)}px" class="rounded-full grid place-items-center font-bold shrink-0 text-white">${esc(n[0].toUpperCase())}</span>`;
}

function radar(prom) {
  const size = 300, c = size / 2, R = 96, n = STATS.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
  const poly = r => STATS.map((_, i) => pt(i, r).map(x => x.toFixed(1)).join(',')).join(' ');
  const anillos = [2, 4, 6, 8, 10].map(v => `<polygon points="${poly((R * v) / 10)}" fill="none" stroke="#334155"/>`).join('');
  const ejes = STATS.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#334155"/>`; }).join('');
  const datos = prom
    ? `<polygon points="${STATS.map((s, i) => pt(i, (R * prom[s.k]) / 10).map(x => x.toFixed(1)).join(',')).join(' ')}" fill="rgba(16,185,129,.35)" stroke="#10b981" stroke-width="2" stroke-linejoin="round"/>`
    : '';
  const etiquetas = STATS.map((s, i) => {
    const [x, y] = pt(i, R + 26);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#94a3b8">${s.corto}${prom ? `<tspan fill="#e2e8f0"> ${prom[s.k].toFixed(1)}</tspan>` : ''}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" class="w-full max-w-[320px] mx-auto">${anillos}${ejes}${datos}${etiquetas}</svg>`;
}

            ${p.fecha || p.cuando ? `<span>📅 ${esc([fechaLinda(p.fecha), p.cuando].filter(Boolean).join(' · '))}</span>` : ''}
            ${p.lugar ? `<span>📍 ${esc(p.lugar)}</span>` : ''}
          </div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-3xl font-black ${faltan <= 0 ? 'text-emerald-400' : ''}">${d.titulares.length}<span class="text-slate-500 text-xl">/${d.cupo}</span></div>
          <div class="text-xs text-slate-400">${faltan > 0 ? `faltan ${faltan}` : '¡completo!'}</div>
        </div>
      </div>
      <div class="mt-3 h-2 rounded-full bg-slate-800 overflow-hidden">
        <div class="h-full bg-emerald-500 transition-all" style="width:${Math.min(100, (d.titulares.length / d.cupo) * 100)}%"></div>
      </div>
    </div>`;
}

function miEstado(d) {
  const uid = miUid();
  const iT = d.titulares.findIndex(p => p.id === uid);
  const iS = d.suplentes.findIndex(p => p.id === uid);
  const anotado = iT >= 0 || iS >= 0;
  const estado = iT >= 0 ? `<span class="text-emerald-400">✅ Estás anotado · titular #${iT + 1}</span>`
    : iS >= 0 ? `<span class="text-amber-400">⏳ Estás de suplente S${iS + 1}</span>`
    : `<span class="text-slate-400">No estás anotado para este partido</span>`;
  const lleno = d.titulares.length >= d.cupo;
  return card(`
    <p class="text-sm">${estado}</p>
    ${anotado
      ? `<button data-action="bajar" data-id="${uid}" class="${BTN} w-full mt-3 bg-slate-800 hover:bg-red-950 text-red-300 border border-red-900/50">Me bajo 😢</button>`
      : `<button data-action="anotarme" class="${BTN_OK} w-full mt-3 text-lg">⚽ ¡Me anoto!${lleno ? ' <span class="text-sm font-medium">(entrás de suplente)</span>' : ''}</button>`}
  `);
}

function filaJugador(p, etiqueta, clase) {
  // Cada uno se baja con "Me bajo"; sacar a otros de la lista es cosa del admin.
  const puedeBorrar = esAdmin();
  const nombre = `<span class="block font-medium truncate">${esc(p.usuario)}${estrellasDe(p.id) ? ` <span class="text-xs text-amber-300" title="Jugador del partido ${estrellasDe(p.id)} ${estrellasDe(p.id) === 1 ? 'vez' : 'veces'}">⭐${estrellasDe(p.id) > 1 ? estrellasDe(p.id) : ''}</span>` : ''}${p.id === miUid() ? ' <span class="text-xs text-emerald-400">(vos)</span>' : ''}${p.invitado ? ' <span class="text-xs text-slate-500">(invitado)</span>' : ''}</span>`;
  return `
    <li class="flex items-center gap-3 py-2">
      <span class="w-9 shrink-0 text-center text-xs font-bold rounded-lg py-1 ${clase}">${etiqueta}</span>
      ${avatar(p, 32)}
      ${p.invitado ? `<span class="flex-1 min-w-0">${nombre}` : `<a href="#/jugador/${p.id}" class="flex-1 min-w-0 hover:text-emerald-300">${nombre}`}
        <span class="text-xs text-slate-400">${pos(p).emoji} ${pos(p).label}</span>
      ${p.invitado ? '</span>' : '</a>'}
      ${esAdmin() ? `<span class="text-xs font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300" title="Puntaje para equilibrar">${puntaje(p.id).toFixed(1)}</span>` : ''}
      ${puedeBorrar ? `<button data-action="bajar" data-id="${p.id}" title="Sacar de la lista" aria-label="Sacar a ${esc(p.usuario)} de la lista" class="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:text-red-300 hover:bg-red-500/10 transition shrink-0">${ICONO_SACAR}</button>` : ''}
    </li>`;
}

function lista(d) {
  const libres = Array.from({ length: Math.max(0, d.cupo - d.titulares.length) }, (_, i) => `
    <li class="flex items-center gap-3 py-2 opacity-40">
      <span class="w-9 shrink-0 text-center text-xs font-bold rounded-lg py-1 border border-dashed border-slate-600">${d.titulares.length + i + 1}</span>
      <span class="text-sm italic text-slate-500">libre</span>
    </li>`).join('');
  return card(`
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-lg font-bold">✅ Titulares</h2>
      <button data-action="copiar" class="${BTN} bg-green-600 hover:bg-green-500 text-white text-sm py-2">📋 Copiar para WhatsApp</button>
    </div>
    <ul class="divide-y divide-slate-800">
      ${d.titulares.map((p, i) => filaJugador(p, i + 1, 'bg-emerald-500/15 text-emerald-300')).join('')}
      ${libres}
    </ul>
    ${d.suplentes.length ? `
      <h3 class="text-base font-bold mt-5 mb-1">🔁 Suplentes</h3>
      <ul class="divide-y divide-slate-800">
        ${d.suplentes.map((p, i) => filaJugador(p, 'S' + (i + 1), 'bg-amber-500/15 text-amber-300')).join('')}
      </ul>` : ''}
  `);
}

function equipos(d) {
  const eq = D.grupo.equipos;
  const editor = puedeEditarEquipos();
  const vigentes = eq && !equiposDesactualizados(d);
  const botones = editor ? `
    <div class="grid grid-cols-2 gap-2 mt-4">
      <button data-action="armar" data-modo="equilibrado" ${d.titulares.length < 2 ? 'disabled' : ''} class="${BTN_OK} text-sm">⚖️ Armar equilibrados</button>
      <button data-action="armar" data-modo="aleatorio" ${d.titulares.length < 2 ? 'disabled' : ''} class="${BTN_SEC} text-sm">🎲 Aleatorio</button>
    </div>
    ${eq ? `<button data-action="borrar-equipos" class="mt-2 text-xs text-slate-500 hover:text-red-300 underline">Borrar equipos</button>` : ''}` : '';
  if (!eq) {
    return card(`
      <h2 class="text-lg font-bold">🆚 Equipos</h2>
      <p class="text-sm text-slate-400 mt-1">Todavía no se armaron los equipos.</p>
      ${botones}`);
  }
  const solicitudes = Object.entries(D.grupo.solicitudes).filter(([id, s]) => jugador(id) && equipoDe(id) && equipoDe(id) !== s.a);
  const columna = (e, color) => {
    const js = eq[e].map(jugador).filter(Boolean);
    const suma = js.reduce((t, p) => t + puntaje(p.id), 0);
    return `
      <div class="rounded-xl border ${color} p-3">
        <div class="flex items-baseline justify-between gap-2">
          <h3 class="font-bold">${NOMBRE_EQUIPO[e]} <span class="text-xs font-normal text-slate-400">(${js.length})</span></h3>
          ${editor ? `<span class="text-xs text-slate-400">Σ ${suma.toFixed(1)} · prom ${(suma / (js.length || 1)).toFixed(1)}</span>` : ''}
        </div>
        <ul class="mt-2 space-y-1.5 text-sm">
          ${js.map(p => `
            <li class="flex items-center gap-2">
              ${avatar(p, 22)}
              <span class="truncate flex-1">${esc(p.usuario)}${D.grupo.solicitudes[p.id] && solicitudes.some(([id]) => id === p.id) ? ' <span title="Pidió cambiarse">🔄</span>' : ''}</span>
              <span>${pos(p).emoji}</span>
              ${editor && vigentes ? `<button data-action="mover-equipo" data-id="${p.id}" title="Pasar al ${NOMBRE_EQUIPO[otroEquipo(e)]}" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs shrink-0">${e === 'A' ? '→' : '←'}</button>` : ''}
            </li>`).join('')}
        </ul>
      </div>`;
  };

  // Pedido propio para cambiarse (solo si no puede moverse solo).
  const yo = miUid(), miEquipo = equipoDe(yo), miSolicitud = D.grupo.solicitudes[yo];
  const pedido = vigentes && miEquipo && !editor ? (miSolicitud && miSolicitud.a !== miEquipo
    ? `<div class="mt-3 flex items-center justify-between gap-2 text-sm bg-sky-500/10 border border-sky-500/20 rounded-xl px-3 py-2">
         <span>🔄 Pediste pasar al ${NOMBRE_EQUIPO[miSolicitud.a]}. Esperando respuesta.</span>
         <button data-action="cancelar-solicitud" class="text-xs text-slate-400 underline shrink-0">Cancelar</button>
       </div>`
    : `<button data-action="pedir-cambio" class="${BTN_SEC} w-full mt-3 text-sm">🔄 Pedir pasar al ${NOMBRE_EQUIPO[otroEquipo(miEquipo)]}</button>`) : '';

  const pendientes = editor && vigentes && solicitudes.length ? `
    <div class="mt-3 rounded-xl border border-sky-500/30 bg-sky-500/5 p-3">
      <h3 class="text-sm font-bold mb-2">🔄 Pedidos de cambio (${solicitudes.length})</h3>
      <ul class="space-y-2">
        ${solicitudes.map(([id, s]) => `
          <li class="flex items-center gap-2 text-sm">
            ${avatar(jugador(id), 24)}
            <span class="flex-1 min-w-0 truncate"><b>${esc(jugador(id).usuario)}</b> quiere pasar al ${NOMBRE_EQUIPO[s.a]}</span>
            <button data-action="aprobar-cambio" data-id="${id}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-emerald-500 text-slate-950">Aprobar</button>
            <button data-action="rechazar-cambio" data-id="${id}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800 text-slate-300">Rechazar</button>
          </li>`).join('')}
      </ul>
    </div>` : '';

  const modo = eq.editado ? '✏️ editado a mano' : eq.modo === 'aleatorio' ? '🎲 aleatorio' : '⚖️ equilibrado';
  return card(`
    <div class="flex items-center justify-between">
      <h2 class="text-lg font-bold">🆚 Equipos</h2>
      <span class="text-xs text-slate-500">${modo}</span>
    </div>
    ${vigentes ? '' : `<p class="mt-2 text-xs text-amber-300 bg-amber-500/10 rounded-lg px-3 py-2">⚠️ La lista de titulares cambió desde que se armaron. ${editor ? 'Volvé a armarlos.' : 'Los van a rearmar.'}</p>`}
    ${pendientes}
    <div class="grid sm:grid-cols-2 gap-3 mt-3">
      ${columna('A', 'border-red-500/30 bg-red-500/5')}
      ${columna('B', 'border-sky-500/30 bg-sky-500/5')}
    </div>
    ${editor && vigentes ? '<p class="text-xs text-slate-500 mt-2">Tocá → o ← para pasar a alguien al otro equipo.</p>' : ''}
    ${vigentes ? `<button data-action="copiar-equipos" class="${BTN} w-full mt-3 text-sm bg-green-600 hover:bg-green-500 text-white">📋 Copiar equipos para WhatsApp</button>` : ''}
    ${pedido}
    ${botones}`);
}

function tarjetaMvp() {
  const m = D.mvp, estado = estadoMvp();
  if (!m) return '';
  const quien = id => `${avatar(fichaCandidato(m, id), 28)}<b class="truncate">${esc(nombreCandidato(m, id))}</b>`;
  const editar = esAdmin() && estado !== 'cerrada'
    ? `<button data-action="mvp-editar" class="text-xs text-slate-400 underline">Editar candidatos</button>` : '';

  if (estado === 'pendiente') {
    if (!esAdmin()) return '';
    return card(`
      <div class="flex items-center justify-between gap-2">
        <p class="text-sm">🏆 La votación del jugador del partido abre el ${esc(fechaLinda(new Date(m.abre + DIA / 2).toISOString().slice(0, 10)))} a las 00:00.</p>
        ${editar}
      </div>`);
  }

  if (estado === 'abierta') {
    const voto = m.miVoto;
    return `
      <div class="${CARD} border-amber-500/40 bg-gradient-to-br from-amber-500/10 to-slate-900">
        <div class="flex items-start justify-between gap-2">
          <div>
            <h2 class="text-lg font-black">🏆 Jugador del partido</h2>
            <p class="text-xs text-slate-400">Del ${esc(fechaLinda(m.id))} · se vota hasta hoy a las 23:59</p>
          </div>
          ${editar}
        </div>
        ${voto
          ? `<div class="mt-3 flex items-center gap-2 text-sm">✅ Votaste a ${quien(voto)}
               <button data-action="mvp-votar" class="ml-auto text-xs text-slate-400 underline shrink-0">Cambiar</button></div>`
          : `<p class="mt-3 text-sm text-amber-200">⚠️ Todavía no votaste.</p>
             <button data-action="mvp-votar" class="${BTN} w-full mt-2 bg-amber-400 hover:bg-amber-300 text-slate-950">🏆 Votar al mejor del partido</button>`}
      </div>`;
  }

  // Cerrada: el resultado se muestra 3 días.
  if (Date.now() > m.cierra + 3 * DIA || !m.votos) return '';
  const r = resultadoMvp(m);
  const cuerpo = !r.ganadores.length
    ? `<p class="mt-2 text-sm text-slate-400">Hubo ${r.total} ${r.total === 1 ? 'voto' : 'votos'}: hacen falta al menos ${MIN_VOTOS_MVP}, así que esta vez quedó desierto.</p>`
    : `<div class="mt-3 flex flex-wrap justify-center gap-4">
         ${r.ganadores.map(id => `
           <div class="flex flex-col items-center gap-1">
             ${avatar(fichaCandidato(m, id), 72)}
             <b>${esc(nombreCandidato(m, id))}</b>
           </div>`).join('')}
       </div>
       <p class="text-center text-xs text-slate-400 mt-2">${r.ganadores.length > 1 ? 'Empate con' : 'Con'} ${r.max} de ${r.total} votos</p>
       <button data-action="mvp-copiar" class="${BTN} w-full mt-3 text-sm bg-green-600 hover:bg-green-500 text-white">📋 Copiar resultado para WhatsApp</button>`;
  return `
    <div class="${CARD} border-amber-500/40 bg-gradient-to-br from-amber-500/10 to-slate-900">
      <h2 class="text-lg font-black">🏆 Jugador del partido</h2>
      <p class="text-xs text-slate-400">Del ${esc(fechaLinda(m.id))}</p>
      ${cuerpo}
    </div>`;
}

function modal(html) {
  return `
    <div class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4" data-action="cerrar-modal" data-fondo>
      <div class="w-full sm:max-w-md max-h-[90vh] overflow-y-auto bg-slate-900 border border-slate-700 rounded-t-3xl sm:rounded-3xl p-5" data-modal-cuerpo>
        ${html}
      </div>
    </div>`;
}

function modalVotarMvp() {
  const m = D.mvp;
  return modal(`
    <div class="text-center">
      <div class="text-4xl">🏆</div>
      <h2 class="text-xl font-black mt-1">¿Quién fue el mejor del partido?</h2>
      <p class="text-sm text-slate-400">${esc(fechaLinda(m.id))} · votás hasta hoy a las 23:59</p>
    </div>
    <form data-form="mvp-votar" class="mt-4">
      <div class="grid grid-cols-3 gap-2">
        ${m.candidatos.map(id => {
          const yo = id === miUid();
          return `
            <label class="${yo ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'} min-w-0">
              <input type="radio" id="mvp-${id}" name="voto" value="${id}" ${m.miVoto === id ? 'checked' : ''} ${yo ? 'disabled' : ''} class="peer sr-only">
              <span class="flex flex-col items-center gap-1 rounded-2xl border border-slate-700 bg-slate-800 p-2 text-center transition peer-checked:border-amber-400 peer-checked:bg-amber-400/15">
                ${avatar(fichaCandidato(m, id), 48)}
                <span class="text-xs font-semibold truncate max-w-full">${esc(nombreCandidato(m, id))}</span>
                ${yo ? '<span class="text-[10px] text-slate-400">(vos)</span>' : ''}
              </span>
            </label>`;
        }).join('')}
      </div>
      <button class="${BTN} w-full mt-4 bg-amber-400 hover:bg-amber-300 text-slate-950">Votar</button>
    </form>
    <button data-action="cerrar-modal" class="w-full mt-2 py-2 text-sm text-slate-400">Después</button>`);
}

function modalEditarMvp() {
  const m = D.mvp;
  const ids = [...new Set([...m.candidatos, ...Object.keys(D.miembros), ...Object.keys(D.grupo.invitados)])];
  return modal(`
    <h2 class="text-lg font-black">Candidatos al jugador del partido</h2>
    <p class="text-sm text-slate-400 mb-3">Marcá a los que jugaron el ${esc(fechaLinda(m.id))}.</p>
    <form data-form="mvp-candidatos" class="space-y-3">
      <ul class="divide-y divide-slate-800 max-h-[45vh] overflow-y-auto">
        ${ids.map(id => `
          <li>
            <label class="flex items-center gap-3 py-2 cursor-pointer">
              <input type="checkbox" id="cand-${id}" name="cand" value="${id}" ${m.candidatos.includes(id) ? 'checked' : ''} class="w-5 h-5 accent-amber-400">
              ${avatar(fichaCandidato(m, id), 28)}
              <span class="flex-1 truncate">${esc(nombreCandidato(m, id))}${id.startsWith('inv_') ? ' <span class="text-xs text-slate-500">(invitado)</span>' : ''}</span>
            </label>
          </li>`).join('')}
      </ul>
      <input id="cand-nuevo" name="nuevo" maxlength="20" placeholder="Agregar a alguien sin cuenta (nombre)" class="${INPUT}">
      <button class="${BTN_OK} w-full">Guardar candidatos</button>
    </form>
    <button data-action="cerrar-modal" class="w-full mt-2 py-2 text-sm text-slate-400">Cancelar</button>`);
}

function renderModal() {
  const m = D.mvp;
  // Se abre solo una vez por votación si todavía no votaste.
  const clave = m && `${LS}mvp_visto_${D.gid}_${m.id}`;
  const enPrincipal = !/^#\/(jugador|grupos|usuarios)/.test(location.hash);
  let visto = false;
  try { visto = !!sessionStorage.getItem(clave); } catch {}
  if (!ui.modal && m && estadoMvp() === 'abierta' && m.miVoto === null && enPrincipal && !visto) {
    ui.modal = 'mvp-votar';
  }
  if (ui.modal && (!m || estadoMvp() === 'cerrada')) ui.modal = null;
  if (ui.modal === 'mvp-votar' && clave) try { sessionStorage.setItem(clave, '1'); } catch {}
  return ui.modal === 'mvp-votar' ? modalVotarMvp() : ui.modal === 'mvp-editar' ? modalEditarMvp() : '';
}

const avisoCalificaciones = `
  <p class="text-xs text-sky-200 bg-sky-500/10 border border-sky-500/20 rounded-xl px-3 py-2 mb-3">
    ℹ️ Las calificaciones sirven <b>solo para armar equipos equilibrados</b>. No son un ranking ni se usan para nada más.
  </p>`;

function jugadoresGrid() {
  const uid = miUid();
  const ps = Object.values(D.miembros).sort((a, b) => a.usuario.localeCompare(b.usuario));
  const pendientes = ps.filter(p => p.id !== uid && !D.votos[p.id]?.[uid]).length;
  return card(`
    <div class="flex items-baseline justify-between mb-3">
      <h2 class="text-lg font-bold">👥 Jugadores <span class="text-slate-500 font-normal text-sm">(${ps.length})</span></h2>
      ${pendientes ? `<span class="text-xs text-amber-300">Te faltan calificar ${pendientes}</span>` : ''}
    </div>
    ${avisoCalificaciones}
    <div class="grid grid-cols-3 sm:grid-cols-4 gap-2">
      ${ps.map(p => {
        const r = resumen(p.id);
        const falta = p.id !== uid && !D.votos[p.id]?.[uid];
        return `
          <a href="#/jugador/${p.id}" class="relative flex flex-col items-center text-center gap-1 p-3 rounded-xl bg-slate-800/50 hover:bg-slate-800 transition">
            ${falta ? '<span class="absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-amber-400" title="Calificalo"></span>' : ''}
            ${avatar(p, 56)}
            <span class="text-sm font-semibold truncate w-full">${esc(p.usuario)}</span>
            ${estrellasDe(p.id) ? `<span class="absolute top-1.5 left-1.5 text-[11px] font-bold text-amber-300" title="Jugador del partido">⭐${estrellasDe(p.id) > 1 ? estrellasDe(p.id) : ''}</span>` : ''}
            <span class="text-xs text-slate-400">${pos(p).emoji} ${p.edad ? p.edad + ' años' : ''}</span>
            <span class="text-lg font-black leading-none ${r.n ? colorNota(r.general) : 'text-slate-600'}">${r.n ? r.general.toFixed(1) : '–'}</span>
          </a>`;
      }).join('')}
    </div>`);
}

function vistaFicha(id) {
  const p = D.miembros[id];
  const r = resumen(id);
  const esYo = id === miUid();
  const miVoto = D.votos[id]?.[miUid()];
  const admin = D.grupo.admins.includes(id);
  return `
    <a href="#/" class="text-sm text-slate-400 hover:text-slate-200">← Volver</a>
    <div class="${CARD} bg-gradient-to-br from-slate-900 to-slate-950">
      <div class="flex items-center gap-4">
        ${avatar(p, 96)}
        <div class="min-w-0 flex-1">
          <h1 class="text-2xl font-black truncate">${esc(p.usuario)}${admin ? ' <span class="text-xs align-middle font-semibold text-sky-300 bg-sky-500/15 rounded px-1.5 py-0.5">admin</span>' : esArmador(id) ? ' <span class="text-xs align-middle font-semibold text-amber-300 bg-amber-500/15 rounded px-1.5 py-0.5">🛠️ armador</span>' : ''}</h1>
          <p class="text-slate-400 text-sm">${pos(p).emoji} ${pos(p).label}${p.edad ? ` · ${p.edad} años` : ''}</p>
          ${estrellasDe(id) ? `
            <p class="mt-1.5 inline-flex items-center gap-1 rounded-full bg-amber-400/15 border border-amber-400/30 px-2.5 py-0.5 text-xs font-bold text-amber-200">
              ${'⭐'.repeat(Math.min(estrellasDe(id), 5))}${estrellasDe(id) > 5 ? ` ×${estrellasDe(id)}` : ''} Jugador del partido${estrellasDe(id) > 1 ? ` · ${estrellasDe(id)} veces` : ''}
            </p>` : ''}
          <p class="text-xs text-slate-500 mt-1">${r.n ? `Según ${r.n} ${r.n === 1 ? 'voto' : 'votos'}` : 'Todavía nadie lo calificó'}</p>
        </div>
        <div class="text-center shrink-0">
          <div class="text-5xl font-black leading-none ${r.n ? colorNota(r.general) : 'text-slate-600'}">${r.n ? r.general.toFixed(1) : '–'}</div>
          <div class="text-[10px] tracking-widest text-slate-500 mt-1">GENERAL</div>

async function api(accion, datos = {}) {
  if (!CONFIG.api) throw Object.assign(new Error('sin api'), { mensaje: 'Falta configurar el servidor de Vercel (ver README)' });
  const headers = { 'Content-Type': 'application/json' };
  if (D.user) headers.Authorization = 'Bearer ' + await D.user.getIdToken();
  const r = await fetch(CONFIG.api, {
    method: 'POST',
    headers,
    body: JSON.stringify({ accion, ...datos }),
  }).catch(e => {
    throw Object.assign(e, { mensaje: 'No se pudo conectar con el servidor. Probá de nuevo en un rato o desde otra red (por ejemplo, datos del celular).' });
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error), { mensaje: j.error || `Error del servidor (${r.status})` });
  return j;
}

async function cargarUsuarios() {
  if (SA.cargando) return;
  SA.cargando = true;
  SA.error = null;
  try {
    SA.usuarios = (await api('listar')).usuarios.sort((a, b) => a.usuario.localeCompare(b.usuario));
  } catch (e) {
    console.error(e);
    // "Failed to fetch": no llegó al servidor (red que lo bloquea) o el servidor se cayó.
    SA.error = e.mensaje || 'No se pudo conectar con el servidor. Si estás en la red del trabajo, probá desde el celular con datos.';
    SA.usuarios ??= [];  // sin reintentos automáticos: está el botón Recargar
  }
  SA.cargando = false;
  render();
}

// Re-renderiza sin perder lo que el usuario está escribiendo.
function pintar(el, html) {
  if (el._html === html) return;
  const sucios = [...el.querySelectorAll('[data-dirty]')].map(i => [i.id, i.value, i.checked]);
  const foco = el.contains(document.activeElement) ? document.activeElement.id : null;
  el.innerHTML = el._html = html;
  sucios.forEach(([id, v, checked]) => {
    const i = document.getElementById(id);
    if (!i) return;
    if (i.type === 'radio' || i.type === 'checkbox') i.checked = checked;
    else i.value = v;
    i.dataset.dirty = '1';
    if (i.dataset.out) document.getElementById(i.dataset.out).textContent = v;
  });
  if (foco) document.getElementById(foco)?.focus();
}

function render() {
  renderVistas();
  const listo = D.user && D.perfil && D.grupo && D.miembros?.[miUid()];
  pintar($('#modal'), listo ? renderModal() : '');
  if (listo) {
    asegurarVotacion();
    asegurarEquipos();
  }
}

function renderVistas() {
  const el = $('#app');
  if (D.user === undefined) return pintar(el, cargando());
  if (!D.user) return pintar(el, vistaLogin()), actualizarAvisoUsuario();
  if (D.perfil === undefined || (D.registrando && !D.perfil)) return pintar(el, cargando(D.registrando ? 'Creando tu cuenta…' : undefined));
  if (!D.perfil) return pintar(el, vistaCompletar());
  if (location.hash === '#/usuarios' && esSuper()) return pintar(el, vistaUsuarios());
  if (location.hash === '#/grupos' || !D.gid) return pintar(el, vistaGrupos(!!D.gid));
  if (!D.grupo || !D.miembros || !D.miembros[miUid()]) return pintar(el, cargando());
  const m = location.hash.match(/^#\/jugador\/(.+)$/);
  if (m && D.miembros[m[1]]) return pintar(el, vistaFicha(m[1]));
  pintar(el, vistaPrincipal());
}

async function guardarPerfil(f) {
  const edad = parseInt(f.get('edad'));
  if (!(edad >= 10 && edad <= 99)) return toast('Poné una edad entre 10 y 99');
  const uid = miUid();
  const actual = D.perfil || {};
  const datos = {
    usuario: actual.usuario || usuarioDeAuth(),
    edad,
    posicion: f.get('posicion'),
    foto: ui.foto ?? actual.foto ?? '',
  };
  const ok = await act(async () => {
    await F.setDoc(refUsuario(uid), { ...datos, grupos: actual.grupos || [], creado: actual.creado || Date.now() });
    // La ficha se copia en cada grupo para que solo la vean sus miembros.
    await Promise.allSettled((actual.grupos || []).map(g => F.updateDoc(F.doc(colMiembros(g.id), uid), datos)));
  }, '💾 Ficha guardada');
  if (ok) ui.foto = null;
  return ok;
}

    const ok = await actualizarGrupo(s => {
      s.anotados = s.anotados.filter(x => x !== id);
      s.admins = s.admins.filter(x => x !== id);
      s.armadores = s.armadores.filter(x => x !== id);
      delete s.solicitudes[id];
      if (!s.baneados.includes(id)) s.baneados.push(id);
    });
    if (ok && await act(() => F.deleteDoc(F.doc(colMiembros(D.gid), id)), `${p.usuario} fue expulsado`)) location.hash = '';
  },
  'cambiar-grupo': ({ gid }) => { guardado.set(LS + 'gid', gid); elegirGrupo(); location.hash = ''; render(); },
  'salir-grupo': async ({ gid }) => {
    const g = D.perfil.grupos.find(x => x.id === gid);
    if (gid === D.gid && esAdmin() && D.grupo.admins.length === 1) return toast('Sos el único admin: nombrá a otro antes de salir');
    if (!confirm(`¿Salir de ${g?.nombre}? Para volver vas a necesitar el link de invitación.`)) return;
    await act(async () => {
      if (gid === D.gid) await F.runTransaction(db, async tx => {
        const s = normGrupo((await tx.get(refGrupo(gid))).data());
        if (s.anotados.includes(miUid())) tx.update(refGrupo(gid), { anotados: s.anotados.filter(x => x !== miUid()) });
      });
      await F.deleteDoc(F.doc(colMiembros(gid), miUid()));
      if (guardado.get(LS + 'gid') === gid) guardado.set(LS + 'gid', null);
      await F.updateDoc(refUsuario(miUid()), { grupos: D.perfil.grupos.filter(x => x.id !== gid) });
    }, 'Saliste del grupo');
  },
  'quitar-foto': () => { ui.foto = ''; render(); },
  nivel: ({ id, delta }) => {
    const n = limitarNivel(nivelDe(id) + Number(delta));
    if (n !== nivelDe(id)) guardarNivel(id, n);
  },
  // Stepper dentro de un formulario: cambia un input oculto, se guarda al enviar.
  paso: ({ target, delta }) => {
    const i = document.getElementById(target);
    i.value = limitarNivel(Number(i.value) + Number(delta));
    i.dataset.dirty = '1';
    document.getElementById(i.dataset.out).textContent = i.value;
  },

  'sa-recargar': () => { SA.usuarios = null; render(); },
  'sa-editar': ({ uid }) => { SA.editando = uid; SA.foto = null; render(); },
  'sa-cancelar': () => { SA.editando = null; SA.foto = null; render(); },
  'sa-quitar-foto': () => { SA.foto = ''; render(); },
  'sa-pass': async ({ uid }) => {
    const u = SA.usuarios.find(x => x.uid === uid);
    const pass = prompt(`Nueva contraseña para ${u.usuario} (mínimo 6 caracteres):`, genPass());
    if (pass == null) return;
    if (await act(() => api('password', { uid, password: pass }))) {
      copiar(`⚽ Tus datos para entrar a ${urlBase()}\nUsuario: ${u.usuario}\nContraseña: ${pass}`, '🔑 Contraseña cambiada. Datos copiados para mandarle');
    }
  },
  'sa-borrar': async ({ uid }) => {
    const u = SA.usuarios.find(x => x.uid === uid);
    if (!confirm(`¿Borrar a ${u.usuario} para siempre? Se borra su cuenta, su ficha, sus votos y sale de todos sus grupos.`)) return;
    if (await act(() => api('borrar', { uid }), `${u.usuario} fue borrado`)) {
      SA.usuarios = SA.usuarios.filter(x => x.uid !== uid);
      render();
    }
  },
};

const guardarNivel = (id, n) => act(() => F.setDoc(refNiveles(D.gid), { [id]: n }, { merge: true }));

const cambios = {
  foto: async el => {
    const file = el.files?.[0];
    if (!file) return;
    try {
      ui.foto = await procesarFoto(file);
      render();
    } catch (e) {
      console.error(e);
      toast('No se pudo leer esa imagen, probá con otra (JPG o PNG)');
    }
  },
};

const formularios = {
  entrar: f => {
    if (avisoMail(f.get('usuario'))) return toast(avisoMail(f.get('usuario')));
    return act(() => A.signInWithEmailAndPassword(auth, emailDe(f.get('usuario')), f.get('pass')));
  },
  registro: async f => {
    const usuario = f.get('usuario').trim();
    if (avisoMail(usuario)) return toast(avisoMail(usuario));
    if (!/^[A-Za-z0-9_.]{3,20}$/.test(usuario)) return toast('El usuario puede tener letras, números, punto o guion bajo (3 a 20)');
    const edad = parseInt(f.get('edad'));
    if (!(edad >= 10 && edad <= 99)) return toast('Poné una edad entre 10 y 99');
    const datos = { usuario, edad, posicion: f.get('posicion'), foto: ui.foto || '', grupos: [], creado: Date.now() };
    D.registrando = true;
    render();
    const ok = await act(async () => {
      const cred = await A.createUserWithEmailAndPassword(auth, emailDe(usuario), f.get('pass'));
      await F.setDoc(refUsuario(cred.user.uid), datos);
    }, `¡Bienvenido, ${usuario}! ⚽`);
    D.registrando = false;
    if (ok) ui.foto = null;
    render();
    return ok;
  },
  perfil: guardarPerfil,
  recuperar: async f => {
    let usuario;
    const ok = await act(async () => { usuario = (await api('recuperar', { codigo: f.get('codigo'), password: f.get('pass') })).usuario; });
    if (ok) {
      toast(`✅ Listo. Entrá como ${usuario} con la contraseña nueva`);
      ui.tab = 'entrar';
      render();
      const u = $('#l-usuario');
      if (u) { u.value = usuario; u.dataset.dirty = '1'; }
    }
    return ok;
  },
  'crear-grupo': f => crearGrupo(f.get('nombre').trim()),
  unirse: f => {
    const m = f.get('link').match(/unirse\/([^/\s]+)\/([^/\s#?]+)/);
    if (!m) return toast('Ese no parece un link de invitación');
    if (D.perfil.grupos?.some(g => g.id === m[1])) { acciones['cambiar-grupo']({ gid: m[1] }); return true; }
    return unirse(m[1], m[2]).then(ok => { if (ok) location.hash = ''; return ok; });
  },
  voto: (f, { id }) => {
    const stats = Object.fromEntries(STATS.map(s => [s.k, parseInt(f.get(s.k))]));
    return act(() => F.setDoc(F.doc(colVotos(D.gid), `${miUid()}_${id}`), { voter: miUid(), target: id, stats, ts: Date.now() }), '⭐ Voto guardado');
  },
  'sa-crear': async f => {
    const usuario = f.get('usuario').trim(), pass = f.get('pass');
    const datos = { usuario, password: pass, edad: parseInt(f.get('edad')), posicion: f.get('posicion') };
    const ok = await act(() => api('crear', datos));
    if (ok) {
      copiar(`⚽ Tus datos para entrar a ${urlBase()}\nUsuario: ${usuario}\nContraseña: ${pass}`, `✅ ${usuario} creado. Datos copiados para mandarle`);
      SA.usuarios = null;
      SA.passSugerida = genPass();
    }
    return ok;
  },
  'sa-editar': async (f, { uid }) => {
    const datos = { uid, edad: parseInt(f.get('edad')), posicion: f.get('posicion') };
    if (SA.foto !== null) datos.foto = SA.foto;
    const ok = await act(() => api('editar', datos), '💾 Usuario actualizado');
    if (ok) {
      Object.assign(SA.usuarios.find(x => x.uid === uid), datos);
      SA.editando = null;
      SA.foto = null;
    }
    return ok;
  },
  'mvp-votar': async f => {
    const voto = f.get('voto');
    if (!voto) return toast('Elegí a alguien');
    const m = D.mvp;
    const ok = await act(() => F.setDoc(F.doc(colVotosMvp(D.gid, m.id), miUid()), { voto, ts: Date.now() }), `🏆 Votaste a ${nombreCandidato(m, voto)}`);
    if (ok) { ui.modal = null; render(); }
    return ok;
  },
  'mvp-candidatos': async f => {
    const m = D.mvp;
    const candidatos = f.getAll('cand');
    const nuevo = (f.get('nuevo') || '').trim();
    if (nuevo) candidatos.push('inv_' + genId(10));
    if (!candidatos.length) return toast('Tiene que haber al menos un candidato');
    const nombres = Object.fromEntries(candidatos.map(id => [id, id === candidatos.at(-1) && nuevo ? nuevo : nombreCandidato(m, id)]));
    const ok = await act(() => F.updateDoc(refMvp(D.gid, m.id), { candidatos, nombres }), '💾 Candidatos actualizados');
    if (ok) { ui.modal = null; render(); }
    return ok;
  },
  partido: f => {
    const cupo = Math.max(2, Math.min(30, parseInt(f.get('cupo')) || 10));
    return actualizarGrupo(s => {
      s.partido = { titulo: f.get('titulo').trim(), fecha: f.get('fecha') || '', cuando: f.get('cuando').trim(), lugar: f.get('lugar').trim(), cupo };
    }, '💾 Partido guardado');
  },
  invitado: f => {
    const id = 'inv_' + genId(10);
    const nivel = Number(f.get('nivel'));
    return actualizarGrupo(s => {
      s.invitados[id] = { nombre: f.get('nombre').trim(), posicion: f.get('posicion') };
      s.anotados.push(id);
    }, 'Invitado anotado').then(ok => ok && nivel !== NIVEL_DEFAULT ? guardarNivel(id, nivel).then(() => ok) : ok);
  },
};

document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]');
  if (!b) return;
  if ('fondo' in b.dataset && e.target !== b) return;  // clic dentro del modal: no lo cierra
  acciones[b.dataset.action]?.(b.dataset);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el) cambios[el.dataset.change]?.(el, el.dataset);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id) t.dataset.dirty = '1';
  if (t.dataset.out) document.getElementById(t.dataset.out).textContent = t.value;
  if (t.id === 'l-usuario') actualizarAvisoUsuario();
});
document.addEventListener('submit', async e => {
  const form = e.target.closest('[data-form]');
  if (!form) return;
  e.preventDefault();
  const btn = form.querySelector('button:not([type=button])');
  if (btn) btn.disabled = true;
  try {
    if (await formularios[form.dataset.form]?.(new FormData(form), form.dataset)) {
      form.querySelectorAll('[data-dirty]').forEach(i => delete i.dataset.dirty);
      if (['crear-grupo', 'unirse', 'invitado', 'sa-crear'].includes(form.dataset.form)) {
        form.reset();
        form.querySelectorAll('[data-out]').forEach(i => (document.getElementById(i.dataset.out).textContent = i.value));
      }
      form._html = null;
      render();
    }
  } finally {
    if (btn && btn.isConnected) btn.disabled = false;
  }
});

leerInvitacion();
render();
// La votación abre y cierra por horario: revisar cada medio minuto.
setInterval(() => { actualizarSubsMvp(); cargarHistorialMvp(); render(); }, 30000);
</script>
