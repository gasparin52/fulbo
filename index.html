// "20", "20hs", "8:30", "20.30 hs" → "20:00", "08:30", "20:30". Si no se entiende, queda como está.
function normalizarHora(t) {
  const m = t.match(/^(\d{1,2})(?:\s*[:.h]\s*(\d{2}))?\s*(?:h|hs|hrs?)?\.?$/i);
  if (!m || +m[1] > 23 || +(m[2] || 0) > 59) return t;
  return `${m[1].padStart(2, '0')}:${m[2] || '00'}`;
}
// La hora del partido aunque esté escrita como "Viernes 20hs" (null si no se entiende).
function horaDelPartido(p) {
  if (horaValida(p.cuando)) return p.cuando;
  const m = (p.cuando || '').match(/(\d{1,2})(?:\s*[:.]\s*(\d{2}))?\s*(?:h|hs|hrs?)\b/i) || (p.cuando || '').match(/\b(\d{1,2}):(\d{2})\b/);

  return `${m[1].padStart(2, '0')}:${m[2] || '00'}`;
}

// Las próximas n fechas después de "desde" (sin incluirla). Con salteadas: también las que se saltean.
// Igual que proximasFechas de api/avisar.js.
function ocurrencias(ag, desde, n, conSalteadas = false) {
  const out = [];
  const slots = [...(ag?.slots || [])].sort((a, b) => a.hora.localeCompare(b.hora));
  let d = Date.parse(desde + 'T12:00:00Z') + DIA;
  for (let i = 0; i < 120 && out.length < n && slots.length; i++, d += DIA) {
    const fecha = new Date(d).toISOString().slice(0, 10), dia = new Date(d).getUTCDay();
    const salteada = (ag.saltear || []).includes(fecha);
    if (salteada && !conSalteadas) continue;
    for (const x of slots) if (x.dia === dia && out.length < n) out.push({ fecha, hora: x.hora, lugar: x.lugar || '', salteada });
  }
  return out;
}

  return n >= t.fin ? 'terminado' : n >= t.inicio ? 'enjuego' : n >= t.cierre ? 'cerrado' : 'normal';
}

function claveSegura(p, usuario = '') {
  if (typeof p !== 'string' || p.length < 8) return 'La contraseña tiene que tener al menos 8 caracteres';
  if (p.length > 100) return 'La contraseña es demasiado larga';
  if (!/[A-Za-z]/.test(p) || !/\d/.test(p)) return 'La contraseña tiene que tener letras y números';
  if (usuario && p.toLowerCase().includes(usuario.trim().toLowerCase())) return 'La contraseña no puede contener tu nombre de usuario';
  return '';
}

const esArmador = id => !!D.grupo?.armadores.includes(id);

const equipoDe = id => D.grupo?.equipos?.A.includes(id) ? 'A' : D.grupo?.equipos?.B.includes(id) ? 'B' : null;
const otroEquipo = e => (e === 'A' ? 'B' : 'A');
const NOMBRE_EQUIPO = { A: '🔴 Equipo A', B: '🔵 Equipo B' };

// Pasa a alguien al equipo "a" dentro de un estado de grupo (para usar en actualizarGrupo).
// Sirve para titulares (A / B) y para suplentes (SA / SB).
function moverDeEquipo(s, id, a) {
  if (!s.equipos) return;
  const de = otroEquipo(a);
  for (const p of ['', 'S']) {
    const lista = s.equipos[p + de] || [];
    if (!lista.includes(id)) continue;
    s.equipos[p + de] = lista.filter(x => x !== id);
    s.equipos[p + a] = [...(s.equipos[p + a] || []), id];
    s.equipos.editado = true;
  }
}

// Cada suplente queda asignado a un equipo (SA / SB) por si le toca entrar. Se
// equilibran aparte de los titulares: cada uno va al lado con menos suplentes y, si
// empatan, al de suplentes más flojos. En modo equilibrado se reparten de mejor a peor
// (queda en serpentina); los que se anotan después se suman con la misma cuenta.
function repartirSuplentes(s) {
  const eq = s.equipos;
  const sups = dividir(s).suplentes.map(p => p.id);
  eq.SA = (eq.SA || []).filter(id => sups.includes(id));
  eq.SB = (eq.SB || []).filter(id => sups.includes(id));
  const fuerza = e => eq['S' + e].reduce((t, id) => t + puntaje(id), 0);
  const nuevos = sups.filter(id => !eq.SA.includes(id) && !eq.SB.includes(id));
  if (eq.modo !== 'aleatorio') nuevos.sort((a, b) => puntaje(b) - puntaje(a));
  nuevos.forEach(id => {
    const e = eq.SA.length !== eq.SB.length ? (eq.SA.length < eq.SB.length ? 'A' : 'B') : fuerza('A') <= fuerza('B') ? 'A' : 'B';
    eq['S' + e].push(id);
  });
}

// Puntaje al lado de cada uno en los equipos. Admins y armadores ven el que se usa para
// equilibrar (con el nivel del admin si no tiene votos); el resto, el promedio de votos.
function chipNota(id) {
  const r = resumen(id);
  const v = puedeEditarEquipos() ? puntaje(id) : r.n ? r.general : null;
  return `<span class="w-8 shrink-0 text-right text-xs font-mono font-bold ${v === null ? 'text-slate-600' : colorNota(v)}" title="${r.n ? `Promedio de ${r.n} ${r.n === 1 ? 'voto' : 'votos'}` : 'Sin votos todavía'}">${v === null ? '–' : v.toFixed(1)}</span>`;
}

// Suplentes vigentes de un equipo, en el orden de la lista (S1, S2…).
const suplentesDe = (e, d) => d.suplentes.filter(p => (D.grupo.equipos?.['S' + e] || []).includes(p.id));

let toastTimer;

function msgError(e) {

  return {

    'auth/configuration-not-found': 'Falta habilitar el login en Firebase',
    'auth/network-request-failed': 'Sin conexión',
    'permission-denied': 'No tenés permiso para hacer eso',
  }[c] || 'Algo salió mal' + (c ? ` (${c})` : '');
}

async function act(fn, okMsg) {
  try {
    await fn();
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    console.error(e);
    toast('❌ ' + (e.mensaje || msgError(e)));
    return false;
  }
}

// Transacción sobre el documento del grupo. Solo escribe los campos que
// cambiaron: los jugadores solo pueden tocar "anotados" (ver firestore.rules).
function actualizarGrupo(mut, okMsg, gid = D.gid) {
  return act(() => F.runTransaction(db, async tx => {
    const snap = await tx.get(refGrupo(gid));
    const antes = normGrupo(snap.data());
    const s = structuredClone(antes);
    mut(s);
    const patch = {};
    for (const k of Object.keys(s)) if (JSON.stringify(s[k]) !== JSON.stringify(antes[k])) patch[k] = s[k];
    if (Object.keys(patch).length) tx.update(refGrupo(gid), patch);
  }), okMsg);
}

A.onAuthStateChanged(auth, user => {
  const ultimoIngreso = Date.parse(user?.metadata.lastSignInTime || '');
  if (user && Date.now() - ultimoIngreso > CONFIG.diasSesion * 864e5) {
    toast('Tu sesión venció, entrá de nuevo');
    return A.signOut(auth);
  }
  cortar(subsUser);
  cortar(subsGrupo);
  cortar(subsMvp);
  Object.values(subsMisGrupos).forEach(f => f());
  subsMisGrupos = {};
  nivelesDe = mvpDe = pendientesDe = null;
  Object.assign(D, { misGrupos: {}, user, perfil: user ? undefined : null, privado: user ? undefined : null, gid: null, grupo: null, miembros: null, notas: undefined, pendientes: [], votos: {}, niveles: {}, mvp: null, mvps: [], estrellas: {}, cargado: {}, faltas: [], reportes: [], rehacer: [], bajas: [] });
  if (user) {
    subsUser.push(F.onSnapshot(refUsuario(user.uid), s => {
      D.perfil = s.exists() ? s.data() : null;
      if (D.perfil) D.registrando = false;
      suscribirMisGrupos();

    // Mail de recuperación: lo ve solo uno mismo (privado/{uid}).
    subsUser.push(F.onSnapshot(F.doc(db, 'privado', user.uid), s => {
      D.privado = s.exists() ? s.data() : null;

    }, e => { console.error(e); D.privado = { error: true }; render(); }));
  }
  render();
});

function suscribirMisGrupos() {
  const ids = (D.perfil?.grupos || []).map(g => g.id);
  for (const gid of Object.keys(subsMisGrupos)) if (!ids.includes(gid)) {
    subsMisGrupos[gid]();
    delete subsMisGrupos[gid];
    delete D.misGrupos[gid];
  }
  for (const gid of ids) if (!subsMisGrupos[gid]) {
    subsMisGrupos[gid] = F.onSnapshot(refGrupo(gid), s => {
      D.misGrupos[gid] = s.exists() ? normGrupo(s.data()) : null;
      render();
    }, e => { console.error(e); D.misGrupos[gid] = null; });
  }
}

function elegirGrupo() {
  const ids = (D.perfil?.grupos || []).map(g => g.id);
  const quiero = guardado.get(LS + 'gid');
  const gid = ids.includes(quiero) ? quiero : ids.includes(D.gid) ? D.gid : ids[0] || null;
  if (gid === D.gid) return;
  cortar(subsGrupo);
  cortar(subsMvp);
  nivelesDe = mvpDe = pendientesDe = null;
  Object.assign(D, { gid, grupo: null, miembros: null, notas: undefined, pendientes: [], votos: {}, niveles: {}, mvp: null, mvps: [], estrellas: {}, cargado: {}, faltas: [], reportes: [], rehacer: [], bajas: [] });
  if (!gid) return;
  guardado.set(LS + 'gid', gid);
  subsGrupo.push(F.onSnapshot(refGrupo(gid), s => {
    if (!s.exists()) return olvidarGrupo(gid, 'Ese grupo ya no existe');
    D.grupo = normGrupo(s.data());
    suscribirNiveles();
    suscribirPendientes();
    suscribirReportes();
    suscribirRehacer();
    render();
  }, e => {
    if (e.code === 'permission-denied') olvidarGrupo(gid, 'Ya no sos parte de ese grupo');
    else console.error(e);
  }));
  subsGrupo.push(F.onSnapshot(colMiembros(gid), qs => {
    D.miembros = Object.fromEntries(qs.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
    render();
  }, e => console.warn(e.code)));
  // Votos: cada uno lee solo los suyos; los promedios, el 😈 y el 🧐 los arma el servidor
  // en calc/notas. Con las reglas viejas (sin calc) se leen todos los votos como antes.
  const leerVotos = (q, si = () => true) => F.onSnapshot(q, qs => {
    if (!si()) return;
    const v = {};
    qs.docs.forEach(d => { const x = d.data(); (v[x.target] ||= {})[x.voter] = x.stats; });
    D.votos = v;
    D.cargado.votos = true;
    render();
  }, e => console.warn(e.code));

// ---------------- 🙋 Pedir rehacer los equipos ----------------
// Cada jugador anotado puede pedir que se rehagan los equipos. Todos ven cuántos lo
// pidieron (grupo.rehacer.n); quiénes, solo los admins. Los pedidos valen para una
// "ronda" de equipos: cuando se vuelven a armar, empieza una ronda nueva desde cero.
let rehacerDe = null, cortarRehacer = null;
function suscribirRehacer() {

  cortarRehacer?.();

  cortarRehacer = esAdmin()
    ? F.onSnapshot(colRehacer(D.gid), qs => guardar(qs.docs), e => console.warn(e.code))
    : F.onSnapshot(refRehacer(D.gid, miUid()), d => guardar(d.exists() ? [d] : []), e => console.warn(e.code));
  subsGrupo.push(() => { cortarRehacer?.(); cortarRehacer = rehacerDe = null; });
}
const rondaActual = () => {
  const eq = D.grupo?.equipos, rh = D.grupo?.rehacer;
  return eq?.ronda && rh?.ronda === eq.ronda ? eq.ronda : null;
};
const pedidosRehacer = () => (rondaActual() ? D.grupo.rehacer.n : 0);
// Con el 60% de los titulares que tienen cuenta (los invitados no votan) se rehacen solos.
const PORCENTAJE_REHACER = 0.6;
const umbralRehacer = d => Math.max(2, Math.ceil(PORCENTAJE_REHACER * d.titulares.filter(p => !p.invitado).length));
const quienesRehacer = () => D.rehacer.filter(r => r.ronda && r.ronda === rondaActual()).map(r => r.id);
// Al armar equipos nuevos empieza otra ronda y los pedidos vuelven a cero.
function nuevaRonda(s) {
  if (!s.equipos) { s.rehacer = null; return; }
  s.equipos.ronda = genId(8);
  s.rehacer = { ronda: s.equipos.ronda, n: 0 };
}
// El pedido y el contador se escriben juntos: las reglas chequean que cuadren.
function pedirRehacer(quiero) {
  const gid = D.gid, uid = miUid();
  return act(() => F.runTransaction(db, async tx => {
    const g = normGrupo((await tx.get(refGrupo(gid))).data());
    const mio = await tx.get(refRehacer(gid, uid));
    const ronda = g.equipos?.ronda;
    if (!ronda || g.rehacer?.ronda !== ronda) return;
    if ((mio.exists() && mio.data().ronda === ronda) === quiero) return;
    if (quiero) tx.set(refRehacer(gid, uid), { ronda, ts: Date.now() });
    else tx.delete(refRehacer(gid, uid));
    tx.update(refGrupo(gid), { rehacer: { ronda, n: g.rehacer.n + (quiero ? 1 : -1) } });
  }), quiero ? '🙋 Pedido enviado' : 'Pedido cancelado');
}

// ---------------- 🌦️ Clima ----------------
// Pronóstico de Open-Meteo (gratis, sin clave) para la hora del partido en la ciudad
// que eligió el admin. Solo hay pronóstico para los próximos 16 días.
const CLIMA_TTL = 30 * 60e3, CLIMA_REINTENTO = 10 * 60e3, HORA_CLIMA_DEFAULT = '20:00';
let clima = { clave: null, t: 0, datos: null, cargando: false };
const hoyArg = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
function estadoClima() {
  const p = D.grupo?.partido, c = D.grupo?.ciudad;
  if (!c?.lat || !p?.fecha) return null;
  const dias = Math.round((Date.parse(p.fecha + 'T12:00:00Z') - Date.parse(hoyArg() + 'T12:00:00Z')) / DIA);
  if (dias < 0) return null;
  if (dias > 15) return { lejos: true };
  const hora = horaValida(p.cuando) ? p.cuando : HORA_CLIMA_DEFAULT;
  const clave = `${c.lat},${c.lon},${p.fecha},${hora}`;
  const vence = clima.datos ? CLIMA_TTL : CLIMA_REINTENTO;
  if (!clima.cargando && (clima.clave !== clave || Date.now() - clima.t > vence)) cargarClima(clave, c, p.fecha, hora);
  return clima.clave === clave && clima.datos ? { ...clima.datos, hora } : null;
}
async function cargarClima(clave, c, fecha, hora) {
  if (clima.clave !== clave) clima.datos = null;
  Object.assign(clima, { clave, t: Date.now(), cargando: true });
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`
      + '&hourly=temperature_2m,precipitation_probability,weather_code,wind_speed_10m,is_day'
      + `&timezone=${encodeURIComponent(TZ)}&start_date=${fecha}&end_date=${fecha}`;
    const r = await fetch(url);
    if (!r.ok) throw new Error('clima ' + r.status);
    const h = (await r.json()).hourly;
    const i = h.time.indexOf(`${fecha}T${hora.slice(0, 2)}:00`);
    if (i < 0) throw new Error('clima sin hora');
    if (clima.clave === clave) clima.datos = {
      temp: h.temperature_2m[i], lluvia: h.precipitation_probability[i], viento: h.wind_speed_10m[i],
      codigo: h.weather_code[i], dia: h.is_day[i] === 1,
    };
  } catch (e) {
    console.warn(e);  // Sin clima no pasa nada (por ejemplo, si la red lo bloquea).
  } finally {
    clima.cargando = false;
    render();
  }
}
// Códigos del tiempo de la OMM (los que usa Open-Meteo).
function cieloDe(codigo, dia) {
  if (codigo === 0) return dia ? ['☀️', 'Despejado'] : ['🌙', 'Despejado'];
  if (codigo <= 2) return dia ? ['🌤️', 'Algo nublado'] : ['☁️', 'Algo nublado'];
  if (codigo === 3) return ['☁️', 'Nublado'];
  if (codigo <= 48) return ['🌫️', 'Niebla'];
  if (codigo <= 57) return ['🌦️', 'Llovizna'];
  if (codigo <= 67) return ['🌧️', 'Lluvia'];
  if (codigo <= 77) return ['🌨️', 'Nieve'];
  if (codigo <= 82) return ['🌦️', 'Chaparrones'];
  if (codigo <= 86) return ['🌨️', 'Nieve'];
  return ['⛈️', 'Tormenta'];
}

async function registrarToken(gid, token) {

const haceCuanto = ts => {

};
// Busca la ciudad que escribió el admin (prefiere Argentina si hay varias con el mismo nombre).
async function buscarCiudad(texto) {
  const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(texto)}&count=10&language=es&format=json`);
  if (!r.ok) throw Object.assign(new Error('geo'), { mensaje: 'No se pudo buscar la ciudad. Probá de nuevo más tarde' });
  const res = (await r.json()).results || [];
  const c = res.find(x => x.country_code === 'AR') || res[0];
  if (!c) throw Object.assign(new Error('geo'), { mensaje: `No encontré la ciudad "${texto}"` });
  const redondear = x => Math.round(x * 1e4) / 1e4;
  return { nombre: [c.name, c.admin1, c.country_code !== 'AR' && c.country].filter(Boolean).join(', '), lat: redondear(c.latitude), lon: redondear(c.longitude) };
}

// ---------------- 🟥 Faltó sin avisar ----------------
// Una falta vence cuando el jugador se anotó en 2 fechas posteriores. En la primera
// fecha en que se anota después de la falta queda castigado: si se llena la lista,
// los que llegan después le pasan por delante y él queda de suplente.
const fechasDespues = (f, id) => D.mvps.filter(m => m.id > f.fecha && (m.anotados || m.candidatos || []).includes(id)).length;
const rojasDe = id => D.faltas.filter(f => f.target === id && fechasDespues(f, id) < 2);
// La fecha en curso no cuenta para levantar el castigo: dura hasta que se pasa a la próxima.
const castigado = id => {
  const actual = D.grupo?.partido.fecha;
  return rojasDe(id).some(f => actual !== f.fecha
    && !D.mvps.some(m => m.id > f.fecha && m.id !== actual && (m.anotados || m.candidatos || []).includes(id)));
};
const hoyAR = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);

// ⭐ Estrellas: cuántas veces fue jugador del partido cada uno (empates incluidos).
// Una votación cerrada ya no cambia, así que su resultado se guarda en el celular.
const historialMvp = {};
let cargandoHistorial = false;
async function cargarHistorialMvp() {
  const gid = D.gid, docs = D.mvps || [];
  if (cargandoHistorial || !gid) return;
  cargandoHistorial = true;
  for (const m of docs) {
    const k = `${gid}/${m.id}`;
    if (estadoMvp(m) !== 'cerrada' || historialMvp[k]) continue;
    const clave = `${LS}mvp_res_${gid}_${m.id}`;
    let ganadores = null;
    try { ganadores = JSON.parse(guardado.get(clave)); } catch {}
    if (!Array.isArray(ganadores)) {
      try {
        const qs = await F.getDocs(colVotosMvp(gid, m.id));
        ganadores = resultadoMvp({ votos: Object.fromEntries(qs.docs.map(d => [d.id, d.data().voto])) }).ganadores;
        guardado.set(clave, JSON.stringify(ganadores));
      } catch (e) {
        console.warn(e.code);
        continue;
      }
    }
    historialMvp[k] = ganadores;
  }
  cargandoHistorial = false;
  if (D.gid !== gid) return;
  const estrellas = {};
  docs.forEach(m => (historialMvp[`${gid}/${m.id}`] || []).forEach(id => (estrellas[id] = (estrellas[id] || 0) + 1)));
  D.estrellas = estrellas;
  render();
}
const estrellasDe = id => D.estrellas?.[id] || 0;

// ---------------- Jugador del partido ----------------
const estadoMvp = (m = D.mvp, ahora = Date.now()) => !m ? null : ahora < m.abre ? 'pendiente' : ahora < m.cierra ? 'abierta' : 'cerrada';

// Mi voto se lee siempre; los votos de todos, recién cuando cierra (así lo exigen las reglas).
function actualizarSubsMvp() {
  const m = D.mvp;
  const clave = m ? `${D.gid}/${m.id}/${estadoMvp() === 'cerrada'}` : null;
  if (clave === mvpDe) return;
  cortar(subsMvp);
  mvpDe = clave;
  if (!m) return;
  const gid = D.gid;

let mvpIntentado = null;
// Fecha fija: terminado el partido (y el rato de lista cerrada), se pasa a la fecha siguiente.
// Antes se arma la votación del mejor con los titulares; el cambio lo hace api/avisar.js.
let rotacionIntentada = null;
async function asegurarRotacion() {
  const g = D.grupo;
  if (!agendaActiva(g) || !D.miembros || !D.cargado.mvps || !D.cargado.faltas) return;
  const p = g.partido, t = tiemposDe(p);
  const termino = !p.fecha || (t ? Date.now() >= t.fin + BLOQUEO_DESPUES_H * 3600e3 : p.fecha < hoyArg());
  const clave = `${D.gid}/${p.fecha}`;
  if (!termino || rotacionIntentada === clave) return;
  rotacionIntentada = clave;
  if (p.fecha && Date.now() < cierraVotacion(p.fecha) && D.mvp?.id !== p.fecha) await crearVotacion(p.fecha);
  avisar('rotar');
}

function asegurarVotacion() {
  const f = D.grupo?.partido.fecha;
  // Espera a tener las votaciones y las 🟥, que deciden quiénes fueron titulares.
  if (!f || !D.miembros || !D.cargado.mvps || !D.cargado.faltas || D.mvp?.id === f || mvpIntentado === `${D.gid}/${f}`) return;
  if (Date.now() < abreVotacion(f, D.grupo.partido.cuando) || Date.now() >= cierraVotacion(f)) return;
  mvpIntentado = `${D.gid}/${f}`;
  crearVotacion(f);
}

function resultadoMvp(m) {
  const conteo = {};
  Object.values(m.votos || {}).forEach(id => (conteo[id] = (conteo[id] || 0) + 1));
  const total = Object.values(conteo).reduce((a, b) => a + b, 0);
  const max = Math.max(0, ...Object.values(conteo));
  const ganadores = total >= MIN_VOTOS_MVP ? Object.keys(conteo).filter(id => conteo[id] === max) : [];
  return { conteo, total, max, ganadores };
}

// ---------------- Jugadores, votos y puntajes ----------------
function jugador(id) {
  if (id.startsWith('inv_')) {
    const i = D.grupo?.invitados[id];
    return i && { id, usuario: i.nombre, posicion: i.posicion, invitado: true };
  }
  return D.miembros?.[id];
}

function resumen(id) {
  const p = jugador(id);
  let n, prom = {};
  if (D.notas) {
    // Promedios que calcula el servidor (api/grupo.js).
    const x = D.notas.notas?.[id];
    if (!x) return { n: 0 };
    n = x.n;
    prom = x.prom;
  } else {
    // Reglas viejas: se calcula acá. Solo cuentan los votos de gente que sigue en el grupo.
    const vs = Object.entries(D.votos[id] || {}).filter(([voter]) => D.miembros?.[voter]).map(([, s]) => s);
    if (!vs.length) return { n: 0 };
    n = vs.length;
    STATS.forEach(s => (prom[s.k] = vs.reduce((t, v) => t + (v[s.k] || 0), 0) / vs.length));
  }
  const campo = CAMPO.reduce((t, k) => t + prom[k], 0) / CAMPO.length;
  const general = p?.posicion === 'arquero' ? (campo + prom.arquero) / 2 : campo;
  return { n, prom, general };
}

// Para equilibrar: promedio de votos si tiene; si no, el nivel que puso el admin.
function puntaje(id) {
  const r = resumen(id);
  return r.n ? r.general : Number(D.niveles[id]) || NIVEL_DEFAULT;
}

// Titulares y suplentes de un estado de grupo. Los castigados (🟥) entran de titular
// solo si sobra lugar; entre los suplentes se respeta el orden de llegada.
function dividir(s) {
  const lista = s.anotados.map(jugador).filter(Boolean);
  const cupo = Number(s.partido.cupo) || 10;
  const entran = new Set([...lista.filter(p => !castigado(p.id)), ...lista.filter(p => castigado(p.id))].slice(0, cupo));
  return { cupo, titulares: lista.filter(p => entran.has(p)), suplentes: lista.filter(p => !entran.has(p)) };
}
const derivar = () => dividir(D.grupo);
const baseKey = titulares => titulares.map(p => p.id).sort().join(',');
const equiposDesactualizados = d => D.grupo.equipos && D.grupo.equipos.base !== baseKey(d.titulares);

// Cuando se llena el cupo, el primer admin o armador que tiene la app abierta arma
// los equipos equilibrados. Una sola vez por lista: si después los borran, no insiste.
let autoArmado = null, supsRepartidos = null, rondaIniciada = null, rehechos = null;
function asegurarEquipos() {
  const c = D.cargado;
  if (!puedeEditarEquipos() || !D.miembros || !c.votos || !c.niveles || !c.mvps || !c.faltas) return;
  const d = derivar(), eq = D.grupo.equipos;
  // Equipos armados antes de que existieran los pedidos para rehacer: les abre una ronda.
  if (eq && !eq.ronda && rondaIniciada !== D.gid) {
    rondaIniciada = D.gid;
    actualizarGrupo(s => { if (s.equipos && !s.equipos.ronda) nuevaRonda(s); });
  }
  // Suplentes que se anotaron después de armar: se suman solos a un equipo.
  if (eq && !equiposDesactualizados(d) && d.suplentes.some(p => ![...(eq.SA || []), ...(eq.SB || [])].includes(p.id))) {
    const clave = `${D.gid}/${d.suplentes.map(p => p.id).join(',')}`;
    if (supsRepartidos !== clave) {
      supsRepartidos = clave;
      actualizarGrupo(s => { if (s.equipos) repartirSuplentes(s); });
    }
  }
  const ronda = rondaActual();
  if (equiposCerrados()) return;
  if (ronda && !equiposDesactualizados(d) && pedidosRehacer() >= umbralRehacer(d) && rehechos !== ronda) {
    rehechos = ronda;
    actualizarGrupo(s => {
      if (!s.equipos || s.rehacer?.ronda !== ronda || s.rehacer.n < umbralRehacer(dividir(s))) return;
      const { titulares } = dividir(s);
      s.equipos = { ...armarEquipos(titulares, 'equilibrado'), modo: 'equilibrado', base: baseKey(titulares) };
      repartirSuplentes(s);
      nuevaRonda(s);
      s.solicitudes = {};
    }, '🔄 La mayoría pidió rehacerlos: equipos nuevos');
  }
  if (d.titulares.length < d.cupo) return;
  const clave = `${D.gid}/${baseKey(d.titulares)}`;
  if (autoArmado === clave) return;
  autoArmado = clave;
  if (D.grupo.equipos && !equiposDesactualizados(d)) return;
  actualizarGrupo(s => {
    const { titulares, cupo } = dividir(s);
    const base = baseKey(titulares);
    if (titulares.length < cupo || s.equipos?.base === base) return;
    s.equipos = { ...armarEquipos(titulares, 'equilibrado'), modo: 'equilibrado', base };
    repartirSuplentes(s);
    nuevaRonda(s);
    s.solicitudes = {};
  }, '⚖️ Se llenó el cupo: equipos equilibrados armados');
}

function armarEquipos(jugadores, modo) {
  const mezclados = shuffle([...jugadores]);
  const A = [], B = [];
  if (modo === 'aleatorio') {
    mezclados.forEach((p, i) => (i % 2 ? B : A).push(p.id));
    return { A, B };
  }
  // Equilibrado: prueba todas las formas de partir en dos (mismo tamaño, ±1) y se queda
  // con la de menor diferencia de puntaje. Los arqueros quedan repartidos mitad y mitad.
  // Entre las que empatan elige una al azar, así "Armar equilibrados" puede variar.
  const n = mezclados.length;
  const pts = mezclados.map(p => puntaje(p.id));
  const total = pts.reduce((a, b) => a + b, 0);
  const arq = mezclados.map(p => p.posicion === 'arquero');
  const nArq = arq.filter(Boolean).length;
  const tam = Math.floor(n / 2);
  if (n > 20) return serpentina(mezclados);
  let mejor = Infinity, mejores = [];
  for (let m = 0; m < 1 << n; m++) {
    let cant = 0, suma = 0, arqs = 0;
    for (let i = 0; i < n; i++) if (m & (1 << i)) { cant++; suma += pts[i]; if (arq[i]) arqs++; }
    if (cant !== tam) continue;
    if (nArq >= 2 && (arqs < Math.floor(nArq / 2) || arqs > Math.ceil(nArq / 2))) continue;
    const dif = Math.abs(total - 2 * suma);
    if (dif < mejor - 1e-9) { mejor = dif; mejores = [m]; }
    else if (dif < mejor + 1e-9) mejores.push(m);
  }
  const m = mejores[Math.floor(Math.random() * mejores.length)];
  mezclados.forEach((p, i) => (m & (1 << i) ? B : A).push(p.id));
  return Math.random() < 0.5 ? { A, B } : { A: B, B: A };
}

// Para listas muy largas: de mayor a menor en serpentina A, B, B, A… (arqueros uno por lado).
function serpentina(jugadores) {
  const A = [], B = [];
  const orden = jugadores.sort((a, b) => puntaje(b.id) - puntaje(a.id));
  let resto = orden, offset = 0;
  const arqueros = orden.filter(p => p.posicion === 'arquero');
  if (arqueros.length >= 2) {
    A.push(arqueros[0].id);
    B.push(arqueros[1].id);
    resto = orden.filter(p => p !== arqueros[0] && p !== arqueros[1]);
    offset = 2;
  }
  resto.forEach((p, i) => (['A', 'B', 'B', 'A'][(i + offset) % 4] === 'A' ? A : B).push(p.id));
  return { A, B };
}

    document.body.append(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  toast(msg);
}

// Recorta al centro y achica a 256×256: ~20 KB, entra cómodo en Firestore.
async function procesarFoto(file) {
  const img = await createImageBitmap(file);
  const L = 256, lado = Math.min(img.width, img.height);
  const c = Object.assign(document.createElement('canvas'), { width: L, height: L });
  c.getContext('2d').drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, L, L);
  return c.toDataURL('image/jpeg', 0.82);
}

  flamengo: { n: 'Flamengo', c: ['#c8102e', '#111111'], d: 'rayas', afuera: true },
};
function escudo(id, size = 20) {
  const k = CLUBES[id];
  if (!k) return '';
  const [a, b = a] = k.c;
  const fondo = {
    liso: `<rect width="20" height="24" fill="${a}"/>${b !== a ? `<path d="M2 1.5h16v9.5c0 6.2-4 9.6-8 11.5-4-1.9-8-5.3-8-11.5z" fill="none" stroke="${b}" stroke-width="4"/>` : ""}`,
    franja: `<rect width="20" height="24" fill="${a}"/><rect y="8.5" width="20" height="6" fill="${b}"/>`,
    banda: `<rect width="20" height="24" fill="${a}"/><polygon points="13,0 20,0 7,24 0,24" fill="${b}"/>`,
    bastones: [0, 1, 2, 3, 4].map(i => `<rect x="${i * 4}" width="4" height="24" fill="${k.c[i % k.c.length]}"/>`).join(''),
    mitad: `<rect width="10" height="24" fill="${a}"/><rect x="10" width="10" height="24" fill="${b}"/>`,
    v: `<rect width="20" height="24" fill="${a}"/><polyline points="2,2 10,15 18,2" fill="none" stroke="${b}" stroke-width="3.5"/>`,
    rayas: [0, 1, 2, 3, 4, 5, 6, 7].map(i => `<rect y="${i * 3}" width="20" height="3" fill="${k.c[i % k.c.length]}"/>`).join(''),
  }[k.d];
  const forma = 'M2 1.5h16v9.5c0 6.2-4 9.6-8 11.5-4-1.9-8-5.3-8-11.5z';
  return `<svg viewBox="0 0 20 24" width="${size}" height="${Math.round(size * 1.2)}" class="shrink-0 inline-block" role="img" aria-label="${esc(k.n)}"><title>${esc(k.n)}</title><clipPath id="esc-${id}"><path d="${forma}"/></clipPath><g clip-path="url(#esc-${id})">${fondo}</g><path d="${forma}" fill="none" stroke="#e2e8f0" stroke-opacity=".7" stroke-width="1"/></svg>`;
}
// Buscador de cuadros: se escribe para filtrar (sin importar acentos) o se elige de la lista.
const sinAcentos = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const selectorCuadro = sel => {
  const k = CLUBES[sel];
  const filtro = sinAcentos(ui.cuadroFiltro || '');
  const lista = af => Object.entries(CLUBES).filter(([, c]) => !!c.afuera === af && sinAcentos(c.n).includes(filtro))
    .sort((x, y) => x[1].n.localeCompare(y[1].n))
    .map(([id, c]) => `
      <button type="button" data-action="elegir-cuadro" data-id="${id}" class="w-full flex items-center gap-2.5 px-3 py-2 text-left text-sm hover:bg-slate-800 ${id === sel ? 'bg-emerald-500/10 text-emerald-200' : 'text-slate-200'}">
        ${escudo(id, 18)} <span class="flex-1 truncate">${esc(c.n)}</span>${id === sel ? ic('check', 'text-emerald-400') : ''}
      </button>`).join('');
  const arg = lista(false), afuera = lista(true);
  return `
    <input type="hidden" name="cuadro" value="${esc(sel)}">
    <button type="button" data-action="abrir-cuadros" class="${INPUT} mt-1 flex items-center gap-2 text-left">
      ${k ? escudo(sel, 18) : ic('shield-check', 'text-slate-500')}

    </button>
    ${ui.cuadrosAbierto ? `
      <div class="mt-1 rounded-xl border border-slate-700 bg-slate-900 shadow-xl overflow-hidden">
        <div class="p-2 border-b border-slate-800">
          <input id="pf-cuadro-buscar" type="search" autocomplete="off" placeholder="Buscar… (ej: boca, racing)" value="${esc(ui.cuadroFiltro || '')}" class="${INPUT} !py-2 text-sm">
        </div>
        <div class="max-h-64 overflow-y-auto">
          ${!filtro ? `<button type="button" data-action="elegir-cuadro" data-id="" class="w-full px-3 py-2 text-left text-sm text-slate-400 hover:bg-slate-800">— Ninguno —</button>` : ''}

          ${afuera ? `<p class="px-3 pt-2 pb-1 text-[10px] font-bold uppercase tracking-wider text-slate-500">Afuera</p>${afuera}` : ''}
          ${!arg && !afuera ? '<p class="px-3 py-4 text-sm text-slate-500">No encontramos ese cuadro.</p>' : ''}
        </div>
      </div>` : ''}`;
};

// Foto del grupo (la sube un admin); si no tiene, la inicial con un color propio.
function fotoGrupo(g, size = 40) {
  const st = `width:${size}px;height:${size}px`;
  if (g?.foto) return `<img src="${esc(g.foto)}" alt="${esc(g.nombre || '')}" data-action="ampliar" title="Ver foto" style="${st}" class="rounded-xl object-cover shrink-0 bg-slate-800 cursor-zoom-in">`;
  const n = g?.nombre || '?';

  return `<span style="${st};background:hsl(${hue} 45% 20%);color:hsl(${hue} 75% 72%);font-size:${Math.round(size * 0.45)}px" class="rounded-xl grid place-items-center font-black shrink-0">${esc(n[0].toUpperCase())}</span>`;
}

function avatar(p, size = 40) {
  const s = `width:${size}px;height:${size}px`;
  if (p?.foto) return `<img src="${esc(p.foto)}" alt="" style="${s}" class="rounded-full object-cover shrink-0 bg-slate-800">`;
  const n = p?.usuario || '?';
  const hue = [...n].reduce((h, c) => h + c.charCodeAt(0), 0) % 360;
  return `<span style="${s};background:hsl(${hue} 40% 32%);font-size:${Math.round(size * 0.42)}px" class="rounded-full grid place-items-center font-bold shrink-0 text-white">${esc(n[0].toUpperCase())}</span>`;
}

function radar(prom) {
  const size = 300, c = size / 2, R = 96, n = STATS.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [c + r * Math.cos(a), c + r * Math.sin(a)]; };
  const poly = r => STATS.map((_, i) => pt(i, r).map(x => x.toFixed(1)).join(',')).join(' ');
  const anillos = [2, 4, 6, 8, 10].map(v => `<polygon points="${poly((R * v) / 10)}" fill="none" stroke="#334155"/>`).join('');
  const ejes = STATS.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="#334155"/>`; }).join('');
  const datos = prom
    ? `<polygon points="${STATS.map((s, i) => pt(i, (R * prom[s.k]) / 10).map(x => x.toFixed(1)).join(',')).join(' ')}" fill="rgba(16,185,129,.35)" stroke="#10b981" stroke-width="2" stroke-linejoin="round"/>`
    : '';
  const etiquetas = STATS.map((s, i) => {
    const [x, y] = pt(i, R + 26);
    return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="700" fill="#94a3b8">${s.corto}${prom ? `<tspan fill="#e2e8f0"> ${prom[s.k].toFixed(1)}</tspan>` : ''}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${size} ${size}" class="w-full max-w-[320px] mx-auto">${anillos}${ejes}${datos}${etiquetas}</svg>`;
}

const usuarioDeAuth = () => (D.user?.email || '').split('@')[0];

// ---------------- Mis partidos ----------------
// El próximo partido de cada grupo del jugador, ordenado por fecha, con su estado y los choques.
function misPartidos() {
  const uid = miUid(), n = Date.now();
  const ps = (D.perfil.grupos || []).map(({ id, nombre }) => {
    const g = D.misGrupos[id];
    if (!g) return { id, nombre, cargando: g === undefined };
    const p = g.partido, t = tiemposDe(p), cupo = Number(p.cupo) || 10;
    const i = g.anotados.indexOf(uid);
    const estado = i >= 0 ? (i < cupo ? 'titular' : 'suplente') : g.publico.includes(uid) ? 'tribuna' : '';
    // Ya jugado: terminó hace rato o la fecha quedó atrás.
    const viejo = t ? n > t.fin + BLOQUEO_DESPUES_H * 3600e3 : p.fecha && p.fecha < hoyArg();
    return { id, nombre: g.nombre || nombre, g, p, t, cupo, estado, sup: i - cupo + 1, fase: faseDe(p), viejo };
  });
  const orden = x => x.cargando || !x.g ? 4 : !x.p.fecha ? 3 : x.viejo ? 2 : 1;
  ps.sort((a, b) => orden(a) - orden(b) || (a.t?.inicio || Date.parse(a.p?.fecha || 0)) - (b.t?.inicio || Date.parse(b.p?.fecha || 0)));
  // Choques: partidos que vienen y se superponen en el horario.
  const vivos = ps.filter(x => x.t && !x.viejo && !x.p.suspendido);
  for (const a of vivos) a.choques = vivos.filter(b => b !== a && a.t.inicio < b.t.fin && b.t.inicio < a.t.fin);
  return ps;
}

const utcIcs = ms => new Date(ms).toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
function datosAgenda(x) {
  return {
    titulo: `⚽ ${x.nombre}`,
    lugar: x.p.lugar || '',
    detalle: `${x.p.titulo || 'Fulbo'}. Anotate o bajate en ${urlBase()}`,
  };
}
const linkGoogleCalendar = x => {
  const a = datosAgenda(x);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + `&text=${encodeURIComponent(a.titulo)}&dates=${utcIcs(x.t.inicio)}/${utcIcs(x.t.fin)}`
    + `&location=${encodeURIComponent(a.lugar)}&details=${encodeURIComponent(a.detalle)}`;
};
function bajarIcs(x) {
  const a = datosAgenda(x);
  const txt = v => v.replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Fulbo//ES', 'BEGIN:VEVENT',
    `UID:${x.id}-${x.p.fecha}@fulbo5.com`, `DTSTAMP:${utcIcs(Date.now())}`,
    `DTSTART:${utcIcs(x.t.inicio)}`, `DTEND:${utcIcs(x.t.fin)}`,
    `SUMMARY:${txt(a.titulo)}`, `LOCATION:${txt(a.lugar)}`, `DESCRIPTION:${txt(a.detalle)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:Partido en 2 horas', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const el = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(new Blob([ics], { type: 'text/calendar' })),
    download: `fulbo-${x.p.fecha}.ics`,
  });
  el.click();
  setTimeout(() => URL.revokeObjectURL(el.href), 5000);
}

function tarjetaMisPartidos(completo = false) {
  const ps = misPartidos();
  if (!ps.length) return '';
  const semana = ps.filter(x => x.t && ['titular', 'suplente'].includes(x.estado) && !x.viejo && !x.p.suspendido && x.t.inicio - Date.now() < 7 * DIA).length;
  const chip = (cls, html) => `<span class="inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-semibold ${cls}">${html}</span>`;
  const fila = x => {
    if (!x.g) return `<li class="py-3 text-sm text-slate-500">${esc(x.nombre)} · ${x.cargando ? 'Cargando…' : 'No se pudo cargar'}</li>`;
    const d = x.p.fecha && new Date(`${x.p.fecha}T12:00:00-03:00`);
    const dia = d ? d.toLocaleDateString('es-AR', { weekday: 'short', timeZone: TZ }).replace('.', '').toUpperCase() : '';
    const estado = x.p.suspendido ? chip('bg-red-500/15 text-red-300', ic('ban') + ' Suspendido')
      : x.fase === 'enjuego' ? chip('bg-emerald-500/20 text-emerald-300', '⚽ En juego')
      : x.viejo ? chip('bg-slate-800 text-slate-400', 'Ya se jugó')
      : x.estado === 'titular' ? chip('bg-emerald-500/15 text-emerald-300', ic('circle-check') + ' Titular')
      : x.estado === 'suplente' ? chip('bg-amber-500/15 text-amber-300', ic('repeat') + ' Suplente S' + x.sup)
      : x.estado === 'tribuna' ? chip('bg-sky-500/15 text-sky-300', ic('megaphone') + ' Tribuna')
      : x.p.fecha ? chip('bg-slate-800 text-slate-400', 'No anotado') : '';
    const abierto = x.p.fecha && !x.viejo && !x.p.suspendido && !['enjuego', 'terminado'].includes(x.fase);
    const anotado = ['titular', 'suplente'].includes(x.estado);
    const choques = (x.choques || []).map(o => {
      const grave = anotado && ['titular', 'suplente'].includes(o.estado);
      return `<p class="mt-1.5 text-xs ${grave ? 'text-red-300' : 'text-amber-300'}">${ic('triangle-alert')} ${grave ? 'Se te pisa con' : 'Mismo horario que'} <b>${esc(o.nombre)}</b> (${o.t.hora})${grave ? ': elegí uno y bajate del otro a tiempo.' : ''}</p>`;
    }).join('');
    return `
      <li class="py-3 flex gap-3">
        <div class="w-12 shrink-0 text-center rounded-xl py-1.5 ${x.viejo || !d ? 'bg-slate-800/60 text-slate-500' : 'bg-sky-500/10 text-sky-300'}">
          ${d ? `<p class="text-[10px] font-bold tracking-wide">${dia}</p><p class="text-xl font-black leading-none">${d.getUTCDate()}</p>` : `<p class="text-lg leading-none py-1">${ic('calendar')}</p>`}
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex items-start justify-between gap-2">
            <button data-action="cambiar-grupo" data-gid="${x.id}" class="text-left font-bold hover:text-emerald-300 min-w-0 truncate">${esc(x.nombre)}</button>
            ${estado}
          </div>
          <p class="text-xs text-slate-400 mt-0.5">
            ${x.p.fecha ? [cuantoFalta(x.p.fecha), x.t ? x.t.hora : x.p.cuando, x.p.lugar].filter(Boolean).map(esc).join(' · ') : 'Todavía no hay fecha cargada'}
          </p>
          ${agendaActiva(x.g) ? `<p class="text-[11px] text-slate-500 mt-0.5">${ic('repeat')} ${esc(textoAgenda(x.g.agenda))}${(() => { const [o] = proximasFechas(x.g.agenda, x.p.fecha || ayerArg()); return o ? ` · después: ${esc(fechaLinda(o.fecha))}` : ''; })()}</p>` : ''}
          ${choques}
          <div class="flex items-center gap-2 mt-2">
            ${abierto && !anotado ? `<button data-action="anotarme-en" data-gid="${x.id}" class="${BTN_OK} text-xs px-3 py-1.5">⚽ Me anoto</button>` : ''}
            <button data-action="cambiar-grupo" data-gid="${x.id}" class="${BTN_CHIP}">Ver ${ic('chevron-right')}</button>
            ${abierto && x.t ? `<button data-action="agendar" data-gid="${x.id}" title="Agendar en mi calendario" aria-label="Agendar en mi calendario" class="${BTN_CHIP}">${ic('calendar-plus')}</button>` : ''}
          </div>
          ${ui.agendar === x.id && x.t ? `
            <div class="mt-2 flex flex-wrap gap-2 text-xs">
              <a href="${linkGoogleCalendar(x)}" target="_blank" rel="noopener" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-sky-300">Google Calendar</a>
              <button data-action="bajar-ics" data-gid="${x.id}" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-sky-300">Calendario del celu (iPhone, Outlook…)</button>
            </div>` : ''}
        </div>
      </li>`;
  };
  if (completo) {
    // Pestaña Calendario: todo, cargando de a 10 a medida que se baja.
    const lim = ui.calLimite || 10;
    return card(`
      ${tiraSemana(ps)}
      <ul class="divide-y divide-slate-800">${ps.slice(0, lim).map(fila).join('')}</ul>
      ${ps.length > lim ? `<button data-action="mas-cal" data-perezoso class="${BTN_SEC} w-full text-sm mt-2">Ver más (${ps.length - lim})</button>` : ''}`);
  }
  // Plegable: se recuerda si lo dejaste abierto.
  const desplegado = guardado.get(LS + 'cal') === '1';
  const prox = ps.find(x => x.t && !x.viejo && !x.p.suspendido);
  return card(`
    <button data-action="toggle-cal" aria-expanded="${desplegado}" class="w-full flex items-center gap-2 text-left">
      <span class="flex-1 min-w-0">
        <span class="block text-lg font-bold">${ic('calendar', 'text-sky-400')} Calendario</span>
        <span class="block text-xs text-slate-400 truncate">${semana ? `Esta semana jugás <b class="text-slate-200">${semana}</b>` : 'Esta semana no estás anotado'}${!desplegado && prox ? ` · próximo: ${esc(cuantoFalta(prox.p.fecha) || fechaLinda(prox.p.fecha))} ${prox.t.hora}, ${esc(prox.nombre)}` : ''}</span>
      </span>
      <span class="${BTN_ICONO} !w-8 !h-8 transition ${desplegado ? 'rotate-90' : ''}">${ic('chevron-right')}</span>
    </button>
    ${desplegado ? `
      <div class="mt-3">
        ${tiraSemana(ps)}
        <ul class="divide-y divide-slate-800">${ps.map(fila).join('')}</ul>
      </div>` : ''}`);
}

// Semana: los próximos 7 días con un puntito donde hay partido (verde si estás anotado).
function tiraSemana(ps) {
  const hoy = hoyArg();
  const dias = Array.from({ length: 7 }, (_, i) => new Date(Date.parse(hoy + 'T12:00:00Z') + i * DIA).toISOString().slice(0, 10));
  return `
    <div class="grid grid-cols-7 gap-1 mb-3">
      ${dias.map(f => {
        const del = ps.filter(x => x.p?.fecha === f && !x.p.suspendido);
        const juego = del.some(x => ['titular', 'suplente'].includes(x.estado));
        const d = new Date(f + 'T12:00:00-03:00');
        return `
          <div class="rounded-xl py-1.5 text-center ${f === hoy ? 'bg-sky-500/20 text-sky-100 ring-1 ring-sky-400/40' : 'bg-slate-800/50 text-slate-300'}">
            <p class="text-[10px] font-bold uppercase">${d.toLocaleDateString('es-AR', { weekday: 'short', timeZone: TZ }).replace('.', '').slice(0, 3)}</p>
            <p class="text-base font-black leading-tight">${d.getUTCDate()}</p>
            <p class="h-2 flex justify-center gap-0.5">${del.map(x => `<span class="w-1.5 h-1.5 rounded-full ${['titular', 'suplente'].includes(x.estado) ? 'bg-emerald-400' : 'bg-slate-500'}"></span>`).join('')}</p>
          </div>`;
      }).join('')}
    </div>`;
}

// Arriba de todo: los partidos de hoy (si hay), bien grandes.
function tarjetaHoy() {
  const hoy = misPartidos().filter(x => x.g && x.p.fecha === hoyArg() && !x.viejo);
  return hoy.map(x => {
    const anotado = ['titular', 'suplente'].includes(x.estado);
    const juego = x.fase === 'enjuego';
    const fondo = x.p.suspendido ? 'from-red-600 to-rose-700 text-white' : anotado ? 'from-emerald-400 to-teal-500 text-slate-950' : 'from-slate-700 to-slate-800 text-white';
    const cupo = x.cupo, anotados = Math.min(x.g.anotados.length, cupo), faltan = cupo - anotados, sups = Math.max(0, x.g.anotados.length - cupo);
    const estadoCupo = x.p.suspendido ? '' : faltan > 0
      ? `<span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-black bg-amber-300 text-slate-950" title="Faltan jugadores">${ic('triangle-alert')} Faltan ${faltan} · ${anotados}/${cupo}</span>`
      : `<span class="shrink-0 rounded-full px-2.5 py-1 text-xs font-black bg-slate-950/80 text-emerald-300" title="Lista completa">${ic('circle-check')} Completo ${cupo}/${cupo}${sups ? ` · +${sups}` : ''}</span>`;
    const titulo = x.p.suspendido ? '🚫 Hoy: partido suspendido' : juego ? '⚽ Se está jugando ahora' : x.fase === 'terminado' ? '🏁 Ya terminó' : anotado ? (x.estado === 'titular' ? '⚽ Hoy jugás' : '⚽ Hoy sos suplente S' + x.sup) : '⚽ Hoy hay partido';
    return `
      <div data-action="cambiar-grupo" data-gid="${x.id}" role="link" class="cursor-pointer rounded-2xl p-4 bg-gradient-to-br ${fondo} shadow-lg shadow-black/30 active:scale-[.99] transition">
        <div class="flex items-start justify-between gap-2">
          <p class="text-xs font-black uppercase tracking-wider opacity-80 pt-1">${titulo}</p>
          ${estadoCupo}
        </div>
        <div class="flex items-center gap-3 mt-3">
          ${fotoGrupo(x.g, 52)}
          <div class="min-w-0 flex-1">
            <p class="text-3xl font-black leading-none">${esc(x.t?.hora || x.p.cuando || '')}</p>
            <p class="font-bold truncate mt-1">${esc(x.nombre)}</p>
            ${x.p.lugar ? `<p class="text-sm opacity-80 truncate">${ic('map-pin')} ${esc(x.p.lugar)}</p>` : ''}
          </div>
        </div>
        <p class="mt-3 text-right text-xs font-bold opacity-80">${juego ? 'Ver en vivo' : 'Ver partido'} ${ic('chevron-right')}</p>
      </div>`;
  }).join('');
}

// Tarjetas de mis grupos: si soy admin, también "Administrar".
function tarjetaMisGrupos() {
  const grupos = D.perfil.grupos || [];

// Si hoy no hay partido: el próximo, más chico.
function tarjetaProximo() {
  const x = misPartidos().find(p => p.t && !p.viejo && !p.p.suspendido);

  return `
    <div data-action="cambiar-grupo" data-gid="${x.id}" role="link" class="cursor-pointer rounded-2xl border border-slate-800 bg-slate-900/70 p-4 hover:border-slate-600 transition">

      'Al que califica a todos muy bajo le aparece la etiqueta <b>😈 hater</b>: si con 3 o más compañeros calificados pone en promedio 3 o menos, o pone 2,5 puntos o más por debajo de lo que les ponen los demás. Se va sola si ajusta sus votos.',
      'Con <b>' + ic('zap') + ' Calificar rápido</b> (en Jugadores) pasás por todos los que te faltan, de a uno. Después del partido también aparece para calificar a los que jugaron.',
      'Una vez que calificaste a alguien, tu calificación queda <b>oculta</b> en su ficha hasta que tocás <b>Actualizar voto</b>, así nadie la ve si le mostrás el celu.',
      'El que calificó a casi todo el grupo (80% o más) lleva un <b>🧐 Scout</b> al lado del nombre.',
      '<b>Las calificaciones sirven solo para armar equipos equilibrados.</b> No son un ranking ni se usan para nada más. Calificá con honestidad y respeto.',
    ])}
    ${seccion('🏆 Jugador del partido', [
      'La votación al mejor se habilita <b>una hora después de que empieza el partido</b> y dura <b>hasta el final del día siguiente</b> (23:59). Al entrar te aparece un cartel para votar.',
      'Votan todos los del grupo, uno por persona (lo podés cambiar mientras esté abierta), y nadie se puede votar a sí mismo.',
      `Los votos se ven recién al cierre. Con menos de ${MIN_VOTOS_MVP} votos queda desierto.`,
      'El que gana (o los que empatan primero) suma una <b>⭐</b> que queda en su ficha.',
    ])}
    ${seccion('🟥 Faltó sin avisar', [
      'Si alguien estaba anotado, <b>no fue y no avisó</b>, los que jugaron lo pueden reportar durante 3 días desde el día siguiente al partido.',
      '<b>Solo cuenta si un admin lo aprueba.</b> El reportado no ve quién lo reportó. No es para joder ni vengarse de nadie: los reportes truchos se rechazan.',
      'El que tiene una falta aprobada lleva una <b>🟥</b> en su ficha y en la lista. La tarjeta <b>se va cuando se anotó en 2 fechas</b> más.',
      '<b>Castigo:</b> en la primera fecha en que se anota después de la falta, si se llena la lista, los que se anotan después le pasan adelante y queda de suplente. Si no se llena, juega igual.',
    ])}
    ${seccion(ic('clipboard-list') + ' Asistencia', [
      'Cada uno tiene un <b>porcentaje de asistencia</b> en su ficha (últimos 90 días): cuántas veces jugó contra cuántas falló.',
      'Bajarse <b>con tiempo no afecta</b>. Bajarse <b>el día del partido</b> (menos de 24 h antes) cuenta un poco, y <b>a último momento</b> (menos de 6 h antes) cuenta más. <b>Faltar sin avisar</b> (🟥) es lo que más pesa.',
      'Si había <b>lluvia</b> pronosticada o el partido <b>se suspendió</b>, la baja no cuenta. Un admin también puede perdonar una baja.',
      'Con menos de 70% aparece un <b>⏰</b> al lado del nombre.',
    ])}
    ${seccion(ic('user') + ' Tu cuenta y el grupo', [
      'Tocá tu foto (arriba a la izquierda) para ver y editar tu ficha: edad, posición, foto y de qué cuadro sos.',
      'Si te lesionaste, tocá <b>🤕 Estoy lesionado</b> en tu ficha y te aparece la etiqueta 🤕 en la lista. Solo vos la podés poner y sacar (con <b>Ya me recuperé</b>).',
      'La sesión dura 30 días; después te pide entrar de nuevo.',
      '¿Te olvidaste la contraseña? En la pantalla de entrar tocá <b>¿Te olvidaste la contraseña?</b> y te mandamos un link a tu mail. Para eso tenés que tener el mail cargado y confirmado en <b>Tu cuenta</b>: sin mail no se puede recuperar.',
      'El grupo es privado: para entrar hace falta el link de invitación y que <b>un admin te acepte</b>. No lo compartas fuera del grupo.',
      'Si estás en varios grupos, en <b>Mis partidos</b> (arriba a la izquierda) ves el próximo partido de cada uno ordenado por fecha, si estás anotado, si se te pisan dos horarios, y lo podés <b>agendar</b> en tu calendario.',
    ])}
    ${pie()}`;
}

function indicadorClima() {
  const c = estadoClima();
  if (!c) return '';
  if (c.lejos) return '<p class="mt-4 text-xs text-slate-500 rounded-xl border border-dashed border-slate-700 px-3 py-2">🌤️ El pronóstico aparece cuando faltan 16 días o menos</p>';
  const [icono, cielo] = cieloDe(c.codigo, c.dia);
  // El fondo cambia según el tiempo: lluvia, sol, noche despejada o nublado.
  const mojado = c.lluvia >= 50 || (c.codigo >= 51 && c.codigo <= 67) || c.codigo >= 80;
  const tema = mojado ? 'from-sky-600/30 via-blue-800/20 to-slate-900/40 border-sky-500/30'
    : c.codigo <= 2 && c.dia ? 'from-amber-400/25 via-orange-500/10 to-slate-900/40 border-amber-400/30'
    : c.codigo <= 2 ? 'from-indigo-600/30 via-violet-800/15 to-slate-900/40 border-indigo-400/30'
    : 'from-slate-500/25 via-slate-700/20 to-slate-900/40 border-slate-500/30';
  const consejo = c.lluvia >= 70 ? '☔ Muy probable que llueva' : c.lluvia >= 40 ? '🌂 Puede llover' : c.viento >= 35 ? '🌬️ Mucho viento' : c.temp >= 30 ? '🥵 Llevá agua' : c.temp <= 8 ? '🧤 Abrigate' : '';
  const abierto = !!ui.climaAbierto;
  // Cerrado: una fila con lo justo. Tocándola se despliega el detalle.
  const dato = (titulo, valor, alerta, color, pct) => `
    <div class="flex-1 rounded-lg bg-slate-950/40 px-3 py-1.5">
      <div class="text-[10px] uppercase tracking-wide text-slate-400">${titulo}</div>
      <div class="font-bold ${alerta ? color : 'text-slate-100'}">${valor}</div>
      ${pct != null ? `<div class="mt-1 h-1 rounded-full bg-slate-700/70 overflow-hidden"><div class="h-full rounded-full bg-sky-400" style="width:${pct}%"></div></div>` : ''}
    </div>`;
  return `
    <div class="mt-3 rounded-xl border bg-gradient-to-br ${tema} text-sm">
      <button data-action="toggle-clima" aria-expanded="${abierto}" class="w-full flex items-center gap-2.5 px-3 py-2 text-left">
        <span class="text-xl leading-none">${icono}</span>
        <span class="font-bold text-slate-100">${Math.round(c.temp)}°</span>
        <span class="text-slate-300 truncate">${cielo}</span>
        <span class="ml-auto flex items-center gap-2.5 shrink-0 text-xs">
          <span class="${c.lluvia >= 50 ? 'text-sky-300 font-semibold' : 'text-slate-400'}">💧 ${c.lluvia}%</span>
          <span class="${c.viento >= 30 ? 'text-amber-300 font-semibold' : 'text-slate-400'}">💨 ${Math.round(c.viento)}</span>
          <span class="text-slate-400 transition-transform ${abierto ? 'rotate-180' : ''}">▾</span>
        </span>
      </button>
      ${abierto ? `
        <div class="px-3 pb-3">
          ${consejo ? `<p class="text-xs font-semibold text-slate-200 mb-2">${consejo}</p>` : ''}
          <div class="flex gap-2">
            ${dato('💧 Lluvia', `${c.lluvia}%`, c.lluvia >= 50, 'text-sky-300', c.lluvia)}
            ${dato('💨 Viento', `${Math.round(c.viento)} <span class="text-xs font-medium">km/h</span>`, c.viento >= 30, 'text-amber-300')}
          </div>
          <p class="mt-2 text-[11px] text-slate-400">Pronóstico para el ${esc(fechaLinda(D.grupo.partido.fecha))} a las ${esc(c.hora)} en ${esc(D.grupo.ciudad.nombre)} · se actualiza cada media hora</p>
        </div>` : ''}
    </div>`;
}

// "Hoy" / "Mañana" al lado de la fecha del partido.
function cuantoFalta(fecha) {
  if (!fecha) return '';
  const dias = Math.round((Date.parse(fecha + 'T12:00:00Z') - Date.parse(hoyArg() + 'T12:00:00Z')) / DIA);
  return dias === 0 ? 'Hoy' : dias === 1 ? 'Mañana' : dias > 1 && dias < 7 ? `En ${dias} días` : '';
}

function lineaAgenda() {
  const g = D.grupo;
  if (!agendaActiva(g)) return '';
  const lista = ocurrencias(g.agenda, g.partido.fecha || ayerArg(), 3, true);
  const corta = f => { const t = fechaLinda(f); return t.slice(0, 3) + ' ' + t.split(' ')[1]; };
  const item = o => esAdmin()
    ? `<button data-action="saltear" data-fecha="${o.fecha}" title="${o.salteada ? 'Volver a jugar esa fecha' : 'No se juega esa fecha (feriado, etc.)'}" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-600 hover:text-slate-200">${corta(o.fecha)}</button>`
    : `<span class="${o.salteada ? 'line-through text-slate-600' : ''}">${corta(o.fecha)}</span>`;
  return `
    <p class="mt-2 text-xs text-slate-400">${ic('repeat', 'text-emerald-400')} ${esc(textoAgenda(g.agenda))}${lista.length ? ' · Después: ' + lista.map(item).join(', ') : ''}</p>
    ${esAdmin() && lista.length ? '<p class="text-[11px] text-slate-600 mt-0.5">Tocá una fecha para saltearla (feriado, etc.).</p>' : ''}`;
}

function formAgenda() {
  const g = D.grupo, p = g.partido;
  const slots = g.agenda?.slots?.length ? g.agenda.slots : [{ dia: p.fecha ? diaDe(p.fecha) : 5, hora: horaValida(p.cuando) ? p.cuando : '20:00', lugar: p.lugar }];
  const filas = Math.min(3, Math.max(slots.length, ui.agendaFilas || 1));
  const fila = i => {
    const x = slots[i] || { dia: '', hora: '', lugar: '' };
    return `
      <div class="grid grid-cols-[1fr_5.5rem] sm:grid-cols-[9rem_5.5rem_1fr] gap-2">
        <select id="ag-dia-${i}" name="dia" class="${INPUT}">
          ${i ? '<option value="">— Ninguno —</option>' : ''}
          ${DIAS.map((n, k) => `<option value="${k}" ${x.dia === k ? 'selected' : ''}>${n[0].toUpperCase() + n.slice(1)}</option>`).join('')}
        </select>
        <input id="ag-hora-${i}" name="hora" value="${esc(x.hora)}" placeholder="20:00" maxlength="5" class="${INPUT}">
        <input id="ag-lugar-${i}" name="lugarFijo" value="${esc(x.lugar || '')}" placeholder="Lugar (si cambia)" maxlength="60" class="${INPUT} col-span-2 sm:col-span-1">
      </div>`;
  };
  return `
    <form data-form="agenda" class="mt-6 space-y-2 rounded-xl border border-slate-800 p-3">
      <h3 class="font-semibold text-sm text-slate-300">${ic('repeat')} Fecha fija ${agendaActiva(g) ? '<span class="text-xs font-normal text-emerald-400">activa</span>' : ''}</h3>
      <p class="text-xs text-slate-500">Si juegan siempre el mismo día, cargalo acá. Cuando termina un partido, la lista se vacía sola y se abre la fecha siguiente (la votación del mejor queda guardada).</p>
      ${Array.from({ length: filas }, (_, i) => fila(i)).join('')}
      ${filas < 3 ? '<button type="button" data-action="agenda-mas" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-400">+ Otro día de la semana</button>' : ''}
      <div class="flex gap-2 pt-1">
        <button class="${BTN} flex-1 bg-slate-700 hover:bg-slate-600 text-sm">${ic('save')} ${agendaActiva(g) ? 'Guardar fecha fija' : 'Activar fecha fija'}</button>
        ${agendaActiva(g) ? `<button type="button" data-action="agenda-quitar" class="${BTN} bg-slate-800 hover:bg-red-950 text-red-300 text-sm">Desactivar</button>` : ''}
      </div>
    </form>`;
}

function header(d) {
  const p = D.grupo.partido;
  const faltan = d.cupo - d.titulares.length;
  const falta = cuantoFalta(p.fecha);
  const fecha = fechaLinda(p.fecha);
  const chip = 'inline-flex items-center gap-1.5 rounded-lg bg-slate-800/70 border border-slate-700/60 px-2.5 py-1';
  const mapa = p.lugar ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.lugar, D.grupo.ciudad?.nombre].filter(Boolean).join(', '))}` : '';
  return `
    <div>
      <div class="flex items-start justify-between gap-4">
        <div class="min-w-0">
          <h1 class="text-3xl font-black tracking-tight">${esc(p.titulo || 'Fulbo ⚽')}</h1>
          <div class="mt-2 flex flex-wrap gap-1.5 text-sm">
            ${fecha ? `<span class="${chip}">${ic('calendar', 'text-slate-400')} <b class="font-semibold text-slate-100">${esc(fecha[0].toUpperCase() + fecha.slice(1))}</b>${falta ? `<span class="text-[11px] font-semibold rounded px-1.5 py-0.5 bg-emerald-500/15 text-emerald-300">${falta}</span>` : ''}</span>` : ''}
            ${p.cuando ? `<span class="${chip}">${ic('clock', 'text-slate-400')} <b class="font-semibold text-slate-100">${esc(p.cuando)}</b></span>` : ''}
            ${p.lugar ? `<a href="${esc(mapa)}" target="_blank" rel="noopener" title="Ver en el mapa" class="${chip} min-w-0 hover:border-slate-500">${ic('map-pin', 'text-slate-400')} <b class="font-semibold text-slate-100 truncate">${esc(p.lugar)}</b></a>` : ''}
          </div>
          ${lineaAgenda()}
        </div>
        <div class="text-right shrink-0">
          <div class="text-3xl font-black ${faltan <= 0 ? 'text-emerald-400' : ''}">${d.titulares.length}<span class="text-slate-500 text-xl">/${d.cupo}</span></div>
          <div class="text-xs text-slate-400">${faltan > 0 ? `faltan ${faltan}` : '¡completo!'}</div>
        </div>
      </div>
      <div class="mt-3 h-2 rounded-full bg-slate-800 overflow-hidden">
        <div class="h-full bg-emerald-500 transition-all" style="width:${Math.min(100, (d.titulares.length / d.cupo) * 100)}%"></div>
      </div>
      ${indicadorClima()}
    </div>`;
}

function miEstado(d) {
  const uid = miUid();
  const iT = d.titulares.findIndex(p => p.id === uid);
  const iS = d.suplentes.findIndex(p => p.id === uid);
  const anotado = iT >= 0 || iS >= 0;
  const estado = iT >= 0 ? `<span class="text-emerald-400">${ic('circle-check')} Estás anotado · titular #${iT + 1}</span>`
    : iS >= 0 ? `<span class="text-amber-400">${ic('hourglass')} Estás de suplente S${iS + 1}</span>`
    : D.grupo.publico.includes(uid) ? `<span class="text-sky-300">${ic('megaphone')} Vas a la tribuna (no jugás)</span>`
    : `<span class="text-slate-400">No estás anotado para este partido</span>`;
  const lleno = d.titulares.length >= d.cupo;
  const tribuna = !D.grupo.partido.suspendido && (D.grupo.publico.includes(uid)
    ? `<button data-action="publico-no" class="${BTN_CHIP} w-full mt-2 !py-2">Ya no voy a la tribuna</button>`
    : `<button data-action="publico-si" class="${BTN_SEC} w-full mt-2 text-sm inline-flex items-center justify-center gap-1.5">${ic('megaphone')} No juego, voy a la tribuna</button>`);
  return card(`
    <p class="text-sm">${estado}</p>
    ${castigado(uid) ? `<p class="mt-2 text-xs text-red-200 bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2">🟥 Tenés una tarjeta roja por faltar sin avisar: esta fecha, si se llena la lista, los que se anoten después te pasan adelante y quedás de suplente.</p>` : ''}
    ${listaBloqueada()
      ? `<p class="mt-3 text-xs text-slate-400">${fasePartido() === 'enjuego' ? '⚽ El partido está en juego' : '🏁 El partido terminó'}: la lista está cerrada.</p>`
      : anotado
      ? `<button data-action="bajar" data-id="${uid}" class="${BTN} w-full mt-3 bg-slate-800 hover:bg-red-950 text-red-300 border border-red-900/50">Me bajo 😢</button>`
      : `<button data-action="anotarme" class="${BTN_OK} w-full mt-3 text-lg">⚽ ¡Me anoto!${lleno ? ' <span class="text-sm font-medium">(entrás de suplente)</span>' : ''}</button>${tribuna || ''}`}
  `);
}

function filaJugador(p, etiqueta, clase) {
  // Cada uno se baja con "Me bajo"; sacar a otros de la lista es cosa del admin.
  const puedeBorrar = esAdmin();
  const nombre = `<span class="block font-medium truncate">${esc(p.usuario)}${estrellasDe(p.id) ? ` <span class="text-xs text-amber-300" title="Jugador del partido ${estrellasDe(p.id)} ${estrellasDe(p.id) === 1 ? 'vez' : 'veces'}">⭐${estrellasDe(p.id) > 1 ? estrellasDe(p.id) : ''}</span>` : ''}${marcaLesion(p.id)}${marcaRoja(p.id)}${marcaAsistencia(p.id)}${marcaHater(p.id)}${marcaScout(p.id)}${p.id === miUid() ? ' <span class="text-xs text-emerald-400">(vos)</span>' : ''}${p.invitado ? ' <span class="text-xs text-slate-500">(invitado)</span>' : ''}</span>`;
  return `
    <li class="flex items-center gap-3 py-2">
      <span class="w-9 shrink-0 text-center text-xs font-bold rounded-lg py-1 ${clase}">${etiqueta}</span>
      ${avatar(p, 32)}
      <a href="#/jugador/${p.id}" class="flex-1 min-w-0 hover:text-emerald-300">${nombre}
        <span class="text-xs text-slate-400">${pos(p).emoji} ${pos(p).label}</span>
      </a>
      ${esAdmin() ? `<span class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-slate-800 ${colorNota(puntaje(p.id))}" title="Puntaje para equilibrar">${puntaje(p.id).toFixed(1)}</span>` : ''}
      ${puedeBorrar ? `<button data-action="bajar" data-id="${p.id}" title="Sacar de la lista" aria-label="Sacar a ${esc(p.usuario)} de la lista" class="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:text-red-300 hover:bg-red-500/10 transition shrink-0">${ICONO_SACAR}</button>` : ''}
    </li>`;
}

function lista(d) {
  const libres = Array.from({ length: Math.max(0, d.cupo - d.titulares.length) }, (_, i) => `
    <li class="flex items-center gap-3 py-2 opacity-40">
      <span class="w-9 shrink-0 text-center text-xs font-bold rounded-lg py-1 border border-dashed border-slate-600">${d.titulares.length + i + 1}</span>
      <span class="text-sm italic text-slate-500">libre</span>
    </li>`).join('');
  return card(`
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-lg font-bold">${ic('circle-check', 'text-emerald-400')} Titulares</h2>
      <button data-action="copiar" class="${BTN} bg-green-600 hover:bg-green-500 text-white text-sm py-2">${ic('copy')} Copiar para WhatsApp</button>
    </div>
    <ul class="divide-y divide-slate-800">
      ${d.titulares.map((p, i) => filaJugador(p, i + 1, 'bg-emerald-500/15 text-emerald-300')).join('')}
      ${libres}
    </ul>
    ${d.suplentes.length ? `
      <h3 class="text-base font-bold mt-5 mb-1">${ic('repeat', 'text-amber-300')} Suplentes</h3>
      <ul class="divide-y divide-slate-800">
        ${d.suplentes.map((p, i) => filaJugador(p, 'S' + (i + 1), 'bg-amber-500/15 text-amber-300')).join('')}
      </ul>` : ''}
    ${esAdmin() && D.grupo.anotados.length ? `<button data-action="reemplazar" class="${BTN_SEC} w-full mt-4 text-sm inline-flex items-center justify-center gap-2">${ICONO_REEMPLAZAR} Reemplazar a alguien</button>` : ''}
  `);
}

// Los que van a ver el partido: no juegan, pero así saben quién más va.
function tarjetaPublico() {
  const yo = miUid();
  const gente = D.grupo.publico.filter(id => jugador(id) || D.miembros[id]).map(id => ({ id, ...(jugador(id) || D.miembros[id]) }));
  const voy = D.grupo.publico.includes(yo);
  const puedo = !D.grupo.anotados.includes(yo) && fasePartido() !== 'terminado' && !D.grupo.partido.suspendido;
  if (!gente.length && !puedo) return '';
  return card(`
    <div class="flex items-center justify-between gap-2">
      <h2 class="text-base font-bold">${ic('megaphone', 'text-amber-300')} Tribuna${gente.length ? ` <span class="text-slate-400 font-medium">(${gente.length})</span>` : ''}</h2>
      ${puedo ? (voy
        ? `<button data-action="publico-no" class="${BTN_SEC} text-xs py-1.5">Ya no voy</button>`
        : `<button data-action="publico-si" class="${BTN_SEC} text-xs py-1.5">${ic('megaphone')} Voy a la tribuna</button>`) : ''}
    </div>
    ${gente.length ? `
      <ul class="mt-3 flex flex-wrap gap-2">
        ${gente.map(p => `
          <li class="inline-flex items-center gap-1.5 rounded-full bg-slate-800/70 pl-1 pr-3 py-1 text-sm">
            ${avatar(p, 24)}
            <span>${esc(p.usuario)}${p.id === yo ? ' <span class="text-xs text-emerald-400">(vos)</span>' : ''}</span>
          </li>`).join('')}
      </ul>` : `<p class="mt-1 text-xs text-slate-500">¿No jugás pero vas a ir a alentar? Sumate a la tribuna, así saben quién más va.</p>`}
  `);
}

function equipos(d) {
  const eq = D.grupo.equipos;
  const editor = puedeEditarEquipos();
  const vigentes = eq && !equiposDesactualizados(d);
  const botones = editor ? `
    <div class="grid grid-cols-2 gap-2 mt-3">
      <button data-action="armar" data-modo="equilibrado" ${d.titulares.length < 2 ? 'disabled' : ''} class="${BTN_OK} text-sm">${ic('scale')} Armar equilibrados</button>
      <button data-action="armar" data-modo="aleatorio" ${d.titulares.length < 2 ? 'disabled' : ''} class="${BTN_SEC} text-sm">🎲 Aleatorio</button>
    </div>
    ${eq ? `<button data-action="borrar-equipos" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-500 hover:text-red-300 mt-2">Borrar equipos</button>` : ''}` : '';
  if (!eq) {
    return card(`
      <h2 class="text-lg font-bold">${ic('swords', 'text-emerald-400')} Equipos</h2>
      <p class="text-sm text-slate-400 mt-1">Todavía no se armaron los equipos.</p>
      ${botones}`);
  }
  const solicitudes = Object.entries(D.grupo.solicitudes).filter(([id, s]) => jugador(id) && equipoDe(id) && equipoDe(id) !== s.a);
  // Las flechas y los botones de armar aparecen solo en modo edición (admins y armadores).
  const editando = editor && vigentes && ui.editarEquipos;
  const mover = (p, e) => editando ? `<button data-action="mover-equipo" data-id="${p.id}" title="Pasar al ${NOMBRE_EQUIPO[otroEquipo(e)]}" class="w-7 h-7 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs shrink-0">${e === 'A' ? '→' : '←'}</button>` : '';
  const prom = e => { const js = eq[e].map(jugador).filter(Boolean); return js.reduce((t, p) => t + puntaje(p.id), 0) / (js.length || 1); };
  const columna = (e, borde, fondo, texto) => {
    const js = eq[e].map(jugador).filter(Boolean);
    const sups = vigentes ? suplentesDe(e, d) : [];
    return `
      <div class="rounded-2xl border-t-4 ${borde} ${fondo} p-3">
        <ul class="space-y-2">
          ${js.map(p => `
            <li class="flex items-center gap-2.5">
              ${avatar(p, 30)}
              <a href="#/jugador/${p.id}" class="flex-1 min-w-0">
                <span class="block font-semibold truncate">${esc(p.usuario)}${D.grupo.solicitudes[p.id] && solicitudes.some(([id]) => id === p.id) ? ' <span title="Pidió cambiarse" class="text-sky-300">' + ic('arrow-left-right') + '</span>' : ''}</span>
                <span class="block text-[11px] text-slate-500">${pos(p).emoji} ${pos(p).corto}</span>
              </a>
              <span class="opacity-70">${chipNota(p.id)}</span>
              ${mover(p, e)}
            </li>`).join('')}
        </ul>
        ${sups.length ? `
          <div class="mt-3 pt-2 border-t border-slate-700/50">
            <p class="text-[11px] font-semibold uppercase tracking-wide text-amber-300/80 mb-1.5">${ic('repeat')} Suplentes</p>
            <ul class="space-y-1.5 text-sm text-slate-300">
              ${sups.map(p => `
                <li class="flex items-center gap-2">
                  <span class="text-[10px] font-bold rounded px-1.5 py-0.5 bg-amber-500/15 text-amber-300 shrink-0">S${d.suplentes.indexOf(p) + 1}</span>
                  ${avatar(p, 22)}
                  <a href="#/jugador/${p.id}" class="truncate flex-1">${esc(p.usuario)}</a>
                  <span class="text-xs">${pos(p).emoji}</span>
                  <span class="opacity-70">${chipNota(p.id)}</span>
                  ${mover(p, e)}
                </li>`).join('')}
            </ul>
          </div>` : ''}
      </div>`;
  };

  // Pedido propio para cambiarse (solo si no puede moverse solo).
  const yo = miUid(), miEquipo = equipoDe(yo), miSolicitud = D.grupo.solicitudes[yo];
  const abiertos = vigentes && miEquipo && !editor && !equiposCerrados();
  const pedido = abiertos ? (miSolicitud && miSolicitud.a !== miEquipo
    ? `<div class="flex items-center justify-between gap-2 text-xs bg-sky-500/10 border border-sky-500/20 rounded-xl px-3 py-2">
         <span>${ic('arrow-left-right')} Pediste pasar al ${NOMBRE_EQUIPO[miSolicitud.a]}.</span>
         <button data-action="cancelar-solicitud" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-400">Cancelar</button>
       </div>`
    : `<button data-action="pedir-cambio" class="${BTN_SEC} w-full text-xs py-2">${ic('arrow-left-right')} Pasarme al otro equipo</button>`) : '';

  const pendientes = editor && vigentes && solicitudes.length ? `
    <div class="mt-3 rounded-xl border border-sky-500/30 bg-sky-500/5 p-3">
      <h3 class="text-sm font-bold mb-2">${ic('arrow-left-right')} Pedidos de cambio (${solicitudes.length})</h3>
      <ul class="space-y-2">
        ${solicitudes.map(([id, s]) => `
          <li class="flex items-center gap-2 text-sm">
            ${avatar(jugador(id), 24)}
            <span class="flex-1 min-w-0 truncate"><b>${esc(jugador(id).usuario)}</b> quiere pasar al ${NOMBRE_EQUIPO[s.a]}</span>
            <button data-action="aprobar-cambio" data-id="${id}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-emerald-500 text-slate-950">Aprobar</button>
            <button data-action="rechazar-cambio" data-id="${id}" class="rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800 text-slate-300">Rechazar</button>
          </li>`).join('')}
      </ul>
    </div>` : '';

  // Pedidos para rehacer los equipos: todos ven cuántos; quiénes, solo los admins.
  const nRehacer = vigentes ? pedidosRehacer() : 0;
  const quienes = esAdmin() ? quienesRehacer().map(id => jugador(id)?.usuario || D.miembros[id]?.usuario).filter(Boolean) : [];
  const umbral = umbralRehacer(d), pct = Math.min(100, Math.round(100 * nRehacer / umbral));
  const avisoRehacer = nRehacer ? `
    <div class="mt-3 text-xs" title="Con ${umbral} (el ${Math.round(PORCENTAJE_REHACER * 100)}% de los titulares) se rehacen solos, equilibrados">
      <div class="flex items-center gap-2">
        <span class="shrink-0">🙋 <b>${nRehacer}</b> de ${umbral} pidieron rehacerlos</span>
        <div class="flex-1 h-1.5 rounded-full bg-slate-800 overflow-hidden"><div class="h-full rounded-full bg-violet-400 transition-all" style="width:${pct}%"></div></div>
        <span class="font-bold text-violet-300">${pct}%</span>
      </div>
      ${quienes.length ? `<p class="text-violet-200/70 mt-1">${quienes.map(esc).join(', ')} <span class="text-slate-500">(solo lo ven los admins)</span></p>` : ''}
    </div>` : '';
  const yaPedi = D.rehacer.some(r => r.id === yo && r.ronda === rondaActual());
  const botonRehacer = abiertos && rondaActual() ? (yaPedi
    ? `<button data-action="rehacer-cancelar" class="${BTN} w-full text-xs py-2 bg-violet-500/15 text-violet-200 border border-violet-500/30" title="Nadie ve quién lo pidió">🙋 Pediste rehacerlos · Cancelar</button>`
    : `<button data-action="rehacer-pedir" class="${BTN_SEC} w-full text-xs py-2">🙋 Pedir rehacerlos</button>`) : '';

  const modo = eq.editado ? ic('pencil') + ' editado a mano' : eq.modo === 'aleatorio' ? '🎲 aleatorio' : ic('scale') + ' equilibrado';
  const dif = Math.abs(prom('A') - prom('B'));
  return card(`
    <div class="flex items-center justify-between gap-2">
      <h2 class="text-lg font-bold">${ic('swords', 'text-emerald-400')} Equipos</h2>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-500">${modo}</span>
        ${editor && vigentes ? `<button data-action="editar-equipos" class="text-xs rounded-lg px-2.5 py-1 ${editando ? 'bg-emerald-500 text-slate-950 font-semibold' : 'bg-slate-800 hover:bg-slate-700 text-slate-300'}">${editando ? ic('check') + ' Listo' : ic('pencil') + ' Editar'}</button>` : ''}
      </div>
    </div>
    ${vigentes ? '' : `<p class="mt-2 text-xs text-amber-300 bg-amber-500/10 rounded-lg px-3 py-2">${ic('triangle-alert')} La lista de titulares cambió desde que se armaron. ${editor ? 'Volvé a armarlos.' : 'Los van a rearmar.'}</p>`}
    ${pendientes}
    <div class="mt-4 grid grid-cols-[1fr_auto_1fr] items-center gap-2 text-center">
      <div>
        <p class="text-lg sm:text-xl font-black text-red-300 tracking-wide">🔴 EQUIPO A</p>
        ${editor ? `<p class="text-xs text-slate-400">prom <b class="text-slate-200">${prom('A').toFixed(1)}</b></p>` : `<p class="text-xs text-slate-500">${eq.A.length} jugadores</p>`}
      </div>
      <span class="text-xs font-black text-slate-500 rounded-full border border-slate-700 w-9 h-9 grid place-items-center">VS</span>
      <div>
        <p class="text-lg sm:text-xl font-black text-sky-300 tracking-wide">EQUIPO B 🔵</p>
        ${editor ? `<p class="text-xs text-slate-400">prom <b class="text-slate-200">${prom('B').toFixed(1)}</b></p>` : `<p class="text-xs text-slate-500">${eq.B.length} jugadores</p>`}
      </div>
    </div>
    ${editor ? `<p class="text-center text-[11px] mt-1 ${dif <= 0.3 ? 'text-emerald-400' : dif <= 0.8 ? 'text-amber-300' : 'text-red-300'}">${ic('scale')} Diferencia: ${dif.toFixed(1)}</p>` : ''}
    <div class="grid sm:grid-cols-2 gap-3 mt-3">
      ${columna('A', 'border-red-500', 'bg-red-500/5', 'text-red-300')}
      ${columna('B', 'border-sky-500', 'bg-sky-500/5', 'text-sky-300')}
    </div>
    ${avisoRehacer}
    ${editando ? `
      <div class="mt-3 rounded-xl border border-slate-700 bg-slate-800/40 p-3">
        <p class="text-xs text-slate-400">Tocá → o ← para pasar a alguien al otro equipo, o volvé a armarlos:</p>
        ${botones}
      </div>` : ''}
    <div class="grid ${pedido && botonRehacer ? 'grid-cols-2' : 'grid-cols-1'} gap-2 mt-3">${pedido}${botonRehacer}</div>
    ${vigentes ? `<button data-action="copiar-equipos" class="${BTN_SEC} w-full mt-2 text-xs py-2">${ic('copy')} Copiar equipos para WhatsApp</button>` : ''}
    ${editor && !vigentes ? botones : ''}`);
}

function tarjetaMvp() {
  const m = D.mvp, estado = estadoMvp();
  if (!m) return '';
  const quien = id => `${avatar(fichaCandidato(m, id), 28)}<b class="truncate">${esc(nombreCandidato(m, id))}</b>`;
  const editar = esAdmin() && estado !== 'cerrada'
    ? `<button data-action="mvp-editar" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-400">Editar candidatos</button>` : '';

  if (estado === 'pendiente') {
    if (!esAdmin()) return '';
    return card(`
      <div class="flex items-center justify-between gap-2">
        <p class="text-sm">🏆 La votación del jugador del partido abre el ${esc(momentoLindo(m.abre))}.</p>
        ${editar}
      </div>`);
  }

  if (estado === 'abierta') {
    const voto = m.miVoto;
    return `
      <div class="${CARD} border-amber-500/40 bg-gradient-to-br from-amber-500/10 to-slate-900">
        <div class="flex items-start justify-between gap-2">
          <div>
            <h2 class="text-lg font-black">🏆 Jugador del partido</h2>
            <p class="text-xs text-slate-400">Del ${esc(fechaLinda(m.id))} · se vota hasta ${hastaCuando(m)}</p>
          </div>
          ${editar}
        </div>
        ${voto
          ? `<div class="mt-3 flex items-center gap-2 text-sm">${ic('circle-check', 'text-emerald-400')} Votaste a ${quien(voto)}
               <button data-action="mvp-votar" class="inline-flex items-center justify-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-semibold bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition active:scale-[.98] shrink-0 text-slate-400 ml-auto">Cambiar</button></div>`
          : `<p class="mt-3 text-sm text-amber-200">${ic('triangle-alert')} Todavía no votaste.</p>
             <button data-action="mvp-votar" class="${BTN} w-full mt-2 bg-amber-400 hover:bg-amber-300 text-slate-950">🏆 Votar al mejor del partido</button>`}
        ${sinMiVoto(m.candidatos).length ? `
          <div class="mt-3 pt-3 border-t border-amber-500/20 flex items-center gap-3">
            <p class="flex-1 text-xs text-slate-300">Ya que estás, calificá a los que jugaron y todavía no calificaste.</p>
            <button data-action="calificar-rapido" data-ids="${esc(m.candidatos.join(','))}" class="${BTN_SEC} text-xs shrink-0">⭐ Calificar (${sinMiVoto(m.candidatos).length})</button>
          </div>` : ''}
      </div>`;
  }

  // Cerrada: el resultado se muestra 3 días.
  if (Date.now() > m.cierra + 3 * DIA || !m.votos) return '';
  const r = resultadoMvp(m);
  const cuerpo = !r.ganadores.length
    ? `<p class="mt-2 text-sm text-slate-400">Hubo ${r.total} ${r.total === 1 ? 'voto' : 'votos'}: hacen falta al menos ${MIN_VOTOS_MVP}, así que esta vez quedó desierto.</p>`
    : `<div class="mt-3 flex flex-wrap justify-center gap-4">
         ${r.ganadores.map(id => `
           <div class="flex flex-col items-center gap-1">
             ${avatar(fichaCandidato(m, id), 72)}
             <b>${esc(nombreCandidato(m, id))}</b>
           </div>`).join('')}
       </div>
       <p class="text-center text-xs text-slate-400 mt-2">${r.ganadores.length > 1 ? 'Empate con' : 'Con'} ${r.max} de ${r.total} votos</p>
       <button data-action="mvp-copiar" class="${BTN} w-full mt-3 text-sm bg-green-600 hover:bg-green-500 text-white">${ic('copy')} Copiar resultado para WhatsApp</button>`;
  return `
    <div class="${CARD} border-amber-500/40 bg-gradient-to-br from-amber-500/10 to-slate-900">
      <h2 class="text-lg font-black">🏆 Jugador del partido</h2>
      <p class="text-xs text-slate-400">Del ${esc(fechaLinda(m.id))}</p>
      ${cuerpo}
    </div>`;
}

          <button data-action="decidir" data-id="${p.id}" data-si="1" class="${BTN_OK} text-xs px-3 py-1.5">Aceptar</button>
